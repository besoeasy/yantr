<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Yantr - Turn any server, PC, laptop, or Mac into your own self-hosted homelab. Apps stay isolated and never touch your filesystem." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="light dark" />
  <title>Yantr</title>
  <script>
    (function() {
      const stored = localStorage.getItem("yantr-theme");
      const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      if (stored === "light" || (!stored && prefersLight)) {
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";
      } else {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='60' font-size='60' font-weight='bold' text-anchor='middle' fill='%23000'%3E⚙%3C/text%3E%3C/svg%3E" />
</head>

<body class="antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
