x-yantr:
  name: "mosparo"
  tags: [spam, forms, security, self-hosted, podman]
  short_description: "Modern, privacy-friendly spam protection for self-hosted web forms."
  description: >
    A self-hosted spam protection tool that uses advanced techniques
    to block automated submissions on your web forms. Works as a
    drop-in replacement for CAPTCHA with a superior user experience and privacy.
  usecases: ["Protect web forms from spam.", "Block automated bot submissions.", "Replace CAPTCHA on websites."]
  website: "https://github.com/mosparo/mosparo"

services:
  mosparo:
    image: docker.io/mosparo/mosparo:latest
    labels:
      yantr.app: "mosparo"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    environment:
      MOSPARO_DATABASE_URL: ${MOSPARO_DATABASE_URL:-sqlite:///%kernel.project_dir%/var/data.sqlite}
    ports:
      - "8080"
    volumes:
      - mosparo_data:/data
    restart: unless-stopped

volumes:
  mosparo_data:
