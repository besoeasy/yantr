x-yantr:
  name: "Whoami"
  logo: "QmZvfwKJRMrMvzUyRyrLJjShVCsGozSAPDrCq6Vg1Fpde5"
  tags: [tools, utility, self-hosted, homelab, docker, open-source, testing]
  short_description: "Simple HTTP service that displays request details - ideal for testing proxies and ingress."
  description: >
    Whoami is an extremely simple HTTP service that prints all incoming request details back to the client.
    When you access it, it displays the hostname, IP address, headers, and other request information.
    It's primarily used for testing reverse proxies, load balancers, Kubernetes ingress, and Docker networking.
    No configuration is needed — just deploy and hit the URL.
  usecases: ["Test reverse proxy configurations.", "Verify what headers are being forwarded.", "Check your public IP as seen by the server.", "Debug Docker networking and port forwarding."]
  website: "https://github.com/traefik/whoami"
  notes: ["Tiny image - only displays request info", "Useful for testing but not much else", "No configuration needed - just works"]

services:
  whoami:
    image: traefik/whoami
    ports:
      - "80"
    restart: unless-stopped
    labels:
      yantr.service: "Web UI"
      yantr.port.80: "HTTP"
