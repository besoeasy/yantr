services:
  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    container_name: camofox
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY}
    volumes:
      - camofox_data:/home/node/.camofox
    ports:
      - "9377"
    restart: unless-stopped
    labels:
      yantr.app: "camofox"
      yantr.service: "Web UI"

volumes:
  camofox_data:
    name: camofox_data
