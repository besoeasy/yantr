x-yantr:
  name: Camofox Browser
  tags: [ browser, proxy, privacy, webui, self-hosted ]
  short_description: Anti-detection headless browser with REST API, VNC
    login, screenshots, and data extraction.
  description: Headless Chromium browser container with a REST API for web
    automation. Supports screenshot capture, PDF generation, dynamic data
    extraction, and form automation. Uses stealth techniques to avoid bot
    detection and provides cookie and session management for seamless
    integration with any stack.
  usecases:
    [
      "Capture full-page screenshots and PDFs of websites for archiving,
        monitoring, or documentation.",
      Extract and scrape dynamic web content rendered by JavaScript with
        programmatic API access.,
      "Automate web form submissions, login flows, and browser-based workflows
        via REST API.",
      Take scheduled screenshots of dashboards or web pages for visual
        monitoring and change detection.
    ]
  website: https://github.com/jo-inc/camofox-browser
  notes:
    [
      API key is required and auto-generated on first deploy via the env
        generator,
      Port 9377 serves the REST API endpoint,
      Port 6080 provides noVNC web UI for interactive browser access (enable
        with ENABLE_VNC=1),
      Based on Camoufox (Firefox fork) - expect ~500MB+ RAM usage
    ]
  env_generators:
    CAMOFOX_API_KEY:
      length: 32
      charset: alnum_symbols

services:
  camofox:
    image: ghcr.io/jo-inc/camofox-browser:latest
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY}
      ENABLE_VNC: "1"
    volumes:
      - camofox_data:/home/node/.camofox
    ports:
      - "9377"
      - "6080"
    restart: unless-stopped
    labels:
      yantr.app: camofox
      yantr.service.9377: REST API
      yantr.port.9377: HTTP
      yantr.service.6080: noVNC Browser UI
      yantr.port.6080: HTTP

volumes:
  camofox_data:
    name: camofox_data
