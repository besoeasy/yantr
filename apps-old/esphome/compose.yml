services:
  server:
    image: esphome/esphome:latest
    container_name: esphome
    labels:
      yantr.app: "esphome"
      yantr.service: "Web UI"
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - esphome_config:/config
    restart: unless-stopped

volumes:
  esphome_config:
