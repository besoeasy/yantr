<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7c948"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Document -->
  <rect x="64" y="44" width="100" height="130" rx="8" fill="#2d1b4e" stroke="#ff6b35" stroke-width="3"/>
  <rect x="64" y="44" width="100" height="28" rx="8" fill="#ff6b35" opacity="0.3"/>
  <!-- Text lines on document -->
  <rect x="80" y="84" width="60" height="6" rx="2" fill="#ff6b35" opacity="0.5"/>
  <rect x="80" y="98" width="50" height="6" rx="2" fill="#ff6b35" opacity="0.4"/>
  <rect x="80" y="112" width="55" height="6" rx="2" fill="#ff6b35" opacity="0.35"/>
  <rect x="80" y="126" width="40" height="6" rx="2" fill="#ff6b35" opacity="0.3"/>
  <rect x="80" y="140" width="52" height="6" rx="2" fill="#ff6b35" opacity="0.25"/>
  <!-- Pen / pencil -->
  <g transform="translate(160, 100) rotate(45)">
    <rect x="-8" y="-60" width="16" height="80" rx="3" fill="url(#pen)"/>
    <polygon points="-8,20 8,20 0,40" fill="#f7c948"/>
    <rect x="-8" y="-60" width="16" height="12" rx="3" fill="#ff6b35"/>
  </g>
  <!-- Pen tip glow -->
  <circle cx="185" cy="135" r="6" fill="#f7c948" opacity="0.4"/>
</svg>