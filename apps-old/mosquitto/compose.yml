services:
  broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    labels:
      yantr.app: "mosquitto"
      yantr.service: "MQTT Broker"
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "1883"
      - "9001"
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:
