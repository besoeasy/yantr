x-yantr:
  name: Linkding
  tags: [bookmarks, productivity, self-hosted, manager, privacy]
  short_description: Minimal and fast self-hosted bookmark manager with
    full-text search and browser extensions.
  description: >
    Linkding is a minimal, blazing-fast self-hosted bookmark manager.
    Features full-text search, automatic metadata extraction, tag-based
    organization, and browser extensions for one-click saving. Keeps your
    bookmarks private and organized with zero bloat.
  usecases:
    [
      "Organize and quickly find your bookmarks with full-text search, tags,
        and a clean distraction-free interface.",
      "Import bookmarks from browsers and other services, then access them
        from any device with browser extension support.",
    ]
  website: https://github.com/sissbruecker/linkding
  env_generators:
    LD_SUPERUSER_NAME: { length: 8, charset: alpha }
    LD_SUPERUSER_PASSWORD: { length: 20, charset: alnum_symbols }

services:
  linkding:
    image: docker.io/sissbruecker/linkding:latest
    labels:
      yantr.app: linkding
      yantr.service.9090: Web UI
      yantr.port.9090: HTTP
    ports:
      - "9090"
    environment:
      LD_SUPERUSER_NAME: ${LD_SUPERUSER_NAME}
      LD_SUPERUSER_PASSWORD: ${LD_SUPERUSER_PASSWORD}
    volumes:
      - linkding_data:/etc/linkding/data
    restart: unless-stopped

volumes:
  linkding_data:
