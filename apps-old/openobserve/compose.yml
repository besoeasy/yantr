x-yantr:
  name: OpenObserve
  tags: [monitoring, observability, logs, self-hosted, analytics]
  short_description: "Observability platform for logs, metrics, and traces \u2014 alternative to Elasticsearch."
  description: >
    OpenObserve is a cloud-native observability platform for indexing logs,
    metrics, and distributed traces. It provides high-performance search,
    SQL-like queries, built-in visual dashboards, and OpenTelemetry
    compatibility while consuming a fraction of the memory and storage
    required by Elasticsearch.
  usecases:
    [
      "Centralize logs from Docker containers, applications, and system
        services with a lightweight alternative to Elasticsearch.",
      "Build dashboards and alerts for metrics and traces using a SQL-like
        query language with built-in visualization.",
    ]
  website: https://openobserve.ai
  env_generators:
    ZO_ROOT_USER_PASSWORD: { length: 20, charset: alnum_symbols }

services:
  openobserve:
    image: docker.io/openobserve/openobserve:latest
    labels:
      yantr.app: openobserve
      yantr.service.5080: Web UI
      yantr.port.5080: HTTP
    ports:
      - "5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve_data:/data
    restart: unless-stopped

volumes:
  openobserve_data:
