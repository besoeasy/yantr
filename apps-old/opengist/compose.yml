x-yantr:
  name: "opengist"
  tags: [pastebin, gists, git, self-hosted, podman]
  short_description: "Self-hosted pastebin and GitHub Gist alternative powered by Git."
  description: >
    Opengist is a self-hosted pastebin and GitHub Gist alternative where every
    snippet lives in a Git repository. Create and share public, unlisted or
    private gists from the web UI or with standard Git commands, with syntax
    highlighting, code search, revision history, forks, likes and embedding.
  usecases: [
    "Share code snippets and text as pastebins.",
    "Version and edit gists with standard Git commands.",
    "Keep private gists hosted entirely on your own hardware."
  ]
  website: "https://opengist.io"
  env_generators:
    OG_SECRET_KEY: { length: 32, charset: base64url }

services:
  opengist:
    image: ghcr.io/thomiceli/opengist:latest
    labels:
      yantr.app: "opengist"
      yantr.service.6157: "Web UI"
      yantr.port.6157: "HTTP"
      yantr.service.2222: "SSH"
      yantr.port.2222: "TCP"
    environment:
      OG_SECRET_KEY: ${OG_SECRET_KEY}
      OG_EXTERNAL_URL: ${APP_URL:-http://localhost:6157}
    ports:
      - "6157"
      - "2222"
    volumes:
      - opengist_data:/opengist
    restart: unless-stopped

volumes:
  opengist_data: