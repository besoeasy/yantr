x-yantr:
  name: "skysend"
  tags: [filesharing, encryption, privacy, self-hosted, podman]
  short_description: "Encrypted peer-to-peer file sharing with expiring links."
  description: >
    SkySend is an end-to-end encrypted file sharing service for your
    homelab. Upload files, configure download limits and expiration timers,
    and share secure download links with friends without exposing
    unencrypted data.
  usecases: ["Send large files securely.", "Share files with automatic expiry."]
  website: "https://github.com/Skyfay/SkySend"

services:
  skysend:
    image: ghcr.io/skyfay/skysend:latest
    labels:
      yantr.app: "skysend"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - skysend_data:/data
    restart: unless-stopped

volumes:
  skysend_data:
