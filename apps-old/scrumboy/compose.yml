x-yantr:
  name: "scrumboy"
  tags: [kanban, project-management, productivity, self-hosted, podman]
  short_description: "Kanban-style task, sprint, and project management board."
  description: >
    Scrumboy is an agile project management and Kanban board application.
    Organize tasks across customizable columns, assign priority labels,
    track sprint progress, and streamline team or personal workflows with
    ease.
  usecases: ["Manage project tasks on a Kanban board.", "Track team workflow and priorities."]
  website: "https://github.com/markrai/scrumboy"

services:
  scrumboy:
    image: ghcr.io/markrai/scrumboy:latest
    labels:
      yantr.app: "scrumboy"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - scrumboy_data:/data
    restart: unless-stopped

volumes:
  scrumboy_data:
