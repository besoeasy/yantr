x-yantr:
  name: Homepage
  tags: [dashboard, monitoring, self-hosted, homepage, homelab]
  short_description: "A modern, highly customizable application dashboard and startpage for your homelab."
  description: >
    Homepage is a self-hosted application dashboard that aggregates
    services, containers, and bookmarks into a unified dashboard. Supports
    50+ service integrations, system metrics widgets, and clean YAML
    configuration for a fast, elegant homelab startpage.
  usecases:
    [
      "Create a personalized dashboard that aggregates all your self-hosted
        services in one place with real-time status indicators.",
      "Monitor Docker containers, system resources, and third-party APIs from
        a single beautiful interface.",
    ]
  website: https://gethomepage.dev

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    labels:
      yantr.app: homepage
      yantr.service.3000: Dashboard
      yantr.port.3000: HTTP
    ports:
      - "3000"
    volumes:
      - homepage_config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  homepage_config:
