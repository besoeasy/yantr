services:
  excalidraw:
    image: ghcr.io/ozencb/excalidraw-persist:latest
    container_name: excalidraw
    ports:
      - "4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_PATH: /app/data/database.sqlite
    volumes:
      - excalidraw_data:/app/data
    restart: unless-stopped
    labels:
      yantr.app: "excalidraw"
      yantr.service: "Web UI"

volumes:
  excalidraw_data:
