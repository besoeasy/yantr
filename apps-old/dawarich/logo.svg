<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Map grid lines (subtle) -->
  <line x1="60" y1="80" x2="60" y2="200" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <line x1="100" y1="80" x2="100" y2="200" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <line x1="140" y1="80" x2="140" y2="200" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <line x1="180" y1="80" x2="180" y2="200" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <line x1="40" y1="120" x2="210" y2="120" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <line x1="40" y1="160" x2="210" y2="160" stroke="#4caf50" stroke-width="1" opacity="0.15"/>
  <!-- Route path -->
  <path d="M60 180 Q80 140 100 150 Q120 160 130 120 Q140 90 170 100 Q190 108 195 85" stroke="url(#route)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="8 4" opacity="0.7"/>
  <!-- Route dots -->
  <circle cx="60" cy="180" r="5" fill="#4caf50" opacity="0.7"/>
  <circle cx="100" cy="150" r="4" fill="#4caf50" opacity="0.5"/>
  <circle cx="130" cy="120" r="4" fill="#4caf50" opacity="0.5"/>
  <circle cx="170" cy="100" r="4" fill="#4caf50" opacity="0.5"/>
  <!-- Map pin (destination) -->
  <path d="M195 85 c0-18-14-30-28-30 s-28 12-28 30 c0 24 28 48 28 48 s28-24 28-48z" fill="url(#pin)" transform="translate(0,-30)"/>
  <circle cx="195" cy="55" r="10" fill="#fff" opacity="0.9"/>
  <!-- Pin glow -->
  <circle cx="195" cy="85" r="30" fill="#ff5722" opacity="0.08"/>
</svg>