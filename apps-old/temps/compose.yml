x-yantr:
  name: "temps"
  tags: [monitoring, analytics, self-hosted, podman, devops]
  short_description: "Open-source Vercel, Sentry, PostHog, and Pingdom alternative."
  description: >
    A self-hosted platform combining uptime monitoring, error tracking,
    product analytics, and deployment tools. Replaces multiple SaaS services
    with a single unified stack that runs reliably on your hardware.
  usecases: ["Monitor uptime and errors.", "Track product analytics.", "Manage deployments."]
  website: "https://github.com/gotempsh/temps"
  env_generators:
    ADMIN_PASSWORD: {length: 20, charset: alnum_symbols}

services:
  temps:
    image: ghcr.io/gotempsh/temps:latest
    labels:
      yantr.app: "temps"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080"
    volumes:
      - temps_data:/data
    restart: unless-stopped

volumes:
  temps_data:
