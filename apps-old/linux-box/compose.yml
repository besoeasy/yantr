x-yantr:
  name: linux-box
  customapp: true
  tags: [ linux, debian, ssh, terminal, server ]
  short_description: Debian Linux container with SSH server for remote shell access.
  description: A self-hosted Debian 13 environment with OpenSSH server. Creates a
    sudo user from credentials on first run. Persists home directory in a Docker
    volume. Access via SSH clients on the published port. Ideal for dev
    sandboxes and remote Linux administration.
  usecases:
    [
      Connect via any SSH client for a full Debian shell experience.,
      "Install packages, run commands, and test configurations in a clean
        Debian environment."
    ]
  website: https://www.debian.org/
  notes:
    [
      "Connect with: ssh <USERNAME>@<host> -p <mapped-port>",
      The user is granted passwordless sudo for convenience in dev
        environments.,
      Direct SSH access uses the host port mapped to container port 22.,
      "Built from debian:13-slim with minimal packages (openssh-server, sudo,
        git, curl)."
    ]
  env_generators:
    USERNAME:
      length: 8
      charset: alpha
    PASSWORD:
      length: 16
      charset: alnum_symbols

services:
  linux-box:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: linux-box
    restart: unless-stopped
    labels:
      yantr.app: "linux-box"
      yantr.service.22: SSH
      yantr.port.22: TCP
    environment:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
    ports:
      - "22"
    volumes:
      - debian-home:/home

volumes:
  debian-home:
    name: debian-home
