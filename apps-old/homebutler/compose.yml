x-yantr:
  name: "homebutler"
  tags: [homelab, chat, management, ai, self-hosted]
  short_description: "Manage and inspect your homelab through conversational chat."
  description: >
    HomeButler is an intelligent conversational assistant for homelabs.
    Monitor running containers, restart services, query system metrics, and
    manage home server tasks using natural language in your web browser.
  usecases: ["Manage homelab via chat commands.", "Control Docker services with AI."]
  website: "https://github.com/Higangssh/homebutler"

services:
  homebutler:
    image: ghcr.io/higangssh/homebutler:latest
    labels:
      yantr.app: "homebutler"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - homebutler_data:/data
    restart: unless-stopped

volumes:
  homebutler_data:
