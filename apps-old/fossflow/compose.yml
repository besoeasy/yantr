x-yantr:
  name: FossFLOW
  tags: [ productivity, networking, self-hosted, homelab, docker ]
  short_description: Isometric diagram editor for network architecture, cloud
    infrastructure, and flowcharts.
  description: FossFLOW is an isometric diagram editor for infrastructure and
    flowcharts. It offers an isometric grid, cloud provider icons, network
    components, auto-save, offline support, and export to PNG/SVG—ideal for
    documenting homelab and cloud architectures.
  usecases:
    [
      Create homelab network diagrams.,
      Document cloud infrastructure.,
      Build isometric flowcharts.
    ]
  website: https://github.com/stan-smith/FossFLOW
  notes: [ Auto-save enabled, Export to PNG/SVG, Offline capable ]

services:
  fossflow:
    image: stnsmith/fossflow:master-6cb6496
    labels:
      yantr.app: fossflow
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - fossflow_diagrams:/data/diagrams
    environment:
      NODE_ENV: production
      ENABLE_SERVER_STORAGE: "true"
      STORAGE_PATH: /data/diagrams
      ENABLE_GIT_BACKUP: "false"
    restart: unless-stopped

volumes:
  fossflow_diagrams: null
