x-yantr:
  name: Miniflux
  tags:
    - rss
    - news
    - reading
    - utility
    - productivity
  short_description: Minimalist self-hosted RSS reader with focus mode and keyboard navigation.
  description: Miniflux is a fast and minimal RSS reader with an emphasis on
    usability and privacy. It supports managing subscriptions, auto-refresh
    schedules, and read/unread state in a clean interface that runs entirely in
    the browser.
  usecases:
    - Centralize RSS feeds into one lightweight self-hosted interface.
    - Read articles distraction-free with built-in keyboard shortcuts.
    - Share feeds and integrations with automation pipelines.
  website: https://miniflux.app/
  logo: QmMinifluxLogoCID1234567890abcdef1234567890abc
  notes:
    - Set a secure ADMIN_PASSWORD before public exposure.
    - Store feed database backups from Postgres data volume.
services:
  miniflux-db:
    image: postgres:15-alpine
    container_name: miniflux-db
    restart: unless-stopped
    labels:
      yantr.app: miniflux
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: miniflux
    volumes:
      - miniflux_db:/var/lib/postgresql/data
  miniflux:
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: unless-stopped
    labels:
      yantr.app: miniflux
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    depends_on:
      - miniflux-db
    ports:
      - "8080"
    environment:
      DATABASE_URL: postgres://miniflux:changeme@miniflux-db:5432/miniflux?sslmode=disable
      RUN_MIGRATIONS: "true"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      BASE_URL: http://localhost:8080
    volumes:
      - miniflux_data:/var/lib/miniflux

volumes:
  miniflux_db: null
  miniflux_data: null
