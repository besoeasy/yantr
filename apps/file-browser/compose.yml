x-yantr:
  name: File Browser
  tags: [ files, storage, self-hosted, file-manager, web ]
  short_description: Self-hosted web file manager with a clean, modern interface.
  description: File Browser provides a web-based file management interface for
    your server. Browse, upload, delete, preview, rename and edit files.
    Supports user management, sharing, and authentication. A lightweight
    alternative to cloud storage services.
  usecases:
    [
      Browse and manage files on your server through any web browser.,
      Upload and download files securely without exposing SSH access.,
      Share files with others via direct links.
    ]
  website: https://filebrowser.org
  logo: QmebPcQTwXvzUG4sG2X9mCZ3raT12fKXDovocFYKyTVs9j

services:
  server:
    image: filebrowser/filebrowser:latest
    container_name: file-browser
    labels:
      yantr.app: file-browser
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    restart: unless-stopped
    environment:
      FB_PORT: 80
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /data
      FB_NOAUTH: "true"
    ports:
      - "80"
    volumes:
      - file_browser_db:/database
      - file_browser_data:/data

volumes:
  file_browser_db: null
  file_browser_data: null
