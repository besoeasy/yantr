x-yantr:
  name: File Browser
  tags: [ files, storage, self-hosted, file-manager, web ]
  short_description: Self-hosted web file manager with a clean, modern interface.
  description: >
    File Browser provides a web UI for browsing, uploading, downloading,
    previewing, and editing files stored on a host volume. This stack disables
    built-in authentication, so restrict access to a trusted network or place it
    behind an authenticated proxy before exposing it.
  usecases:
    [
      Browse and manage files on your server through any web browser.,
      Upload and download files through the web UI on a trusted network.,
      Share files with others via direct links.
    ]
  website: https://filebrowser.org
  notes: ["This stack disables built-in authentication; restrict access to a trusted network or use an authenticated proxy."]

services:
  server:
    image: docker.io/filebrowser/filebrowser:latest
    labels:
      yantr.app: file-browser
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    restart: unless-stopped
    environment:
      FB_PORT: 80
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /data
      FB_NOAUTH: "true"
    ports:
      - "80"
    volumes:
      - file_browser_db:/database
      - file_browser_data:/data

volumes:
  file_browser_db: null
  file_browser_data: null
