x-yantr:
  name: Hermes Agent
  tags: [ ai, agent, terminal, self-hosted, docker ]
  short_description: Self-hosted AI agent with web terminal and messaging gateway.
  description: Hermes Agent is a self-hosted AI agent platform combining a web
    terminal dashboard with an underlying messaging gateway. It provides a
    browser-accessible terminal interface backed by the Hermes gateway service,
    enabling you to run and interact with AI agents entirely on your own
    infrastructure.
  usecases:
    [
      Access a browser-based terminal to interact with AI agents running on
        your own server without relying on third-party cloud services.,
      Run the Hermes messaging gateway locally to orchestrate AI agent tasks
        and automate workflows with full control over your data.,
      Use the health-check API to monitor gateway status from the web
        dashboard and ensure agent services are always running.
    ]
  website: https://github.com/NousResearch/hermes
  notes:
    [
      Set HERMES_API_KEY to a strong secret before exposing the gateway — both
        the web and gateway services must share the same value.,
      The gateway API server binds to 0.0.0.0 inside the container; it is not
        exposed to the host but is reachable by the web service on the internal
        Docker network.
    ]

services:
  web:
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v2026.4.13
    container_name: hermes-agent
    hostname: hermes
    init: true
    user: 1000:1000
    labels:
      yantr.app: hermes-agent
      yantr.service.18789: Web UI
      yantr.port.18789: HTTP
    restart: on-failure
    depends_on:
      - gateway
    ports:
      - "18789"
    volumes:
      - hermes_data:/opt/data
    environment:
      HERMES_API_KEY: ${HERMES_API_KEY:-yantr12hermes}
      GATEWAY_HEALTH_URL: http://gateway:8642
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    labels:
      yantr.app: hermes-agent
      yantr.service.18789: Web UI
      yantr.port.18789: HTTP
    command: gateway run
    stop_grace_period: 1m
    restart: on-failure
    volumes:
      - hermes_data:/opt/data
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:-yantr12hermes}

volumes:
  hermes_data: null
