x-yantr:
  name: MoviePilot
  tags: [ media, automation, downloader, nas, self-hosted ]
  short_description: NAS media automation for subscribing, downloading, and
    organizing movies and TV shows.
  description: MoviePilot is a NAS-focused media automation tool for subscribing
    to and automatically downloading movies and TV shows. It handles search,
    downloading via qBittorrent/Transmission/rTorrent, renaming and organizing
    media, and syncing with media servers like Jellyfin and Plex.
  usecases:
    [
      "Automatically subscribe to TV shows and download new episodes as they
        air, then organize them into your media server.",
      Search and download movies by title across multiple torrent indexers
        with a single click.,
      Automatically rename and move downloaded media files into a clean
        library structure compatible with Jellyfin or Plex.,
      "Manage running download tasks across qBittorrent, Transmission, or
        rTorrent from a single unified dashboard."
    ]
  website: https://movie-pilot.org/
  logo: QmYhcfGgTfDj5Eb8srdJMzJBhmnw1ctWpJZgF5efb3aSfb
  notes:
    [
      Default Web UI is on port 3000; API backend listens on port 3001,
      Set SUPERUSER and SUPERUSER_PASSWORD environment variables before first
        launch,
      "Mount your media directory (e.g., /media) for MoviePilot to organize
        downloaded files",
      "Requires a compatible downloader (qBittorrent, Transmission, or
        rTorrent) configured separately",
      "For production use, consider using PostgreSQL and Redis instead of the
        default SQLite database"
    ]
  env_generators:
    SUPERUSER:
      length: 8
      charset: alpha
    SUPERUSER_PASSWORD:
      length: 32
      charset: alnum_symbols

services:
  moviepilot:
    stdin_open: true
    tty: true
    image: jxxghp/moviepilot-v2:latest
    container_name: moviepilot
    hostname: moviepilot
    ports:
      - "3000"
      - "3001"
    volumes:
      - moviepilot-config:/config
      - moviepilot-core:/moviepilot/.cache/ms-playwright
      - /media:/media
    environment:
      NGINX_PORT: 3000
      PORT: 3001
      PUID: 0
      PGID: 0
      UMASK: "000"
      TZ: ${TZ:-Asia/Shanghai}
      SUPERUSER: ${SUPERUSER}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    restart: unless-stopped
    labels:
      yantr.app: moviepilot
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
      yantr.service.3001: API
      yantr.port.3001: HTTP

volumes:
  moviepilot-config:
    name: moviepilot-config
  moviepilot-core:
    name: moviepilot-core
