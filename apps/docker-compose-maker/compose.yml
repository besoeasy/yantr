x-yantr:
  name: "docker-compose-maker"
  tags: [podman, utility, generator, self-hosted, devops]
  short_description: "Visual Compose configuration generator, editor, and validator."
  description: >
    A visual web application for creating and editing Compose
    configurations. Define services, volumes, networks, and environment
    variables visually, then export clean, deployable compose YAML files
    with ease.
  usecases: ["Generate compose files visually.", "Edit existing compose configs.", "Learn Docker Compose syntax."]
  website: "https://github.com/homarr/docker-compose-maker"

services:
  docker-compose-maker:
    image: ghcr.io/homarr/docker-compose-maker:latest
    labels:
      yantr.app: "docker-compose-maker"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - docker_compose_maker_data:/data
    restart: unless-stopped

volumes:
  docker_compose_maker_data:
