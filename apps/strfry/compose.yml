x-yantr:
  name: Strfry
  tags:
    - network
    - social
    - storage
    - files
    - utility
  short_description: High-performance nostr relay with LMDB storage for
    decentralized social networking.
  description: Strfry is a high-performance relay for Nostr (Notes and Other Stuff
    Transmitted by Relays), a decentralized social network protocol. Nostr uses
    simple JSON messages that get relayed between users through multiple relays
    - no central server required. Running your own Strfry relay gives you...
  usecases:
    - Run your own nostr relay to support the decentralized network.
    - Host a relay for friends or community with custom policies.
    - Build your own piece of the nostr network.
    - Use as a personal relay for your own notes.
  website: https://github.com/hoytech/strfry
  logo: QmNR4kyKJs3sZwdRJZ47z5feUWn6S8aJw31wzZrXK2fVcD
  notes:
    - Uses LMDB for fast, high-capacity storage
    - Connects to other relays to share events
    - Configure limits for spam prevention
services:
  strfry:
    image: ghcr.io/hoytech/strfry:latest
    container_name: strfry-relay
    restart: unless-stopped
    ports:
      - "7777"
    volumes:
      - strfry-data:/app/strfry-db
    configs:
      - source: strfry-config
        target: /etc/strfry.conf
    command: relay --config /etc/strfry.conf
    labels:
      yantr.app: strfry
      yantr.service.7777: Relay
      yantr.port.7777: HTTP

volumes:
  strfry-data: null

configs:
  strfry-config:
    content: >
      ##

      ## strfry config

      ##


      # Directory that contains the strfry LMDB database (restart required)

      db = "./strfry-db/"


      dbParams {
          maxreaders = 256
          mapsize = 10995116277760
          noReadAhead = false
      }


      events {
          maxEventSize = 65536
          rejectEventsNewerThanSeconds = 900
          rejectEventsOlderThanSeconds = 94608000
          rejectEphemeralEventsOlderThanSeconds = 60
          ephemeralEventsLifetimeSeconds = 300
          maxNumTags = 2000
          maxTagValSize = 1024
      }


      relay {
          bind = "0.0.0.0"
          port = 7777
          nofiles = 1000000
          realIpHeader = ""

          info {
              name = "Strfry Relay"
              description = "A high-performance nostr relay powered by strfry"
              pubkey = ""
              contact = "https://github.com/besoeasy/Yantr"
              icon = "https://github.com/hoytech/strfry/raw/master/docs/strfry.svg"
              nips = ""
          }

          maxWebsocketPayloadSize = 131072
          maxReqFilterSize = 200
          autoPingSeconds = 55
          enableTcpKeepalive = false
          queryTimesliceBudgetMicroseconds = 10000
          maxFilterLimit = 500
          maxSubsPerConnection = 20

          writePolicy {
              plugin = ""
          }

          compression {
              enabled = true
              slidingWindow = true
          }

          logging {
              dumpInAll = false
              dumpInEvents = false
              dumpInReqs = false
              dbScanPerf = false
              invalidEvents = true
          }

          numThreads {
              ingester = 3
              reqWorker = 3
              reqMonitor = 3
              negentropy = 2
          }

          negentropy {
              enabled = true
              maxSyncEvents = 1000000
          }
      }
