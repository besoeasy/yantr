x-yantr:
  name: "1024house"
  tags: [family, couples, productivity, self-hosted, podman]
  short_description: "Shared digital home and private space for couples and families."
  description: >
    A self-hosted private digital space designed for couples and families to
    stay connected. Share daily notes, shared memories, schedules, household
    lists, and private messages in a secure homelab environment you control.
  usecases: ["Share daily moments with your partner.", "Manage family tasks and reminders."]
  website: "https://github.com/bbblackclark/1024house"

services:
  1024house:
    image: ghcr.io/bbblackclark/1024house:latest
    labels:
      yantr.app: "1024house"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - house_1024_data:/data
    restart: unless-stopped

volumes:
  house_1024_data:
