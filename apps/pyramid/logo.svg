<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <circle cx="128" cy="128" r="128" fill="#1a1a2e"/>
  
  <g filter="url(#shadow)">
    <!-- Pyramid right face -->
    <polygon points="128,58 198,198 128,168" fill="url(#shadowGrad)" opacity="0.9"/>
    
    <!-- Pyramid left face -->
    <polygon points="128,58 58,198 128,168" fill="url(#pyramidGrad)"/>
    
    <!-- Pyramid base highlight -->
    <polygon points="58,198 198,198 128,168" fill="#E65100" opacity="0.3"/>
  </g>
  
  <!-- Small accent circles representing nodes/connections -->
  <circle cx="128" cy="58" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="88" cy="128" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="168" cy="128" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="58" cy="198" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="198" cy="198" r="4" fill="#fff" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="128" y1="58" x2="88" y2="128" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="128" y1="58" x2="168" y2="128" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="88" y1="128" x2="58" y2="198" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  <line x1="168" y1="128" x2="198" y2="198" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
</svg>
