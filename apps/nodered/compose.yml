x-yantr:
  name: Node-RED
  tags: [ automation, iot, workflow, development, self-hosted ]
  short_description: Flow-based visual programming tool for wiring together
    hardware, APIs, and online services.
  description: >
    Node-RED is a visual, flow-based programming tool for connecting
    hardware devices, APIs, and online services. Its browser-based flow
    editor lets you wire together nodes from an extensive library, making it
    simple to build home automation workflows and IoT integrations.
  usecases:
    [
      Wire together IoT devices and sensors into automated workflows.,
      Integrate APIs and webhooks for event-driven automation.,
      Build dashboards for monitoring and controlling connected devices.
    ]
  website: https://nodered.org
  notes:
    [
      "Install additional nodes via the Palette Manager in the browser UI.",
      "Flows are stored in the volume and persist across restarts.",
      "Useful companion for MQTT, Zigbee2MQTT, and ESPHome setups."
    ]

services:
  nodered:
    image: nodered/node-red:latest
    labels:
      yantr.app: nodered
      yantr.service.1880: Web UI
      yantr.port.1880: HTTP
    ports:
      - "1880"
    volumes:
      - nodered_data:/data
    environment:
    restart: unless-stopped

volumes:
  nodered_data: null
