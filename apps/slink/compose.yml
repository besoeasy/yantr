x-yantr:
  name: "Slink"
  tags: [images, sharing, photos, files, self-hosted]
  short_description: "Privacy-first image sharing with albums and expiring links."
  description: >
    An image host for people who would rather not upload their photos to a third
    party. Share pictures through short links, group them into albums, and keep
    every original under your own control. EXIF metadata is stripped and images
    recompressed on upload, so location data does not travel with the file.
  usecases:
    [
      "Share photos through short links without uploading them to a public host.",
      "Collect images from friends into a shared album you control.",
      "Strip EXIF location data from pictures before sharing them.",
    ]
  website: "https://docs.slinkapp.io/"
  notes:
    [
      "TLS enforcement is off because the container is reached over plain HTTP on your network.",
      "Uploaded originals and image data are kept in separate named volumes.",
      "Max upload size is 15 MB and compression quality is set to 80 by default.",
    ]
  ports:
    - {port: 3000, protocol: HTTP, show: true, label: "Web UI", service: slink}

services:
  slink:
    image: docker.io/anirdev/slink:latest
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      REQUIRE_SSL: "false"
      USER_APPROVAL_REQUIRED: "false"
      USER_PASSWORD_MIN_LENGTH: "8"
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: "true"
      IMAGE_COMPRESSION_QUALITY: "80"
      STORAGE_PROVIDER: local
    ports:
      - "3000"
    volumes:
      - slink_data:/app/var/data
      - slink_images:/app/slink/images

volumes:
  slink_data:
  slink_images:
