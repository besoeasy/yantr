x-yantr:
  name: Syncthing
  tags: [ tools, utility, storage, files, self-hosted ]
  short_description: Private peer-to-peer file synchronization across your devices,
    without a cloud account.
  description: >
    Syncthing synchronizes files between computers, phones, and servers over
    direct peer-to-peer connections. Devices exchange encrypted blocks, resolve
    conflicts, and keep local copies when peers are offline. Use it for private
    document, photo, and backup replication across a home lab or network.
  usecases:
    [
      Sync your photos from your phone to your home server automatically when
        on WiFi.,
      "Keep important documents synchronized across your laptop, desktop, and
        server without using Dropbox or Google Drive.",
      Create a private backup solution - sync to a secondary device for
        redundancy.,
      Share files with family members using device-to-device synchronization.
    ]
  website: https://syncthing.net/
  notes:
    [
      Uses ports 22000 (TCP) and 21027 (UDP) for synchronization,
      Works behind NAT with proper configuration,
      No account or cloud required - all peer-to-peer
    ]

services:
  syncthing:
    image: docker.io/syncthing/syncthing:latest
    hostname: syncthing
    volumes:
      - syncthing_data:/var/syncthing
    ports:
      - "8384"
      - 22000/tcp
      - 22000/udp
      - 21027/udp
    restart: unless-stopped
    labels:
      yantr.app: syncthing
      yantr.service.8384: Web UI
      yantr.port.8384: HTTP

volumes:
  syncthing_data: null
