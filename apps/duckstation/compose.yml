services:
  duckstation:
    image: lscr.io/linuxserver/duckstation:latest
    container_name: duckstation
    volumes:
      - duckstation-data:/config
    ports:
      - "3000"
      - "3001"
    shm_size: "1gb"
    restart: unless-stopped
    labels:
      yantr.app: "duckstation"
      yantr.service: "DuckStation"

volumes:
  duckstation-data:
    name: duckstation-data
