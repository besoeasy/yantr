x-yantr:
  name: "goaccess"
  tags: [analytics, logs, monitoring, self-hosted, podman]
  short_description: "Real-time web log analyzer and interactive viewer."
  description: >
    A fast, real-time web log analyzer and interactive viewer for Apache,
    Nginx, and Caddy. Generates dynamic HTML dashboards and command-line
    reports showing visitor analytics, bandwidth, and HTTP metrics.
  usecases: ["Analyze web server logs.", "Monitor traffic in real time.", "Generate HTML analytics reports."]
  website: "https://github.com/allinurl/goaccess"

services:
  goaccess:
    image: ghcr.io/allinurl/goaccess:latest
    labels:
      yantr.app: "goaccess"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - goaccess_data:/data
    restart: unless-stopped

volumes:
  goaccess_data:
