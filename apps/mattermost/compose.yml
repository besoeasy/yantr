x-yantr:
  name: Mattermost
  tags:
    - messaging
    - team-chat
    - collaboration
    - communication
    - self-hosted
  short_description: Open-source team messaging and collaboration platform.
  description: Mattermost is an open-source, self-hosted team messaging platform
    built for enterprise. It provides secure channels, direct messaging, file
    sharing, integrations, playbooks for incident management, and a marketplace
    of plugins for extending functionality.
  usecases:
    - Replace Slack with a private, self-hosted team messaging platform.
    - Coordinate incident response using Mattermost Playbooks.
    - Integrate with DevOps tools like GitHub, Jira, and Jenkins.
  website: https://mattermost.com
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum

services:
  db:
    image: postgres:16-alpine
    container_name: mattermost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mattermost_pgdata:/var/lib/postgresql/data
    labels:
      yantr.app: mattermost
      yantr.service.8065: Web UI
      yantr.port.8065: HTTP
  app:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost-app
    restart: unless-stopped
    depends_on:
      - db
    labels:
      yantr.app: mattermost
      yantr.service.8065: Web UI
      yantr.port.8065: HTTP
    ports:
      - "8065"
    environment:
      TZ: ${TZ:-UTC}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${POSTGRES_PASSWORD}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ""
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins

volumes:
  mattermost_pgdata: null
  mattermost_config: null
  mattermost_data: null
  mattermost_logs: null
  mattermost_plugins: null
  mattermost_client_plugins: null
