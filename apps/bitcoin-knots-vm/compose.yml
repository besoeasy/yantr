x-yantr:
  name: Bitcoin Knots VM
  tags:
    - cryptocurrency
    - bitcoin
    - crypto
    - blockchain
    - self-hosted
  short_description: Bitcoin full node with enhanced features and privacy focus.
  description: Bitcoin full node with enhanced features and privacy focus. Bitcoin
    Knots VM is a self-hosted application focused on cryptocurrency, bitcoin,
    crypto, blockchain. It can be deployed on any device via Docker Compose.
  usecases:
    - Self-host Bitcoin Knots VM on your home server to bitcoin full node with
      enhanced features and privacy focus without depending on third-party cloud
      services.
    - Use Bitcoin Knots VM to manage your cryptocurrency workflows privately,
      keeping all data under your control on local infrastructure.
  website: https://bitcoinknots.org
  logo: QmagcjChBhrPKmd1S2XyQw9dCddbWn7izbtNR4gscbA1kQ
  env_generators:
    BITCOIN_RPC_USER:
      length: 8
      charset: alpha
    BITCOIN_RPC_PASSWORD:
      length: 32
      charset: alnum_symbols
services:
  bitcoin-knots-vm:
    image: lscr.io/linuxserver/bitcoin-knots:latest
    container_name: bitcoin-knots-vm
    hostname: bitcoin-knots-vm
    environment:
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${BITCOIN_RPC_PASSWORD}
    volumes:
      - bitcoin_knots_config:/config
    ports:
      - "3000"
      - "3001"
      - "8333"
    restart: unless-stopped
    labels:
      yantr.app: bitcoin-knots-vm
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
      yantr.service.3001: Web UI
      yantr.port.3001: HTTPS

volumes:
  bitcoin_knots_vm_config: null
