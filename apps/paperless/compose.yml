x-yantr:
  name: Paperless-ngx
  tags: [ documents, ocr, productivity, self-hosted, archiving ]
  short_description: Self-hosted document management system with OCR. for home.
  description: Paperless-ngx is a community-supported open-source document
    management system that transforms your physical documents into a searchable
    online archive. It uses OCR to make scanned documents fully searchable and
    organizes everything with tags, correspondents, and document types.
  usecases:
    [
      Scan and archive paper documents with automatic OCR.,
      Search and retrieve any document instantly by content.,
      "Organize documents with tags, types, and correspondents."
    ]
  website: https://docs.paperless-ngx.com
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum
    SECRET_KEY:
      length: 64
      charset: alnum

services:
  broker:
    image: redis:7
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - paperless_redis:/data
    labels:
      yantr.app: paperless
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  db:
    image: postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - paperless_pgdata:/var/lib/postgresql/data
    labels:
      yantr.app: paperless
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    labels:
      yantr.app: paperless
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  tika:
    image: ghcr.io/paperless-ngx/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
    labels:
      yantr.app: paperless
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    labels:
      yantr.app: paperless
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
    ports:
      - "8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume

volumes:
  paperless_redis: null
  paperless_pgdata: null
  paperless_data: null
  paperless_media: null
  paperless_export: null
  paperless_consume: null
