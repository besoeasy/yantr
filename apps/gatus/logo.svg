<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1a2a1a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0d3010"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <rect x="40" y="52" width="176" height="120" rx="14" fill="none" stroke="#4caf50" stroke-width="3" opacity="0.5"/>
  <!-- Screen -->
  <rect x="50" y="62" width="156" height="100" rx="8" fill="url(#screen)" opacity="0.8"/>
  <!-- Heartbeat line -->
  <polyline points="60,112 90,112 100,112 110,90 120,134 130,72 140,128 150,100 160,112 200,112" stroke="url(#pulse)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor stand -->
  <rect x="112" y="172" width="32" height="20" rx="2" fill="#4caf50" opacity="0.4"/>
  <rect x="96" y="192" width="64" height="8" rx="4" fill="#4caf50" opacity="0.3"/>
  <!-- Status indicator -->
  <circle cx="192" cy="80" r="8" fill="#4caf50" opacity="0.9"/>
  <circle cx="192" cy="80" r="12" fill="#4caf50" opacity="0.2"/>
  <!-- Grid lines on screen -->
  <line x1="50" y1="82" x2="206" y2="82" stroke="#4caf50" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="102" x2="206" y2="102" stroke="#4caf50" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="122" x2="206" y2="122" stroke="#4caf50" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="142" x2="206" y2="142" stroke="#4caf50" stroke-width="0.5" opacity="0.2"/>
</svg>