x-yantr:
  name: "typebot"
  tags: [forms, chatbot, productivity, self-hosted, podman]
  short_description: "Open-source conversational form and chatbot builder."
  description: >
    A visual builder for creating conversational forms, intelligent chatbots,
    and interactive flows. Drag and drop blocks to design engaging user
    experiences, collect leads, and integrate with your favorite homelab tools.
  usecases: ["Build chatbots visually.", "Create interactive forms.", "Automate lead generation."]
  website: "https://github.com/baptistejamin/typebot"
  env_generators:
    NEXTAUTH_SECRET: {length: 32, charset: base64url}
    ENCRYPTION_SECRET: {length: 32, charset: base64url}

services:
  typebot:
    image: ghcr.io/baptistejamin/typebot:latest
    labels:
      yantr.app: "typebot"
      yantr.service.3000: "Web UI"
      yantr.port.3000: "HTTP"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/typebot}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
    ports:
      - "3000"
    volumes:
      - typebot_data:/data
    restart: unless-stopped

volumes:
  typebot_data:
