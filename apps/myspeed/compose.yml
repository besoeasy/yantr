x-yantr:
  name: MySpeed
  tags: [ network, tools, utility, speedtest, self-hosted ]
  short_description: Self-hosted internet speed dashboard with 30-day trends and history.
  description: >
    MySpeed is a self-hosted dashboard for running internet speed tests and
    reviewing 30-day trends. It records download, upload, and latency results
    over time so users can compare connections, spot recurring degradation, and
    keep performance history on their own infrastructure.
  usecases:
    [
      Compare speed-test results over a 30-day period.,
      Track changes in download, upload, and latency.,
      Keep ISP performance history on a self-hosted server.
    ]
  website: https://myspeed.dev

services:
  myspeed:
    image: docker.io/germannewsmaker/myspeed:latest
    hostname: myspeed
    volumes:
      - myspeed_data:/myspeed/data
    ports:
      - "5216"
    restart: unless-stopped
    labels:
      yantr.app: myspeed
      yantr.service.5216: Web UI
      yantr.port.5216: HTTP

volumes:
  myspeed_data: null
