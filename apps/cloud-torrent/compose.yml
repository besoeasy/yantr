x-yantr:
  name: Cloud Torrent
  tags: [ download, utility, torrent, p2p, cloud ]
  short_description: Self-hosted torrent client with web UI and streaming download support.
  description: Cloud Torrent is a simple, self-hosted torrent client with a clean
    web interface. Features include torrent upload, magnet link support,
    download progress, file selection, streaming for partial downloads, and
    automatic cleanup. Lightweight and easy to use for basic torrent downloading
    needs.
  usecases:
    [
      Download torrents through a simple web interface.,
      Stream video while downloading.,
      Basic torrent management without bloat.
    ]
  website: https://github.com/jpillora/cloud-torrent
  logo: QmdPAfpuG5zkJs4GMX2DJ4xhKYq8vkT98TMjHgecAwkQVL
  notes: [ Magnet link support, Streaming while downloading, Simple and lightweight ]

services:
  cloud-torrent:
    image: jpillora/cloud-torrent:latest
    container_name: cloud-torrent
    volumes:
      - cloud-torrent-downloads:/downloads
    ports:
      - "3000"
    restart: unless-stopped
    labels:
      yantr.app: cloud-torrent
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP

volumes:
  cloud-torrent-downloads:
    name: cloud-torrent-downloads
