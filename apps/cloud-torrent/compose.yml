x-yantr:
  name: Cloud Torrent
  tags: [ download, utility, torrent, p2p, cloud ]
  short_description: Self-hosted torrent client with web UI and streaming download support.
  description: >
    Cloud Torrent is a lightweight self-hosted BitTorrent client with a web
    interface for uploading torrents and magnet links, selecting files, monitoring
    progress, and streaming partial downloads. It keeps basic torrent management
    simple for home servers and browsers without a full desktop client.
  usecases:
    [
      Download torrents and magnet links from a simple web interface.,
      Stream partially downloaded video files in a browser.,
      Select files and monitor progress without a desktop client.
    ]
  website: https://github.com/jpillora/cloud-torrent
  notes: [ Magnet link support, Streaming while downloading, Simple and lightweight ]

services:
  cloud-torrent:
    image: docker.io/jpillora/cloud-torrent:latest
    volumes:
      - cloud-torrent-downloads:/downloads
    ports:
      - "3000"
    restart: unless-stopped
    labels:
      yantr.app: cloud-torrent
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP

volumes:
  cloud-torrent-downloads:
    name: cloud-torrent-downloads
