x-yantr:
  name: Snort
  tags: [ nostr, social, decentralized, web, pwa ]
  short_description: Fast, lightweight Nostr client with real-time updates and clean interface.
  description: >
    Snort is a lightweight Nostr web client for reading and publishing on the
    decentralized social network. Connect to one or more relays for notes,
    threads, follows, replies, likes, reposts, direct messages, and Lightning
    zaps. Relay choice and account security remain the user's responsibility.
  usecases:
    [
      "Access Nostr social network through a fast, modern web interface.",
      "Post notes, reply to threads, and interact with the community.",
      Follow accounts and see real-time updates from your feed.,
      Send and receive direct messages on the Nostr network.
    ]
  website: https://git.v0l.io/Kieran/snort
  notes:
    [
      Works with any Nostr relay,
      Can connect to multiple relays simultaneously,
      NIP-05 verification supported
    ]

services:
  snort:
    image: docker.io/voidic/snort:v0.3.0
    labels:
      yantr.app: snort
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    ports:
      - "8080"
    init: true
    restart: unless-stopped
