services:
  snort:
    image: voidic/snort:v0.3.0
    container_name: snort
    labels:
      yantr.app: snort
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    ports:
      - "8080"
    init: true
    restart: unless-stopped
x-yantr:
  name: Snort
  tags:
    - social
    - security
    - network
    - firewall
    - nostr
  short_description: Fast, lightweight Nostr client with real-time updates and clean interface.
  description: Snort is a blazing fast, lightweight Nostr client built with React.
    It provides a clean, modern interface for using the Nostr decentralized
    social network. Features include real-time updates via WebSocket, following
    management, notes and threads, likes and reposts, zaps (Lightning
    payments...
  usecases:
    - Access Nostr social network through a fast, modern web interface.
    - Post notes, reply to threads, and interact with the community.
    - Follow accounts and see real-time updates from your feed.
    - Send and receive direct messages on the Nostr network.
  website: https://git.v0l.io/Kieran/snort
  logo: QmQG28hMnofAKwXt6F6FD3ZBhwmeCAotfqy92e6Pbkhs44
  notes:
    - Works with any Nostr relay
    - Can connect to multiple relays simultaneously
    - NIP-05 verification supported
