x-yantr:
  name: Stirling-PDF
  tags: [ tools, utility, pdf, self-hosted, homelab ]
  short_description: All-in-one PDF manipulation tool - merge, split, convert, compress, and more.
  description: >
    Stirling-PDF is a self-hosted web app for PDF work without uploading
    documents to a third party. Merge, split, rotate, compress, convert, OCR,
    compare, and edit pages in the browser. It is useful for batch jobs, scanned
    documents, and privacy-sensitive paperwork.
  usecases:
    [
      Merge multiple PDF files into one document.,
      Compress large PDFs to reduce file size.,
      Convert scanned images to searchable PDFs with OCR.,
      Add or remove password protection from PDFs.
    ]
  website: https://github.com/Stirling-Tools/Stirling-PDF
  notes:
    [
      All processing done locally - no data leaves your server,
      Supports batch processing for multiple files,
      OCR requires additional language packs
    ]

  ports:
    - {port: 8080, protocol: HTTP, label: "Web UI", service: stirling-pdf}

services:
  stirling-pdf:
    image: docker.io/frooodle/s-pdf:latest
    ports:
      - "8080"
    volumes:
      - stirling_pdf_data:/usr/share/tessdata
      - stirling_pdf_config:/configs
    environment:
      DOCKER_ENABLE_SECURITY: ${STIRLING_PDF_SECURITY:-false}
      SYSTEM_DEFAULTLOCALE: ${STIRLING_PDF_LOCALE:-en-US}
    restart: unless-stopped

volumes:
  stirling_pdf_data: null
  stirling_pdf_config: null
