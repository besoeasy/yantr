x-yantr:
  name: Homarr
  tags:
    - dashboard
    - tools
    - monitoring
    - utility
    - homepage
  short_description: Customizable dashboard for self-hosted services with
    drag-and-drop widgets and integrations.
  description: Homarr is a modern dashboard for self-hosted services with a
    drag-and-drop layout, built-in integrations for many apps, and a large icon
    library. It shows service status, quick access links, and optional system
    metrics for a polished homelab start page.
  usecases:
    - Create a unified homepage showing all your self-hosted apps with live
      status indicators.
    - Monitor your homelab services at a glance - see which containers are
      running, down, or have issues.
    - Display system metrics (CPU, RAM, disk) from your server directly on the
      dashboard.
    - Use as your browser's start page for quick access to frequently used
      services and bookmarks.
  website: https://github.com/homarr-labs/homarr
  logo: QmXrjcV7SukGrmAgqF3tHVCu2LTYYGkhADumKY74AHzLf4
  notes:
    - Docker integration available for showing container status
    - Easy drag-and-drop layout customization through the UI
    - Encryption key required for widget functionality - set
      HOMARR_ENCRYPTION_KEY env variable

services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homarr_data:/appdata
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_ENCRYPTION_KEY:-2dff4b06831e4608cc93dfee6fbe55b29ff0ee189cafd23ccc128698dae55884}
    ports:
      - "7575"
    labels:
      yantr.app: homarr
      yantr.service.7575: Web UI
      yantr.port.7575: HTTP

volumes:
  homarr_data: null
