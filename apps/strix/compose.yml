x-yantr:
  name: "strix"
  tags: [camera, network, discovery, security, self-hosted]
  short_description: "Smart IP camera stream discovery and management tool."
  description: >
    Strix discovers and catalogs ONVIF and RTSP IP camera video streams
    across your local network. Organize security camera feeds, check stream
    health, and aggregate video feeds into a centralized web dashboard.
  usecases: ["Discover IP cameras on network.", "Manage camera streams centrally."]
  website: "https://github.com/eduard256/Strix"

services:
  strix:
    image: ghcr.io/eduard256/strix:latest
    labels:
      yantr.app: "strix"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - strix_data:/data
    restart: unless-stopped

volumes:
  strix_data:
