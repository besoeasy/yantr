x-yantr:
  name: Scality S3
  tags: [ storage, s3, files, utility, cloud ]
  short_description: S3-compatible object storage server for self-hosted cloud storage.
  description: S3-compatible object storage server for self-hosted cloud storage.
    Scality S3 is a self-hosted application focused on storage, s3, files,
    utility. It can be deployed on any device via Docker Compose. It supports a
    wide range of use cases for homelabs and self-hosted infrastructure.
  usecases:
    [
      Self-host Scality S3 on your home server to s3-compatible object storage
        server for self-hosted cloud storage without depending on third-party
        cloud services.,
      "Use Scality S3 to manage your storage workflows privately, keeping all
        data under your control on local infrastructure."
    ]
  website: https://www.zenko.io/cloudserver/

services:
  scality-s3:
    image: zenko/cloudserver:latest
    container_name: zenko-s3
    labels:
      yantr.app: scality-s3
      yantr.service.8000: S3 API
      yantr.port.8000: HTTP
    ports:
      - "8000"
    environment:
      SCALITY_ACCESS_KEY_ID: ${SCALITY_ACCESS_KEY_ID:-accessKey1}
      SCALITY_SECRET_ACCESS_KEY: ${SCALITY_SECRET_ACCESS_KEY:-verySecretKey1}
    volumes:
      - scality_data:/usr/src/app/localData
      - scality_metadata:/usr/src/app/localMetadata
    restart: unless-stopped

volumes:
  scality_data: null
  scality_metadata: null
