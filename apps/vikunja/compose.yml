x-yantr:
  name: Vikunja
  tags: [ tasks, todo, project-management, productivity, self-hosted ]
  short_description: Self-hosted open-source to-do and project manager.
  description: Vikunja is an open-source, self-hosted task management platform.
    Organize your work with lists, kanban boards, Gantt charts, and a calendar
    view. It offers teams and namespaces for collaboration, labels, priorities,
    due dates, and a REST API.
  usecases:
    [
      Manage personal tasks and to-do lists with due dates and priorities.,
      Run team projects with kanban boards and task assignments.,
      Plan and track work using Gantt charts and calendar views.
    ]
  website: https://vikunja.io
  env_generators:
    MYSQL_ROOT_PASSWORD:
      length: 32
      charset: alnum
    MYSQL_PASSWORD:
      length: 32
      charset: alnum
    JWT_SECRET:
      length: 64
      charset: alnum

services:
  db:
    image: mariadb:10.11
    container_name: vikunja-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: vikunja
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: vikunja
    volumes:
      - vikunja_db:/var/lib/mysql
    labels:
      yantr.app: vikunja
      yantr.service.3456: Web UI
      yantr.port.3456: HTTP
  web:
    image: vikunja/vikunja:latest
    container_name: vikunja-web
    restart: unless-stopped
    depends_on:
      - db
    labels:
      yantr.app: vikunja
      yantr.service.3456: Web UI
      yantr.port.3456: HTTP
    ports:
      - "3456"
    environment:
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_HOST: vikunja-db
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      VIKUNJA_SERVICE_JWTSECRET: ${JWT_SECRET}
    volumes:
      - vikunja_files:/app/vikunja/files

volumes:
  vikunja_db: null
  vikunja_files: null
