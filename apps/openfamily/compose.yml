x-yantr:
  name: "openfamily"
  tags: [family, organizer, productivity, self-hosted, podman]
  short_description: "Family organizer for managing schedules and tasks."
  description: >
    OpenFamily is a private, self-hosted household hub featuring shared
    family calendars, collaborative chore lists, meal planning, and
    messaging tools to keep everyone organized without third-party tracking.
  usecases: ["Coordinate family schedules.", "Manage shared task lists."]
  website: "https://github.com/NexaFlowFrance/OpenFamily"

services:
  openfamily:
    image: ghcr.io/nexaflowfrance/openfamily:latest
    labels:
      yantr.app: "openfamily"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - openfamily_data:/data
    restart: unless-stopped

volumes:
  openfamily_data:
