x-yantr:
  name: "mixarr"
  tags: [music, lidarr, media, self-hosted, podman]
  short_description: "Music discovery and recommendation companion for Lidarr."
  description: >
    Mixarr is an intelligent music discovery companion for Lidarr. Explore
    new recommendations, discover trending artists, preview tracks, and
    automatically queue top albums directly to your download pipeline.
  usecases: ["Discover new artists and albums.", "Queue music for Lidarr to download."]
  website: "https://github.com/aquantumofdonuts/mixarr"

services:
  mixarr:
    image: ghcr.io/aquantumofdonuts/mixarr:latest
    labels:
      yantr.app: "mixarr"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - mixarr_data:/data
    restart: unless-stopped

volumes:
  mixarr_data:
