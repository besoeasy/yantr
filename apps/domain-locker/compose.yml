x-yantr:
  name: Domain Locker
  tags: [ security, tools, monitoring, dashboard, utility ]
  short_description: Complete visibility of your domain portfolio with monitoring and alerts.
  description: Complete visibility of your domain portfolio with monitoring and
    alerts. Domain Locker is a self-hosted application focused on security,
    tools, monitoring, dashboard. It can be deployed on any device via Docker
    Compose.
  usecases:
    [
      Self-host Domain Locker on your home server to complete visibility of
        your domain portfolio with monitoring and alerts without depending on
        third-party cloud services.,
      "Use Domain Locker to manage your security workflows privately, keeping
        all data under your control on local infrastructure."
    ]
  website: https://domain-locker.com
  logo: QmXCFhWvYYmz21YHP38zFFxsitmvMeZStbjfacg2dKrZnw

services:
  domain-locker:
    image: lissy93/domain-locker:latest
    container_name: domain-locker
    hostname: domain-locker
    volumes:
      - domain_locker_data:/app/data
    ports:
      - "3000"
    restart: unless-stopped
    labels:
      yantr.app: domain-locker
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP

volumes:
  domain_locker_data: null
