x-yantr:
  name: Smokeping
  tags: [ network, monitoring, dashboard, utility, self-hosted ]
  short_description: Network latency and packet loss monitoring with beautiful historical graphs.
  description: Smokeping is a powerful network monitoring tool that measures
    latency and packet loss to your network targets over time. It sends ICMP
    pings and visualizes the data in detailed graphs showing min/max/average
    response times, standard deviation, and packet loss percentages. Features
    include...
  usecases:
    [
      Monitor your home internet connection quality over time.,
      "Track latency to important servers (gaming, work VPNs).",
      Get alerted when packet loss or latency exceeds thresholds.,
      Prove internet issues to your ISP with historical data.
    ]
  website: https://github.com/linuxserver/docker-smokeping
  notes:
    [
      Requires ICMP ping access (may need CAP_NET_RAW),
      Configure targets via config file,
      Historical graphs show trends over extended periods
    ]

services:
  smokeping:
    image: linuxserver/smokeping:latest
    container_name: smokeping
    labels:
      yantr.app: smokeping
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - smokeping_config:/config
      - smokeping_data:/data
    restart: unless-stopped

volumes:
  smokeping_config: null
  smokeping_data: null
