x-yantr:
  name: "whoogle"
  logo: "QmNPLDz2jjjG67UeNVAC1wgdBs9eMrUQQYkRRWXWmtSZxV"
  tags: [search, privacy, utility, self-hosted, google]
  short_description: "Self-hosted, ad-free Google search proxy with privacy features."
  description: >
    Whoogle is a self-hosted search proxy that fetches Google search results
    and presents them without ads, tracking, or clutter. It provides a clean,
    privacy-focused search experience while still using Google's search algorithm.
    No tracking cookies, no IP logging, and fully customizable with themes and filters.
  usecases: ["Search Google without ads or tracking from your own IP address.", "Set as your browser's default search engine for private, clean results.", "Customize search appearance with dark/light themes and result filters."]
  website: "https://github.com/benbusby/whoogle-search"
  notes: ["Proxies Google search — results still come from Google's algorithm.", "Supports customization via environment variables (themes, safe search, etc.)."]

services:
  whoogle:
    image: benbusby/whoogle-search:latest
    container_name: whoogle
    labels:
      yantr.app: "whoogle"
      yantr.service.5000: "Web UI"
      yantr.port.5000: "HTTP"
    ports:
      - "5000"
    volumes:
      - whoogle_config:/config
    restart: unless-stopped

volumes:
  whoogle_config:
