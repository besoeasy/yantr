x-yantr:
  name: Whoogle
  tags: [ search, privacy, utility, self-hosted, homelab ]
  short_description: Self-hosted, ad-free Google search proxy with privacy
    features and customization options.
  description: >
    Whoogle is a self-hosted Google Search proxy that removes ads, tracking
    scripts, and result-page clutter. It supports themes, language preferences,
    safe search, and configurable filters while retaining familiar Google results.
    Use it for a cleaner interface, while requests still reach Google.
  usecases:
    [
      Search Google without ads or tracking from your IP address.,
      "Get clean, distraction-free search results.",
      Set as your browser's default search engine for privacy.,
      Customize search appearance with themes and filters.
    ]
  website: https://github.com/benbusby/whoogle
  notes:
    [
      Proxies Google search - results come from Google's algorithm,
      No tracking cookies or IP logging,
      Can be customized with environment variables
    ]

services:
  whoogle:
    image: docker.io/benbusby/whoogle-search:latest
    labels:
      yantr.app: whoogle
      yantr.service.5000: Web UI
      yantr.port.5000: HTTP
    ports:
      - "5000"
    volumes:
      - whoogle_config:/config
    restart: unless-stopped

volumes:
  whoogle_config: null
