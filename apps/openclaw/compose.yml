x-yantr:
  name: OpenClaw
  tags:
    - ai
    - tools
    - utility
    - self-hosted
    - homelab
  short_description: Personal AI assistant — Gateway control plane with
    multi-channel inbox (WhatsApp, Telegram, Slack...
  description: Personal AI assistant — Gateway control plane with multi-channel
    inbox (WhatsApp, Telegram, Slack... OpenClaw is a self-hosted application
    focused on ai, tools, utility, self-hosted. It can be deployed on any device
    via Docker Compose.
  usecases:
    - Self-host OpenClaw on your home server to personal ai assistant — gateway
      control plane with multi-channel inbox (whatsapp, telegram, slack..
      without depending on third-party cloud services.
    - Use OpenClaw to manage your ai workflows privately, keeping all data under
      your control on local infrastructure.
  website: https://openclaw.ai
  logo: QmRdr8gQqpGLXkZc53NcQV3i71931yNQqYrLhpaWEpTMwp
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    init: true
    restart: unless-stopped
    command:
      - node
      - openclaw.mjs
      - gateway
      - --bind
      - lan
      - --allow-unconfigured
    ports:
      - "18789"
      - "18790"
    environment:
      NODE_ENV: production
    volumes:
      - openclaw_data:/app/data
      - openclaw_cache:/home/node/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s
    user: 1000:1000
    read_only: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      yantr.app: openclaw
      yantr.service.18789: Web UI
      yantr.port.18789: HTTP
      yantr.service.18790: Device Nodes
      yantr.port.18790: TCP

volumes:
  openclaw_data: null
  openclaw_cache: null
