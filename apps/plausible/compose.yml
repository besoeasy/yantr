x-yantr:
  name: Plausible Analytics
  tags: [ analytics, privacy, dashboard, web, self-hosted ]
  short_description: Lightweight privacy-first web analytics for self-hosted sites
    and GDPR-safe reporting.
  description: Plausible provides simple, privacy-focused website analytics with
    no cookies and full GDPR support. Host it yourself for fast, accurate user
    metrics and goal tracking without third-party tracking scripts.
  usecases:
    [
      Track website visits and goals.,
      Keep analytics GDPR-friendly without third-party scripts.
    ]
  website: https://plausible.io/docs/self-hosting
  notes: [ Change SECRET_KEY_BASE and database credentials before going public. ]

services:
  plausible-db:
    image: postgres:15-alpine
    container_name: plausible-db
    restart: unless-stopped
    labels:
      yantr.app: plausible
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
    environment:
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: plausible
    volumes:
      - plausible_db:/var/lib/postgresql/data
  plausible:
    image: plausible/analytics:latest
    container_name: plausible
    restart: unless-stopped
    labels:
      yantr.app: plausible
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
    environment:
      DATABASE_URL: postgres://plausible:changeme@plausible-db:5432/plausible
      SECRET_KEY_BASE: changeme
      BASE_URL: http://localhost:8000
      SMTP_ENABLED: "false"
    ports:
      - "8000"
    depends_on:
      - plausible-db

volumes:
  plausible_db: null
