services:
  obsidian:
    image: linuxserver/obsidian:latest
    container_name: obsidian
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "3000"
    volumes:
      - obsidian_config:/config
    restart: unless-stopped
    labels:
      yantr.app: "obsidian"
      yantr.service: "Web UI"

volumes:
  obsidian_config:
