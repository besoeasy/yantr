<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Database cylinder -->
  <ellipse cx="128" cy="76" rx="60" ry="20" fill="none" stroke="#ef9a9a" stroke-width="4"/>
  <line x1="68" y1="76" x2="68" y2="156" stroke="#ef9a9a" stroke-width="4"/>
  <line x1="188" y1="76" x2="188" y2="156" stroke="#ef9a9a" stroke-width="4"/>
  <ellipse cx="128" cy="156" rx="60" ry="20" fill="none" stroke="#ef9a9a" stroke-width="4"/>
  <!-- Database lines -->
  <ellipse cx="128" cy="104" rx="60" ry="18" fill="none" stroke="#ef9a9a" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="128" cy="132" rx="60" ry="18" fill="none" stroke="#ef9a9a" stroke-width="2.5" opacity="0.5"/>
  <!-- Clock overlay -->
  <circle cx="192" cy="188" r="36" fill="none" stroke="#ffcdd2" stroke-width="4"/>
  <circle cx="192" cy="188" r="30" fill="#b71c1c" opacity="0.8"/>
  <!-- Clock hands -->
  <line x1="192" y1="188" x2="192" y2="168" stroke="#ffcdd2" stroke-width="3" stroke-linecap="round"/>
  <line x1="192" y1="188" x2="206" y2="188" stroke="#ffcdd2" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock center dot -->
  <circle cx="192" cy="188" r="3" fill="#ffcdd2"/>
  <!-- Clock ticks -->
  <line x1="192" y1="156" x2="192" y2="160" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="224" y1="188" x2="220" y2="188" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="192" y1="220" x2="192" y2="216" stroke="#ffcdd2" stroke-width="2"/>
  <line x1="160" y1="188" x2="164" y2="188" stroke="#ffcdd2" stroke-width="2"/>
</svg>