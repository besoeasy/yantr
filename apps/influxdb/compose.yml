x-yantr:
  name: InfluxDB
  tags: [ database, time-series, metrics, monitoring, self-hosted ]
  short_description: Purpose-built time-series database for metrics, events,
    and real-time analytics.
  description: >
    InfluxDB is a time-series database for metrics, events, sensor data, and
    analytics. It supports retention policies and fast queries for Grafana and
    other tools. Capabilities vary by edition: InfluxDB 3 Core has no built-in
    dashboard UI, while OSS 2.x provides Explorer and dashboard components.
  usecases:
    [
      Store and query time-series metrics from IoT sensors and devices.,
      Retain application performance data for historical trend analysis.,
      Power Grafana dashboards with fast time-series queries.
    ]
  website: https://www.influxdata.com
  notes:
    [
      "Default credentials: admin / <auto-generated> — change on first login.",
      "Pair with Telegraf for collecting system and application metrics.",
      "Dashboard availability depends on the deployed InfluxDB edition; 3 Core does not include a built-in UI."
    ]
  env_generators:
    INFLUX_PASSWORD: { length: 20, charset: alnum_symbols }
    INFLUX_ADMIN_TOKEN: { length: 32, charset: base64url }

services:
  influxdb:
    image: docker.io/influxdb:latest
    labels:
      yantr.app: influxdb
      yantr.service.8086: API
      yantr.port.8086: HTTP
    ports:
      - "8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-yantr}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-default}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

volumes:
  influxdb_data: null
  influxdb_config: null
