x-yantr:
  name: "node"
  tags: [nodejs, javascript, dev, podman, self-hosted]
  short_description: "Node.js LTS environment for JavaScript applications."
  description: >
    A Node.js LTS container providing a ready-to-use JavaScript runtime
    environment for building and running server-side applications, REST APIs,
    and CLI tools. Includes npm for easy dependency management and development.
  usecases: ["Run JavaScript server applications.", "Develop and test Node.js projects."]
  website: "https://nodejs.org/"

services:
  node:
    image: docker.io/node:lts
    labels:
      yantr.app: "node"
      yantr.service.3000: "Frontend dev server"
      yantr.port.3000: "HTTP"
      yantr.service.5173: "Vite dev server"
      yantr.port.5173: "HTTP"
      yantr.service.8080: "Alt dev server"
      yantr.port.8080: "HTTP"
      yantr.service.9229: "Node debugger"
      yantr.port.9229: "TCP"
      yantr.service.5858: "Alt debugger"
      yantr.port.5858: "TCP"
    environment: {}
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    ports:
      - "3000"
      - "5173"
      - "8080"
      - "9229"
      - "5858"
    volumes:
      - node_data:/data
    restart: unless-stopped

volumes:
  node_data:
