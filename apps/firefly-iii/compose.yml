x-yantr:
  name: Firefly III
  tags: [ finance, budgeting, accounting, money, self-hosted ]
  short_description: Self-hosted personal finance manager and budgeting tool.
  description: Firefly III is a self-hosted financial manager that helps you keep
    track of expenses, income, budgets, and savings goals. Create transactions,
    set recurring bills, generate reports and charts, and understand your
    spending patterns with detailed statistics.
  usecases:
    [
      Track all income and expenses across multiple accounts.,
      Set budgets and savings goals and monitor progress.,
      Generate detailed financial reports and spending charts.
    ]
  website: https://www.firefly-iii.org
  env_generators:
    APP_KEY:
      length: 32
      charset: alnum
    MYSQL_ROOT_PASSWORD:
      length: 32
      charset: alnum
    MYSQL_PASSWORD:
      length: 32
      charset: alnum

services:
  db:
    image: mariadb:10.11
    container_name: firefly-iii-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fireflyiii
      MYSQL_USER: fireflyiii
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - firefly_iii_db:/var/lib/mysql
    labels:
      yantr.app: firefly-iii
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
  server:
    image: fireflyiii/core:latest
    container_name: firefly-iii-server
    restart: unless-stopped
    depends_on:
      - db
    labels:
      yantr.app: firefly-iii
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    ports:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
      APP_KEY: ${APP_KEY}
      DB_HOST: firefly-iii-db
      DB_PORT: 3306
      DB_CONNECTION: mysql
      DB_DATABASE: fireflyiii
      DB_USERNAME: fireflyiii
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_URL: ""
      TRUSTED_PROXIES: "**"
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
      - firefly_iii_export:/var/www/html/storage/export

volumes:
  firefly_iii_db: null
  firefly_iii_upload: null
  firefly_iii_export: null
