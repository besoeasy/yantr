x-yantr:
  name: Homebridge
  tags: [ smart-home, homekit, apple, iot, self-hosted ]
  short_description: Add HomeKit support to non-native smart home devices.
  description: Homebridge allows you to integrate smart home devices that do not
    natively support Apple HomeKit. With a rich plugin ecosystem of over 2,000
    plugins, bring virtually any smart home device under HomeKit control via
    your iPhone, iPad, or Mac.
  usecases:
    [
      "Integrate non-HomeKit cameras, locks, and lights into Apple Home.",
      Create Siri-compatible automations for any smart home device.,
      "Bridge platforms like Google Home, SmartThings, and Nest into HomeKit."
    ]
  website: https://homebridge.io
  notes:
    [
      Homebridge runs in host network mode for local device discovery.,
      Install plugins from the Web UI after first launch.
    ]

services:
  server:
    image: homebridge/homebridge:latest
    container_name: homebridge
    labels:
      yantr.app: homebridge
      yantr.service.8581: Web UI
      yantr.port.8581: HTTP
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
      HOMEBRIDGE_CONFIG_UI_PORT: "8581"
    volumes:
      - homebridge_data:/homebridge
    restart: unless-stopped

volumes:
  homebridge_data: null
