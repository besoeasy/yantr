x-yantr:
  name: Nano
  tags:
    - cryptocurrency
    - blockchain
    - self-hosted
    - homelab
    - docker
  short_description: Open source, green cryptocurrency and peer-to-peer payment system.
  description: Open source, green cryptocurrency and peer-to-peer payment system.
    Nano is a self-hosted application focused on cryptocurrency, blockchain,
    self-hosted, homelab. It can be deployed on any device via Docker Compose.
  usecases:
    - Self-host Nano on your home server to open source, green cryptocurrency
      and peer-to-peer payment system without depending on third-party cloud
      services.
    - Use Nano to manage your cryptocurrency workflows privately, keeping all
      data under your control on local infrastructure.
  website: https://github.com/linuxserver/docker-nano
  logo: Qmf4kNnrTW6jAtNGrhM62yC1XmvXf2x5ZtxcUfZUinegca
services:
  nano:
    image: linuxserver/nano:latest
    container_name: nano
    labels:
      yantr.app: nano
      yantr.service.8075: RPC API
      yantr.port.8075: HTTP
    ports:
      - "8075"
      - "3000"
      - "3001"
    environment:
      PEER_HOST: ${PEER_HOST:-}
      LIVE_GENESIS_PUB: ${LIVE_GENESIS_PUB:-}
      LIVE_GENESIS_ACCOUNT: ${LIVE_GENESIS_ACCOUNT:-}
      LIVE_GENESIS_WORK: ${LIVE_GENESIS_WORK:-}
      LIVE_GENESIS_SIG: ${LIVE_GENESIS_SIG:-}
      CLI_OPTIONS: ${CLI_OPTIONS:-}
      LMDB_BOOTSTRAP_URL: ${LMDB_BOOTSTRAP_URL:-}
    volumes:
      - nano_config:/config
    restart: unless-stopped

volumes:
  nano_config: null
