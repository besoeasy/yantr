x-yantr:
  name: "postiz"
  tags: [social-media, scheduling, marketing, self-hosted, podman]
  short_description: "Open-source social media scheduling and management tool."
  description: >
    A self-hosted social media scheduler that lets you plan, schedule, and
    publish content across multiple platforms from one dashboard. Includes
    detailed analytics, visual content calendars, and smart publishing.
  usecases: ["Schedule social posts.", "Manage multiple accounts.", "Analyze post performance."]
  website: "https://github.com/gitroomhq/postiz-app"
  env_generators:
    SECRET_KEY: {length: 32, charset: base64url}
    NEXTAUTH_SECRET: {length: 32, charset: base64url}

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz:latest
    labels:
      yantr.app: "postiz"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postiz}
      SECRET_KEY: ${SECRET_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "8080"
    volumes:
      - postiz_data:/data
    restart: unless-stopped

volumes:
  postiz_data:
