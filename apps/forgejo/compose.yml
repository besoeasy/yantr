services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:latest-rootless
    container_name: forgejo
    ports:
      - "3000"
      - "22"
    environment:
      TZ: ${TZ:-UTC}
      FORGEJO__security__INSTALL_LOCK: "false"
    volumes:
      - forgejo_data:/var/lib/gitea
      - forgejo_config:/etc/gitea
    restart: unless-stopped
    labels:
      yantr.app: forgejo
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
      yantr.service.22: SSH
      yantr.port.22: TCP
volumes:
  forgejo_data: null
  forgejo_config: null
x-yantr:
  name: Forgejo
  tags:
    - git
    - developer
    - self-hosted
    - code
    - collaboration
  short_description: Lightweight self-hosted Git platform with issues, PRs, CI, and packages.
  description: "Forgejo is a community-driven, lightweight self-hosted Git service
    forked from Gitea. It provides a full GitHub-like experience: repositories,
    issues, pull requests, code review, wikis, project boards, releases, and
    package registries. Forgejo Actions offers built-in CI/CD compatible with
    GitHub..."
  usecases:
    - Host private Git repositories for personal projects or your team.
    - Run CI/CD pipelines with Forgejo Actions, compatible with GitHub Actions
      syntax.
    - Manage issues, pull requests, and code reviews in a self-hosted
      environment.
    - Mirror repositories from GitHub or GitLab for backup and independence.
  website: https://forgejo.org
  notes:
    - Complete the setup wizard on first visit at port 3000.
    - SSH cloning is available on port 22 — ensure it's not already used by your
      host.
    - Forgejo Actions runners can be added separately to enable CI/CD pipelines.
