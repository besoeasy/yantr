x-yantr:
  name: "hometube"
  tags: [media, video, downloader, self-hosted, docker]
  short_description: "Self-hosted video downloader for your favorite online platforms."
  description: >
    A self-hosted video downloader that lets you save videos from various popular
    platforms directly to your own server. Features a simple web interface for easy
    downloading and media management without relying on third-party services.
  usecases: ["Download videos from popular platforms.", "Archive media content locally."]
  website: "https://github.com/EgalitarianMonkey/hometube"

services:
  hometube:
    image: ghcr.io/egalitarianmonkey/hometube:latest
    labels:
      yantr.app: "hometube"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - hometube_data:/data
    restart: unless-stopped

volumes:
  hometube_data:
