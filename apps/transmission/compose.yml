x-yantr:
  name: Transmission
  tags: [ download, network, torrent, p2p, self-hosted ]
  short_description: Fast, lightweight BitTorrent client with web interface and
    native Docker support.
  description: Transmission is a fast, lightweight BitTorrent client that runs as
    a daemon with a web interface. It's known for its low resource usage,
    simplicity, and reliability. Features include a web UI for remote
    management, magnet link support, peer exchange, DHT, encryption, bandwidth
    scheduling,...
  usecases:
    [
      "Download Linux ISOs, open-source software, and public domain media via
        BitTorrent.",
      Set up automated downloads using watch folders - drop a .torrent file
        and it starts downloading automatically.,
      Build a headless download server that runs in the background and can be
        controlled from any browser.,
      Integrate with Sonarr/Radarr for automated media downloading.
    ]
  website: https://transmissionbt.com/
  notes:
    [
      Web interface runs on port 9091 by default,
      Peer port is 51413 - needs to be accessible for optimal downloads,
      LinuxServer.io image includes VPN and automatic cleanup features
    ]
  env_generators:
    TRANSMISSION_USER:
      length: 8
      charset: alpha
    TRANSMISSION_PASS:
      length: 16
      charset: alnum_symbols

services:
  transmission:
    image: linuxserver/transmission:latest
    environment:
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    volumes:
      - transmission_config:/config
      - transmission_downloads:/downloads
    ports:
      - "9091"
      - "51413"
      - 51413/udp
    restart: unless-stopped
    labels:
      yantr.app: transmission
      yantr.service.9091: Web Interface
      yantr.port.9091: HTTP

volumes:
  transmission_config:
    name: transmission_config
  transmission_downloads:
    name: transmission_downloads
