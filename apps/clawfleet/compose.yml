x-yantr:
  name: "clawfleet"
  tags: [ai, agents, deployment, automation, self-hosted]
  short_description: "Deploy, orchestrate, and manage fleets of AI agents."
  description: >
    ClawFleet is a self-hosted orchestration platform for deploying,
    monitoring, and managing fleets of autonomous AI agents. Run multiple
    specialized agents at scale with coordinated workflows and logging.
  usecases: ["Deploy multiple AI agents.", "Orchestrate agent workflows."]
  website: "https://github.com/clawfleet/ClawFleet"

services:
  clawfleet:
    image: ghcr.io/clawfleet/clawfleet:latest
    labels:
      yantr.app: "clawfleet"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - clawfleet_data:/data
    restart: unless-stopped

volumes:
  clawfleet_data:
