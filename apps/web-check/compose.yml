x-yantr:
  name: Web Check
  tags: [ tools, network, utility, monitoring, dashboard ]
  short_description: All-in-one website analysis tool - SSL, DNS, headers,
    performance, and security checks.
  description: >
    Web Check is a self-hosted website analysis dashboard with more than 30
    checks. Inspect TLS certificates, DNS, HTTP headers, WHOIS, security posture,
    technology fingerprints, and page metadata without sending analysis to a third
    party. Use it for uptime reviews, security audits, and domain research.
  usecases:
    [
      Analyze SSL certificate details and expiration dates.,
      Check what technologies a website is built with.,
      Verify security headers are properly configured.,
      Get detailed DNS and WHOIS information for any domain.
    ]
  website: https://github.com/lissy93/web-check
  notes:
    [
      Runs 30+ checks on any URL you provide,
      All analysis done locally - no data sent to third parties,
      Great for security auditing
    ]

services:
  web-check:
    image: docker.io/lissy93/web-check:latest
    ports:
      - "3000"
    restart: unless-stopped
    labels:
      yantr.app: web-check
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
