x-yantr:
  name: ZeroNote
  tags: [ productivity, security, self-hosted, homelab, docker ]
  short_description: Offline-first encrypted notes with local storage and end-to-end encryption.
  description: ZeroNote is an offline-first notes application with strong
    encryption. Your notes are encrypted locally before storage, meaning the
    server never sees plain text content. Features include end-to-end
    encryption, markdown support, tags and organization, offline capability, and
    self-hosted privacy.
  usecases:
    [
      Secure note-taking with encryption.,
      Private notes that server cannot read.,
      Offline-first personal knowledge base.
    ]
  website: https://github.com/besoeasy/zeronote
  notes: [ Server cannot read your notes, Offline-first design, Local encryption ]

services:
  zeronote:
    image: ghcr.io/besoeasy/zeronote:main
    container_name: zeronote
    hostname: zeronote
    volumes:
      - zeronote_data:/app/data
    ports:
      - "8000"
    restart: unless-stopped
    labels:
      yantr.app: zeronote
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP

volumes:
  zeronote_data: null
