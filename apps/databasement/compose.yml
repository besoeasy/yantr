x-yantr:
  name: "databasement"
  tags: [database, backup, utility, self-hosted, podman]
  short_description: "Automated database backup management and restore tool."
  description: >
    A self-hosted database backup manager supporting scheduled dumps,
    encryption, and one-click restores across PostgreSQL, MySQL, and SQLite
    databases. Keep your homelab data protected with automated tasks.
  usecases: ["Schedule automatic backups.", "Restore from snapshots.", "Manage backup retention."]
  website: "https://github.com/David-Crty/databasement"

services:
  databasement:
    image: ghcr.io/david-crty/databasement:latest
    labels:
      yantr.app: "databasement"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - databasement_data:/data
    restart: unless-stopped

volumes:
  databasement_data:
