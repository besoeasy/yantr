x-yantr:
  name: Cashu.me
  tags:
    - bitcoin
    - ecash
    - wallet
    - lightning
    - privacy
  short_description: Chaumian ecash wallet for Bitcoin with Lightning support
  description: Cashu.me is a privacy-focused Chaumian ecash wallet. As a PWA, it
    supports multiple mints, seed backups, Nostr Wallet Connect for Lightning,
    and offline token transfers—delivering privacy so transactions are less
    linkable. Includes optional Tor SOCKS proxy for stronger anonymity.
  usecases:
    - Send and receive ecash tokens with Bitcoin-backed privacy
    - Manage multiple mints from a single interface
    - Connect to Lightning Network via Nostr Wallet Connect
  website: https://cashu.me
  logo: bafkreiaqtmpl4vcfsjrtipeays5lgvy2cmehq5y2ggs46g7jzsdpfa76jq
  notes:
    - Ecash is a bearer asset - backup your seed phrase
    - Uses browser localStorage for token storage
    - Connect to public mints or run your own mint (nutshell)
    - All external traffic routed through Tor for enhanced privacy
    - Onion address available at /var/lib/tor/onion_service/hostname

services:
  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
    container_name: cashu-me-tor
    labels:
      yantr.app: cashu-me
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    restart: unless-stopped
    networks:
      - cashu-me
    volumes:
      - tor-keys:/var/lib/tor
    depends_on:
      - web
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashu-me
    labels:
      yantr.app: cashu-me
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    restart: unless-stopped
    networks:
      - cashu-me
    ports:
      - "80"
    environment:
      HTTP_PROXY: socks5://tor:9050
      HTTPS_PROXY: socks5://tor:9050

networks:
  cashu-me: null

volumes:
  tor-keys: null
