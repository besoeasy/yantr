x-yantr:
  name: Cryptofolio
  tags: [ finance, cryptocurrency, crypto, portfolio, indexer ]
  short_description: Self-hosted cryptocurrency portfolio tracker with real-time price updates.
  description: Self-hosted cryptocurrency portfolio tracker with real-time price
    updates. Cryptofolio is a self-hosted application focused on finance,
    cryptocurrency, crypto, portfolio. It can be deployed on any device via
    Docker Compose.
  usecases:
    [
      Self-host Cryptofolio on your home server to self-hosted cryptocurrency
        portfolio tracker with real-time price updates without depending on
        third-party cloud services.,
      "Use Cryptofolio to manage your finance workflows privately, keeping all
        data under your control on local infrastructure."
    ]
  website: https://github.com/xtrendence/cryptofolio

services:
  cryptofolio:
    image: xtrendence/cryptofolio:latest
    container_name: cryptofolio
    labels:
      yantr.app: cryptofolio
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    restart: unless-stopped
