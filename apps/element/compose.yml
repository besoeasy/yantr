x-yantr:
  name: Element
  tags:
    - productivity
    - security
    - chat
    - messaging
    - communication
  short_description: Feature-rich Matrix client for secure, decentralized chat,
    voice, and video communication.
  description: Element is a Matrix-based secure, decentralized chat client
    providing end-to-end encrypted messaging, group rooms, voice and video
    calls, file sharing, and bridges to other networks. Host your own homeserver
    for full control and synchronized history across devices.
  usecases:
    - Set up a private family chat server with end-to-end encryption.
    - Create a team communication platform for your projects without data
      leaving your infrastructure.
    - Join the wider Matrix network to communicate with users on other servers.
    - Use bridges to connect with Slack, Discord, Telegram, and other platforms.
  website: https://element.io
  logo: QmWMcjdA7izomrqwuW6D8JT8y75K7jCANqnDMYxZRzmzHU
  notes:
    - This is just the web client - requires a Matrix homeserver (Synapse) for
      full functionality
    - End-to-end encrypted by default for direct messages and group chats
    - Can connect to the public Matrix network or your own private server

services:
  element:
    image: vectorim/element-web:latest
    container_name: element
    labels:
      yantr.app: element
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - element_config:/app/config
    restart: unless-stopped

volumes:
  element_config: null
