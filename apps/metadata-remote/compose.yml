x-yantr:
  name: "metadata-remote"
  tags: [music, metadata, tags, self-hosted, podman]
  short_description: "Edit music file metadata from any device remotely."
  description: >
    Metadata Remote provides an intuitive web interface for editing audio
    tags, artwork, and metadata across your music library remotely from any
    browser, keeping your digital media collection organized effortlessly.
  usecases: ["Edit music file tags remotely.", "Organize music library metadata."]
  website: "https://github.com/wow-signal-dev/metadata-remote"

services:
  metadata-remote:
    image: ghcr.io/wow-signal-dev/metadata-remote:latest
    labels:
      yantr.app: "metadata-remote"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - metadata_remote_data:/data
    restart: unless-stopped

volumes:
  metadata_remote_data:
