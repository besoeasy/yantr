services:
  invio:
    image: ghcr.io/kittendevv/invio:latest
    container_name: invio
    labels:
      yantr.app: invio
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    ports:
      - "3000"
    volumes:
      - invio_data:/app/data
    restart: unless-stopped
volumes:
  invio_data: null
x-yantr:
  name: Invio
  tags:
    - productivity
    - utility
    - self-hosted
    - homelab
    - docker
  short_description: Self-hosted invoicing without the bloat. Self-host it with
    Docker using Yantr.
  description: Self-hosted invoicing without the bloat. Self-host it with Docker
    using Yantr. Invio is a self-hosted application focused on productivity,
    utility, self-hosted, homelab. It can be deployed on any device via Docker
    Compose.
  usecases:
    - Self-host Invio on your home server to self-hosted invoicing without the
      bloat. self-host it with docker using yantr without depending on
      third-party cloud services.
    - Use Invio to manage your productivity workflows privately, keeping all
      data under your control on local infrastructure.
  website: https://github.com/kittendevv/Invio/wiki
  logo: QmTxfLAvG4LnESZyVJ6dWMzXqJpaDYyTmKEhLxEux6PAH3
