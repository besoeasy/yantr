x-yantr:
  name: Networking Toolbox
  tags: [network, tools, self-hosted, homelab, podman]
  short_description: Networking utilities for subnetting, DNS, TLS, HTTP, and diagnostics.
  description: >
    Networking Toolbox bundles subnetting, IP, DNS, HTTP, TLS, and network
    diagnostics. Calculators work locally, while DNS, WHOIS/RDAP, geolocation,
    and live reachability checks may contact external services. Use it to plan
    addressing, inspect websites, and troubleshoot certificates and connectivity.
  usecases:
    [
      Check your public IP and location info.,
      Scan ports on a server.,
      Verify DNS records and propagation.,
      Check SSL certificate details.
    ]
  website: https://networking-toolbox.as93.net
  notes:
    [
      Extensive collection of networking tools,
      Calculators work offline; lookup and live diagnostic tools may require internet access.,
      Great for troubleshooting
    ]

services:
  networking-toolbox:
    image: docker.io/lissy93/networking-toolbox:latest
    labels:
      yantr.app: networking-toolbox
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    ports:
      - "3000"
    restart: unless-stopped
