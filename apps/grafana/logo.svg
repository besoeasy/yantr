  <!-- Ember sparks -->
  <circle cx="108" cy="68" r="2" fill="#ffab00" opacity="0.6"/>
  <circle cx="148" cy="76" r="1.5" fill="#ff9100" opacity="0.5"/>
  <circle cx="120" cy="56" r="1.5" fill="#ffab00" opacity="0.4"/>
