x-yantr:
  name: Prowlarr
  tags: [ media, tools, torrent, download, p2p ]
  short_description: Unified indexer manager for both Usenet and BitTorrent with
    PVR app integration.
  description: Prowlarr is an indexer manager that supports both Usenet and
    BitTorrent trackers. It acts as a central hub connecting your PVR apps
    (Sonarr, Radarr, Lidarr, Readarr, Sailarr) to both Usenet indexers and
    BitTorrent trackers through a unified API. Unlike Jackett which only
    supports BitTorren...
  usecases:
    [
      Manage all your Usenet and BitTorrent indexers in one place.,
      Connect Sonarr/Radarr to both Usenet and torrent sources.,
      Monitor which indexers are working and which are down.,
      Auto-discover new releases across all your indexers.
    ]
  website: https://github.com/linuxserver/docker-prowlarr
  notes:
    [
      Supports both Usenet (NZB) and BitTorrent protocols,
      Replaces both NZBHydra2 and Jackett,
      Single API key for all your PVR apps to use
    ]

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - prowlarr_config:/config
    ports:
      - "9696"
    restart: unless-stopped
    labels:
      yantr.app: prowlarr
      yantr.service.9696: Web UI
      yantr.port.9696: HTTP

volumes:
  prowlarr_config:
    name: prowlarr_config
