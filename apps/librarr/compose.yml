x-yantr:
  name: "librarr"
  tags: [books, audiobooks, manga, self-hosted, podman]
  short_description: "Book, audiobook, and manga downloader and manager."
  description: >
    Librarr is an all-in-one book, ebook, audiobook, and manga management
    service. Search catalogs, automate media downloads, organize digital
    libraries, and integrate directly with your personal media stack.
  usecases: ["Manage your ebook collection.", "Download audiobooks and manga."]
  website: "https://github.com/JeremiahM37/librarr"

services:
  librarr:
    image: ghcr.io/jeremiahm37/librarr:latest
    labels:
      yantr.app: "librarr"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - librarr_data:/data
    restart: unless-stopped

volumes:
  librarr_data:
