x-yantr:
  name: Sikka
  tags: [ crypto, blockchain, cryptocurrency, node, pow ]
  short_description: Feeless Proof-of-Work cryptocurrency node with a built-in browser wallet.
  description: Sikka is a modern, decentralized Proof-of-Work cryptocurrency node
    with zero transaction fees, HTTP-based federation, and a built-in browser
    wallet. Self-host it to validate the chain locally, expose its API on port
    8080, and participate in the network without relying on third-party
    infrastructure.
  usecases:
    [
      Run your own Sikka node and browser wallet so you can validate balances
        and transactions locally.,
      "Expose the built-in HTTP API for testing, integrations, and autonomous
        systems that need direct blockchain access.",
      Join the Sikka network with a self-hosted node instead of depending on
        shared public infrastructure.
    ]
  website: https://github.com/sikkacrypto/sikka
  notes:
    [
      Set miner to a valid lower-case sikka1... bech32m address to enable the
        built-in miner (optional).,
      Set SIKKA_PUBLIC_URL if this node should advertise a public URL to other
        Sikka peers.,
      The container stores chain data in the named volume mounted at
        /home/sikka/data.,
      The HTTP service on port 8080 serves both the API and the built-in
        wallet pages.
    ]

services:
  sikka:
    image: ghcr.io/sikkalabs/sikka:latest
    restart: unless-stopped
    labels:
      yantr.app: sikka
      yantr.service.64552: Node API and Wallet
      yantr.port.64552: HTTP
    environment:
      nodeprivatekey: ${nodeprivatekey:-}
      nodeaddress: ${nodeaddress:-}
      nodemessage: ${nodemessage:-}
    ports:
      - "64552"
    volumes:
      - sikka-data:/home/sikka/data

volumes:
  sikka-data: null
