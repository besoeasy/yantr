x-yantr:
  name: "blocky-ui"
  tags: [dns, network, adblock, webui, self-hosted]
  short_description: "Web management UI for Blocky DNS proxy and ad-blocker."
  description: >
    A graphical web interface for managing the Blocky DNS proxy. Monitor DNS
    queries in real time, manage allowlists and blocklists, inspect query
    logs, and configure DNS settings visually in your homelab.
  usecases: ["Monitor DNS query logs.", "Manage ad-blocking lists via a web UI."]
  website: "https://github.com/GabrielDuarteM/blocky-ui"

services:
  blocky-ui:
    image: ghcr.io/gabeduarte/blocky-ui:latest
    labels:
      yantr.app: "blocky-ui"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    restart: unless-stopped
