services:
  twenty-server:
    image: twentycrm/twenty:latest
    container_name: twenty-server
    ports:
      - "3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://twenty:${POSTGRES_PASSWORD}@twenty-db:5432/default
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      REDIS_URL: redis://twenty-redis:6379
      APP_SECRET: ${APP_SECRET}
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    depends_on:
      - twenty-db
      - twenty-redis
    restart: unless-stopped
    labels:
      yantr.app: "twenty"
      yantr.service: "CRM"

  twenty-db:
    image: postgres:16-alpine
    container_name: twenty-db
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: default
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: "twenty"
      yantr.service: "Database"

  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    volumes:
      - twenty_redis_data:/data
    restart: unless-stopped
    labels:
      yantr.app: "twenty"
      yantr.service: "Cache"

volumes:
  twenty_server_data:
  twenty_db_data:
  twenty_redis_data:
