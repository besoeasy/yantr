x-yantr:
  name: "ganymede"
  tags: [twitch, archiving, media, self-hosted, podman]
  short_description: "Automated Twitch stream and VOD downloader and archiver."
  description: >
    A self-hosted Twitch archiver that automatically detects live
    broadcasts, downloads VODs, clips, and chat logs, and presents an
    intuitive web interface for browsing and streaming your personal video
    archive.
  usecases: ["Archive Twitch streams automatically.", "Download and manage Twitch VODs."]
  website: "https://github.com/Zibbp/ganymede"

services:
  ganymede:
    image: ghcr.io/zibbp/ganymede:latest
    labels:
      yantr.app: "ganymede"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - ganymede_data:/data
    restart: unless-stopped

volumes:
  ganymede_data:
