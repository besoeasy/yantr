x-yantr:
  name: PrivateBin
  tags: [ utility, privacy, notes, wiki, productivity ]
  short_description: Minimalist open-source pastebin with zero-knowledge server
    design using client-side AES encryption.
  description: >
    PrivateBin is a minimalist pastebin where the server never receives the
    decryption key. Text is encrypted in the browser with AES-GCM, and the key
    stays in the URL fragment. Share encrypted notes, configuration snippets,
    one-time messages, and content with optional passwords and expiration.
  usecases:
    [
      "Share sensitive information like passwords, API keys, or configuration
        files securely by generating an encrypted link that only the recipient
        can decrypt.",
      Create temporary pastes that automatically delete after a specified time
        or after being read once with burn-after-reading option.,
      Share code snippets or logs with colleagues without the paste ever being
        stored in plain text on the server.,
      Use as a private alternative to public pastebin services for sharing
        confidential work documents.
    ]
  website: https://github.com/PrivateBin/PrivateBin
  notes:
    [
      "The encryption key is in the URL anchor (#), which is never sent to the
        server",
      Set a password for additional security beyond the URL-based encryption,
      Server cannot read paste contents - provides plausible deniability for
        hosting
    ]

services:
  privatebin:
    image: docker.io/privatebin/nginx-fpm-alpine:latest
    labels:
      yantr.app: privatebin
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    ports:
      - "8080"
    volumes:
      - privatebin_data:/srv/data
      - privatebin_config:/srv/cfg
    restart: unless-stopped

volumes:
  privatebin_data: null
  privatebin_config: null
