x-yantr:
  name: Specter Desktop
  tags: [ security, tools, bitcoin, crypto, blockchain ]
  short_description: Bitcoin wallet with hardware device support, multisig, and
    air-gapped signing.
  description: Specter Desktop is a beginner-friendly yet powerful Bitcoin wallet
    that works with hardware wallets (Ledger, Trezor, etc.), supports multisig
    configurations, and offers air-gapped signing for enhanced security. It
    connects to your Bitcoin node for full verification while providing a
    clean...
  usecases:
    [
      Manage Bitcoin with hardware wallet.,
      Set up multisig Bitcoin vault.,
      Air-gapped transaction signing.
    ]
  website: https://specter.solutions/desktop
  notes:
    [
      Requires Bitcoin node connection,
      Hardware wallet support,
      Multisig capable
    ]

services:
  specter-desktop:
    image: ghcr.io/cryptoadvance/specter-desktop:v2.1.1
    labels:
      yantr.app: specter-desktop
      yantr.service.25441: Web UI
      yantr.port.25441: HTTP
    ports:
      - "25441"
    restart: unless-stopped
