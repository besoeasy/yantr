x-yantr:
  name: Specter Desktop
  tags: [ security, tools, bitcoin, crypto, blockchain ]
  short_description: Bitcoin wallet with hardware device support, multisig, and
    air-gapped signing.
  description: >
    Specter Desktop is a Bitcoin wallet focused on hardware-wallet security and
    self-custody. Connect to a Bitcoin node, use Ledger or Trezor devices,
    configure multisig wallets, and sign transactions air-gapped. Review fees,
    confirmations, and transaction details before broadcasting.
  usecases:
    [
      Manage Bitcoin with hardware wallet.,
      Set up multisig Bitcoin vault.,
      Air-gapped transaction signing.
    ]
  website: https://specter.solutions/desktop
  notes:
    [
      Requires Bitcoin node connection,
      Hardware wallet support,
      Multisig capable
    ]

  ports:
    - {port: 25441, protocol: HTTP, show: true, label: "Web UI", service: specter-desktop}

services:
  specter-desktop:
    image: ghcr.io/cryptoadvance/specter-desktop:v2.1.1
    ports:
      - "25441"
    restart: unless-stopped
