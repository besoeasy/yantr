x-environment: &a1
  NGINX_PORT: 80
  LISTEN_HTTP_PORT: 80
  BUCKET_NAME: uploads
  GUNICORN_WORKERS: 2
  POSTGRES_DB: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${DB_PASSWORD}
  DATABASE_URL: postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
  REDIS_URL: redis://plane-redis:6379/0
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: plane
  CELERY_BROKER_URL: amqp://plane:${RABBIT_PASSWORD}@plane-rabbitmq:5672/plane
  USE_MINIO: 1
  AWS_ACCESS_KEY_ID: yantr
  AWS_SECRET_ACCESS_KEY: ${APP_PASSWORD}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  FILE_SIZE_LIMIT: 52428800
  MINIO_ENDPOINT_SSL: 0
  MINIO_ROOT_USER: yantr
  MINIO_ROOT_PASSWORD: ${APP_PASSWORD}
  SECRET_KEY: ${APP_SEED}
  LIVE_SERVER_SECRET_KEY: ${APP_SEED}
  USE_X_FORWARDED_HOST: 1
  SECURE_SSL_REDIRECT: 0
  SESSION_COOKIE_SECURE: 0
  CSRF_COOKIE_SECURE: 0
  WEBHOOK_ALLOWED_IPS: ""
  WEBHOOK_ALLOWED_HOSTS: ""

x-yantr:
  name: Plane
  tags:
    - productivity
    - project-management
    - jira
    - kanban
    - issues
  short_description: Open-source Jira alternative to track issues, sprints, and product roadmaps.
  description: Plane is a powerful open-source project management tool designed to
    track issues, run sprint cycles, and manage product roadmaps. It offers a
    robust rich text editor, sub-properties, referenced issues, and cycle
    tracking with burn-down charts. You can simplify complex projects with
    modules, custo...
  usecases:
    - Run agile sprint cycles with burn-down charts and issue tracking.
    - Manage product roadmaps and divide complex projects into modules.
    - Replace Jira with a fast, modern, fully self-hosted alternative.
    - Capture notes, ideas, and actionable items using Plane Pages.
  website: https://plane.so
  notes:
    - This is a heavy enterprise-grade stack (12 containers). Requires at least
      4 GB of RAM (8 GB recommended).
    - The first boot will take a few minutes as the database migrations run.
    - Attachments are stored in a self-hosted MinIO bucket automatically
      configured.
  env_generators:
    DB_PASSWORD:
      length: 32
      charset: alnum
    RABBIT_PASSWORD:
      length: 32
      charset: alnum
    APP_PASSWORD:
      length: 32
      charset: alnum
    APP_SEED:
      length: 64
      charset: base64url
services:
  plane-nginx:
    image: nginx:alpine
    container_name: plane-nginx
    ports:
      - "8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plane-web
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-db:
    image: postgres:16-alpine
    container_name: plane-db
    user: 1000:1000
    environment:
      <<: *a1
    volumes:
      - plane_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-redis:
    image: redis:7-alpine
    container_name: plane-redis
    volumes:
      - plane_redis:/data
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: plane-rabbitmq
    user: 1000:1000
    environment:
      <<: *a1
    volumes:
      - plane_rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    user: 1000:1000
    command: server /export --console-address ":8763"
    environment:
      <<: *a1
    volumes:
      - plane_uploads:/export
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-api:
    image: makeplane/plane-backend:v1.3.1
    container_name: plane-api
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-db
      - plane-redis
      - plane-rabbitmq
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-worker:
    image: makeplane/plane-backend:v1.3.1
    container_name: plane-worker
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-api
      - plane-redis
      - plane-rabbitmq
    command:
      - sh
      - -c
      - celery -A plane worker --loglevel=info
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-beat-worker:
    image: makeplane/plane-backend:v1.3.1
    container_name: plane-beat-worker
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-api
      - plane-redis
      - plane-rabbitmq
    command:
      - sh
      - -c
      - celery -A plane beat --loglevel=info
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-migrator:
    image: makeplane/plane-backend:v1.3.1
    container_name: plane-migrator
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-db
    command:
      - sh
      - -c
      - python manage.py wait_for_db && python manage.py migrate
    restart: on-failure
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-web:
    image: makeplane/plane-frontend:v1.3.1
    container_name: plane-web
    environment:
      <<: *a1
    depends_on:
      - plane-api
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-live:
    image: makeplane/plane-live:v1.3.1
    container_name: plane-live
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-api
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-space:
    image: makeplane/plane-space:v1.3.1
    container_name: plane-space
    user: 1000:1000
    environment:
      <<: *a1
    depends_on:
      - plane-api
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP
  plane-admin:
    image: makeplane/plane-admin:v1.3.1
    container_name: plane-admin
    environment:
      <<: *a1
    depends_on:
      - plane-api
    restart: unless-stopped
    labels:
      yantr.app: plane
      yantr.service.8080: Web UI (Router)
      yantr.port.8080: HTTP

volumes:
  plane_db: null
  plane_redis: null
  plane_rabbitmq: null
  plane_uploads: null

version: "3.7"
