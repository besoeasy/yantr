x-yantr:
  name: "strava-stats"
  tags: [fitness, strava, analytics, self-hosted, podman]
  short_description: "Self-hosted dashboard for Strava activity statistics."
  description: >
    A self-hosted analytics dashboard that connects with your Strava account
    to display detailed statistics, trends, charts, and performance insights
    for your running, cycling, and workout activities over time.
  usecases: ["View Strava activity stats.", "Track fitness progress over time.", "Analyze workout performance."]
  website: "https://github.com/henry-woody/strava-stats"
  notes: ["Requires Strava API Application credentials (Client ID, Client Secret, Refresh Token)."]

services:
  strava-stats:
    image: ghcr.io/henry-woody/strava-stats:latest
    labels:
      yantr.app: "strava-stats"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN:-}
    ports:
      - "8080"
    volumes:
      - strava_stats_data:/data
    restart: unless-stopped

volumes:
  strava_stats_data:
