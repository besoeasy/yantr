x-yantr:
  name: "Ghost"
  tags: [blogging, publishing, newsletter, self-hosted, cms]
  short_description: "Publishing platform for blogs, newsletters, and memberships."
  description: >
    Ghost publishes blogs and newsletters with themes, member subscriptions,
    and email delivery. Creator-focused and fast. Two containers (app plus
    MySQL) with content and database volumes for persistence.
  usecases: ["Publish a blog with themes and member subscriptions.", "Send newsletters with paid membership tiers.", "Run a fast publication without platform fees."]
  website: "https://ghost.org/"
  env_generators:
    MYSQL_ROOT_PASSWORD: {length: 24, charset: alnum}
  notes: ["Complete owner setup in the web UI on first run.", "Content and database persist in named volumes."]
  ports:
    - {port: 2368, protocol: HTTP, show: true, label: "Web UI", service: ghost-web}

services:
  ghost-web:
    image: docker.io/library/ghost:latest
    environment:
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost
    ports:
      - "2368"
    volumes:
      - ghost_content:/var/lib/ghost/content
    depends_on:
      - ghost-db
    restart: unless-stopped

  ghost-db:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
    volumes:
      - ghost_db:/var/lib/mysql
    restart: unless-stopped

volumes:
  ghost_content:
  ghost_db:
