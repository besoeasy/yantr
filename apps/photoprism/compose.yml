services:
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    labels:
      yantr.app: "photoprism"
      yantr.service: "Web UI"
    ports:
      - "2342"
    environment:
      PHOTOPRISM_ADMIN_USER: ${PHOTOPRISM_ADMIN_USER:-admin}
      PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
      PHOTOPRISM_AUTH_MODE: "password"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "mariadb:3306"
      PHOTOPRISM_DATABASE_NAME: "photoprism"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DATABASE_PASSWORD}
    volumes:
      - photoprism_originals:/photoprism/originals
      - photoprism_storage:/photoprism/storage
    restart: unless-stopped
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    container_name: photoprism-db
    labels:
      yantr.app: "photoprism"
      yantr.service: "Database"
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDAEMON_BUG_WORKAROUND: "1"
      MARIADB_DATABASE: "photoprism"
      MARIADB_USER: "photoprism"
      MARIADB_PASSWORD: ${PHOTOPRISM_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - photoprism_db:/var/lib/mysql
    restart: unless-stopped

volumes:
  photoprism_originals:
  photoprism_storage:
  photoprism_db:
