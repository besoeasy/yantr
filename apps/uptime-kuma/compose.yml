x-yantr:
  name: Uptime Kuma
  tags: [ tools, network, monitoring, dashboard, utility ]
  short_description: Self-hosted uptime monitoring tool with status pages,
    notifications, and 30+ check types.
  description: >
    Uptime Kuma is a self-hosted dashboard for tracking services over time. It
    supports HTTP(S), TCP, ping, DNS, push, certificate, and many other checks
    with history, notifications, and status pages. Monitor APIs, self-hosted apps,
    networks, and container endpoints from one interface.
  usecases:
    [
      "Monitor your self-hosted services (Home Assistant, Jellyfin, Nextcloud)
        and get alerted when they go down.",
      Create a public status page to show your family or users that your
        services are running smoothly.,
      Track SSL certificate expiration dates and get notified before
        certificates expire.,
      Monitor container-backed services through their HTTP or TCP endpoints.
    ]
  website: https://github.com/louislam/uptime-kuma/wiki
  notes:
    [
      "Supports over 30 monitoring types including HTTP, TCP, Ping, DNS, and
        more",
      Can monitor Docker containers directly via socket mount,
      Push endpoint available for services to send their own status updates
    ]

services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    labels:
      yantr.app: uptime-kuma
      yantr.service.3001: Web UI
      yantr.port.3001: HTTP
    ports:
      - "3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped

volumes:
  uptime_kuma_data: null
