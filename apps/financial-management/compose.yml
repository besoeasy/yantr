x-yantr:
  name: "financial-management"
  tags: [finance, budget, accounting, self-hosted, podman]
  short_description: "Comprehensive personal finance and budget management dashboard."
  description: >
    A self-hosted personal finance platform for tracking household income,
    expenses, assets, and monthly budgets. Gain financial clarity with
    interactive visual reports, categorization, and balance summaries.
  usecases: ["Track monthly income and expenses.", "Set and monitor budget goals."]
  website: "https://github.com/LuoDi-Nate/financial-management"

services:
  financial-management:
    image: ghcr.io/luodi-nate/financial-management:latest
    labels:
      yantr.app: "financial-management"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - financial_management_data:/data
    restart: unless-stopped

volumes:
  financial_management_data:
