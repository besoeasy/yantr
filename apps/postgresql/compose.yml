x-yantr:
  name: PostgreSQL
  tags: [ database, storage, utility, self-hosted, homelab ]
  short_description: Open-source relational database with JSON support, full-text
    search, and extensions.
  description: PostgreSQL is a powerful, open-source object-relational database
    system known for reliability, feature robustness, and performance. It
    supports both SQL (relational) and JSON (non-relational) querying, making it
    perfect for modern applications. Features include ACID compliance, MVCC for
    co...
  usecases:
    [
      "Use as the database backend for complex applications like Wiki.js,
        Ghostfolio, or Home Assistant.",
      Store JSON data alongside relational data in the same database.,
      Enable full-text search for building search features in your
        applications.,
      Use pgvector extension for storing and querying AI embeddings.
    ]
  website: https://github.com/postgres/postgres
  notes:
    [
      Requires POSTGRES_PASSWORD environment variable,
      Can use volumes for data persistence,
      Supports numerous extensions for specialized use cases
    ]

services:
  postgresql:
    image: postgres:latest
    labels:
      yantr.app: postgresql
      yantr.service.5432: Database
      yantr.port.5432: TCP
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgresql_data: null
