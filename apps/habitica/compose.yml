x-yantr:
  name: Habitica
  tags: [ productivity, habits, gamification, tasks, self-hosted ]
  short_description: Self-hosted gamified habit tracker and task manager.
  description: Habitica is a self-hosted, gamified habit tracker that turns your
    daily tasks, habits, and to-do lists into a role-playing game. Earn
    experience points, level up your character, and stay motivated to accomplish
    your goals.
  usecases:
    [
      Build positive habits through game-like reward systems.,
      Manage daily tasks and to-do lists with RPG progression.,
      Form accountability groups with friends to stay on track.
    ]
  website: https://habitica.com
  notes:
    [
      BASE_URL must be updated to your server's actual URL for proper
        functionality.
    ]

services:
  server:
    image: awinterstein/habitica-server:latest
    container_name: habitica-server
    labels:
      yantr.app: habitica
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    environment:
      TZ: ${TZ:-UTC}
      NODE_DB_URI: mongodb://habitica-mongo:27017/habitica
      BASE_URL: http://localhost:3000
    command: "sh -c \"perl -0pi -e 's/upgradeInsecureRequests: IS_PROD \\? \\[\\] :
      null,?/upgradeInsecureRequests: null/g'
      /var/lib/habitica/website/server/middlewares/index.js
      /var/lib/habitica/website/transpiled-babel/middlewares/index.js &&
      printenv | grep -v 'no_proxy' >> /etc/environment && /etc/init.d/cron
      start && node /var/lib/habitica/website/transpiled-babel/index.js\""
    ports:
      - "3000"
    depends_on:
      - mongo
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: habitica-mongo
    volumes:
      - habitica_mongo:/data/db
    restart: unless-stopped
    labels:
      yantr.app: habitica
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP

volumes:
  habitica_mongo: null
