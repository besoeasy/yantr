x-yantr:
  name: ConvertX
  tags: [ conversion, documents, media, ffmpeg, self-hosted ]
  short_description: Self-hosted file converter - audio, video, images, documents, and archives.
  description: ConvertX is a self-hosted file conversion tool for audio, video,
    images, documents, and archives. It processes files locally on your server,
    offering a simple web interface for uploads and conversions and supporting
    common codecs and formats without external services.
  usecases:
    [
      Convert video, audio, and images between supported formats.,
      Extract audio from video files for offline listening.,
      Process documents and archives locally through the web interface.
    ]
  website: https://github.com/C4illin/ConvertX
  notes: [ Multiple format support, Local processing only, Web interface for easy use ]

  ports:
    - {port: 3000, protocol: HTTP, show: true, label: "Web UI", service: convertx}

services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    ports:
      - "3000"
    restart: unless-stopped
