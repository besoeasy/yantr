x-yantr:
  name: "beaver-habit-tracker"
  tags: [habits, productivity, tracking, self-hosted, docker]
  short_description: "Simple and effective habit tracking application."
  description: >
    A self-hosted habit tracker that helps you build and maintain
    positive routines. Track daily habits, visualize streaks, and
    stay accountable with a clean and motivating interface.
  usecases: ["Track daily habits.", "Build consistent routines.", "Visualize habit streaks."]
  website: "https://github.com/daydreamiq/beaver-habit-tracker"

services:
  beaver-habit-tracker:
    image: ghcr.io/daydreamiq/beaver-habit-tracker:latest
    container_name: beaver-habit-tracker
    labels:
      yantr.app: "beaver-habit-tracker"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - beaver_habit_tracker_data:/data
    restart: unless-stopped

volumes:
  beaver_habit_tracker_data:
