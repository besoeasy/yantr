x-yantr:
  name: "beaver-habit-tracker"
  tags: [habits, productivity, tracking, self-hosted, podman]
  short_description: "Simple, effective, and private habit tracking application."
  description: >
    A self-hosted habit tracker that helps you build, maintain, and review
    positive daily routines. Track your habits, visualize streaks, and stay
    accountable with a clean, privacy-focused homelab dashboard.
  usecases: ["Track daily habits.", "Build consistent routines.", "Visualize habit streaks."]
  website: "https://github.com/daydreamiq/beaver-habit-tracker"

services:
  beaver-habit-tracker:
    image: ghcr.io/daydreamiq/beaver-habit-tracker:latest
    labels:
      yantr.app: "beaver-habit-tracker"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - beaver_habit_tracker_data:/data
    restart: unless-stopped

volumes:
  beaver_habit_tracker_data:
