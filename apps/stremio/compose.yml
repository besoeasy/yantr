x-yantr:
  name: Stremio
  tags: [ media, streaming, video, self-hosted, homelab ]
  short_description: Media center for streaming with addons - movies, shows, and video content.
  description: Stremio is a media center application that lets you discover and
    watch videos. It supports movies, TV shows, and video content through
    community-built addons. The server version allows you to host your own
    streaming backend. Features include addons for various content sources,
    library for...
  usecases:
    [
      Organize your video library.,
      Discover new movies and shows through addons.,
      Track what you've watched.
    ]
  website: https://github.com/Stremio/stremio-web
  notes:
    [
      This deploys the Stremio streaming server only (not the web UI). Use
        with the Stremio desktop app or web.stremio.com.,
      "HTTP is on port 11470, HTTPS on 12470. These are separate services — do
        not reverse-proxy both to the HTTP port.",
      "HTTPS needs a Stremio-issued certificate. In the Stremio app, open
        Settings → Streaming and set your LAN/public IP as the HTTPS endpoint so
        the server can fetch a cert from api.strem.io.",
      "For web.stremio.com, paste the HTTPS streaming URL
        (https://your-host:12470-port) into Settings → Streaming → URL. Accept
        the browser certificate warning on first visit.",
      NO_CORS is enabled so web.stremio.com can reach your server across
        origins.,
      Use responsibly.
    ]

services:
  stremio:
    image: stremio/server:latest
    container_name: stremio
    restart: unless-stopped
    ports:
      - "11470"
      - "12470"
    environment:
      NO_CORS: "1"
    labels:
      yantr.app: stremio
      yantr.service.11470: Streaming Server
      yantr.port.11470: HTTP
      yantr.service.12470: Streaming Server (TLS)
      yantr.port.12470: HTTPS
