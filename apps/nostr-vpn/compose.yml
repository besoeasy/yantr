x-yantr:
  name: Nostr VPN
  tags: [ vpn, nostr, privacy, networking, self-hosted ]
  short_description: Decentralized VPN daemon and web UI built on the Nostr
    protocol for P2P tunnels.
  description: Nostr VPN is a decentralized VPN daemon and web UI built on the
    Nostr protocol. It creates peer-to-peer encrypted tunnels without central
    servers, using Nostr relays for peer discovery and key exchange. Manage
    connections and monitor status via the built-in web interface.
  usecases:
    [
      Create encrypted peer-to-peer tunnels between devices without relying on
        centralized VPN servers.,
      Use Nostr identity keys to authenticate and establish VPN connections
        with other Nostr users.
    ]
  website: https://github.com/mmalmi/nostr-vpn
  logo: QmUTShSH3pWFQKj2nNhzNk6UwYy2qmEm3wNhn98sEFcmsW
  notes:
    [
      The daemon requires NET_ADMIN capability and access to /dev/net/tun for
        creating VPN tunnel interfaces.,
      The daemon runs in host network mode to manage system-level routing.,
      Both services share a single named volume for config and state. Do not
        run multiple instances on the same host.
    ]

services:
  daemon:
    image: ghcr.io/mmalmi/nostr-vpn-umbrel:v4.0.47
    container_name: nostr-vpn-daemon
    restart: on-failure
    stop_grace_period: 1m
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    entrypoint:
      - /usr/local/bin/nvpn
    command:
      - daemon
      - --config
      - /data/config/nvpn/config.toml
    environment:
      HOME: /data/home
      XDG_CONFIG_HOME: /data/config
      RUST_LOG: info
    volumes:
      - nostr_vpn_data:/data
    labels:
      yantr.app: nostr-vpn
      yantr.service.38080: Web UI
      yantr.port.38080: HTTP
  web:
    image: ghcr.io/mmalmi/nostr-vpn-umbrel:v4.0.47
    container_name: nostr-vpn-web
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - daemon
    ports:
      - "38080"
    environment:
      HOME: /data/home
      XDG_CONFIG_HOME: /data/config
      NVPN_CLI_PATH: /usr/local/bin/nvpn
      NVPN_DAEMON_STATUS_MODE: state-file
      NVPN_EXTERNAL_DAEMON: "true"
      RUST_LOG: info
    volumes:
      - nostr_vpn_data:/data
    labels:
      yantr.app: nostr-vpn
      yantr.service.38080: Web UI
      yantr.port.38080: HTTP

volumes:
  nostr_vpn_data: null
