services:
  bitwatch:
    image: ghcr.io/zapomatic/bitwatch:latest
    container_name: bitwatch
    restart: unless-stopped
    ports:
      - "3117"
    volumes:
      - bitwatch-data:/app/server/data
    labels:
      yantr.app: bitwatch
      yantr.service.3117: Web UI
      yantr.port.3117: HTTP
volumes:
  bitwatch-data: null
x-yantr:
  name: Bitwatch
  tags:
    - tools
    - blockchain
    - monitoring
    - dashboard
    - utility
  short_description: Monitor Bitcoin addresses in mempool and on-chain with notifications.
  description: Monitor Bitcoin addresses in mempool and on-chain with
    notifications. Bitwatch is a self-hosted application focused on tools,
    blockchain, monitoring, dashboard. It can be deployed on any device via
    Docker Compose.
  usecases:
    - Self-host Bitwatch on your home server to monitor bitcoin addresses in
      mempool and on-chain with notifications without depending on third-party
      cloud services.
    - Use Bitwatch to manage your tools workflows privately, keeping all data
      under your control on local infrastructure.
  website: https://github.com/zapomatic/bitwatch
  logo: QmX4wcMVLo1mvb38iyH9xQfmXyB9DAdLesDqvsFjhU7iP8
