x-yantr:
  name: qbittorrent-autoclean
  tags: [torrent, download, p2p, self-hosted, docker]
  short_description: "qBittorrent client with auto-cleanup of old downloads."
  description: >
    A self-hosted qBittorrent BitTorrent client with automatic cleanup
    of downloads older than 30 days. A lightweight Alpine sidecar runs a
    daily job that removes expired files and empty directories. Features
    a modern ad-free web interface with integrated search, RSS support,
    and bandwidth scheduling.
  usecases: ["Download torrents.", "Auto-clean old files after 30 days.", "Self-host media downloads."]
  website: "https://www.qbittorrent.org/"
  notes: ["Web UI runs on port 8080.", "Search plugins available for installation."]
  env_generators:
    QB_USER: {length: 12, charset: alpha}
    QB_PASSWORD: {length: 20, charset: alnum_symbols}

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent-autoclean
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WEBUI_PORT: 8080
    volumes:
      - qbit_ac_config:/config
      - qbit_ac_downloads:/downloads
    ports:
      - "8080"
      - "6881"
      - 6881/udp
    labels:
      yantr.app: "qbittorrent-autoclean"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
      yantr.service.6881: "BitTorrent Peers"
      yantr.port.6881: "TCP"
    restart: unless-stopped

  cleanup:
    image: alpine:latest
    container_name: qbittorrent-autoclean-cleanup
    labels:
      yantr.app: "qbittorrent-autoclean"
    volumes:
      - qbit_ac_downloads:/downloads
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 60
        while true; do
          echo "[cleanup] Removing files older than 30 days..."
          find /downloads -type f -mtime +30 -delete 2>/dev/null
          find /downloads -type d -empty -delete 2>/dev/null
          echo "[cleanup] Done. Sleeping 24h."
          sleep 86400
        done
    restart: unless-stopped

volumes:
  qbit_ac_config:
  qbit_ac_downloads:
