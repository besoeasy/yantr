x-yantr:
  name: Originless
  tags: [ storage, files, privacy, ipfs, self-hosted ]
  short_description: Self-hosted anonymous file storage backend built on IPFS.
  description: Originless is a self-hosted storage backend built on IPFS. It lets
    you upload and share files anonymously with no accounts, no tracking, and no
    logs. Works as a drop-in backend for apps, screenshot tools, pastebin-style
    pastes, Nostr clients, and anything else that needs durable file hosting.
  usecases:
    [
      Use as a self-hosted image and file host for your apps without relying
        on third-party cloud storage.,
      Host files anonymously on IPFS — content persists across the network
        even if your node goes offline.,
      Drop it into any tool or platform via the simple REST API in minutes.
    ]
  website: https://github.com/besoeasy/Originless
  notes:
    [
      Set STORAGE_MAX to control how much disk space IPFS can use — defaults
        to 200GB.,
      Port 4001 is used for IPFS swarm connections — keep it open if you want
        peers to find your node.,
      Replace https://originless.besoeasy.com with http://localhost:3232 in
        API calls if using self-hosted.
    ]

services:
  originless:
    image: ghcr.io/besoeasy/originless:latest
    init: true
    container_name: originless
    hostname: originless
    environment:
      STORAGE_MAX: ${STORAGE_MAX:-200GB}
    volumes:
      - originless:/app/data
    ports:
      - "3232"
      - 4001/tcp
      - 4001/udp
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3232 || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    labels:
      yantr.app: originless
      yantr.service.3232: Web UI
      yantr.port.3232: HTTP

volumes:
  originless: null
