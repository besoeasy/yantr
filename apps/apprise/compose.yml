x-yantr:
  name: "apprise"
  tags: [notifications, gateway, utility, self-hosted, podman]
  short_description: "Universal notification gateway for all major platforms."
  description: >
    A universal notification gateway for homelabs and servers. Send push
    notifications to over 80 services including Discord, Telegram, Slack,
    Gotify, and email using a lightweight, unified REST API that runs
    locally.
  usecases: ["Send alerts to multiple services.", "Integrate notifications in apps.", "Unified notification API."]
  website: "https://github.com/caronc/apprise-api"

services:
  apprise:
    image: ghcr.io/caronc/apprise:latest
    labels:
      yantr.app: "apprise"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - apprise_data:/data
    restart: unless-stopped

volumes:
  apprise_data:
