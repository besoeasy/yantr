services:
  server:
    image: homeassistant/home-assistant:latest
    container_name: home-assistant
    labels:
      yantr.app: "home-assistant"
      yantr.service: "Web UI"
    network_mode: host
    privileged: true
    volumes:
      - home_assistant_config:/config
    restart: unless-stopped

volumes:
  home_assistant_config:
