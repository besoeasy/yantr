x-yantr:
  name: "react-glass-keep"
  tags: [notes, productivity, google-keep, self-hosted, podman]
  short_description: "Modern, self-hosted alternative to Google Keep notes app."
  description: >
    React Glass Keep is a modern, self-hosted note-taking app inspired by
    Google Keep. Organize ideas with color-coded notes, tags, checklists,
    and search in a responsive, glassmorphic web interface that respects
    your privacy.
  usecases: ["Take and organize notes.", "Create labeled notes with colors."]
  website: "https://github.com/nikunjsingh93/react-glass-keep"

services:
  react-glass-keep:
    image: ghcr.io/nikunjsingh93/react-glass-keep:latest
    labels:
      yantr.app: "react-glass-keep"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - react_glass_keep_data:/data
    restart: unless-stopped

volumes:
  react_glass_keep_data:
