x-yantr:
  name: "ghostdesk"
  tags: [ai, desktop, automation, productivity, self-hosted]
  short_description: "AI-driven desktop automation, scripting, and control system."
  description: >
    GhostDesk is an AI-powered desktop automation platform that interprets
    natural language instructions to control desktop applications, automate
    repetitive tasks, and execute complex administrative workflows.
  usecases: ["Automate desktop tasks with AI.", "Control computer via natural language."]
  website: "https://github.com/YV17labs/GhostDesk"

services:
  ghostdesk:
    image: ghcr.io/yy17labs/ghostdesk:latest
    labels:
      yantr.app: "ghostdesk"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - ghostdesk_data:/data
    restart: unless-stopped

volumes:
  ghostdesk_data:
