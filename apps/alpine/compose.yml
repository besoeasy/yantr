x-yantr:
  name: "alpine"
  tags: [linux, alpine, minimal, podman, self-hosted]
  short_description: "Minimal Alpine Linux container for lightweight workloads."
  description: >
    A lightweight Alpine Linux container ideal for running minimal workloads,
    scripts, and utility tasks. Alpine's small footprint makes it perfect for
    resource-constrained environments and quick experimentation.
  usecases: ["Run lightweight utility scripts.", "Experiment with minimal Linux environments."]
  website: "https://alpinelinux.org/"

services:
  alpine:
    image: docker.io/alpine:latest
    labels:
      yantr.app: "alpine"
      yantr.service.8080: "Web server"
      yantr.port.8080: "HTTP"
      yantr.service.80: "HTTP server"
      yantr.port.80: "HTTP"
      yantr.service.443: "HTTPS server"
      yantr.port.443: "HTTPS"
      yantr.service.3000: "Dev server"
      yantr.port.3000: "HTTP"
      yantr.service.9000: "Alt server"
      yantr.port.9000: "HTTP"
    environment: {}
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    ports:
      - "8080"
      - "80"
      - "443"
      - "3000"
      - "9000"
    volumes:
      - alpine_data:/data
    restart: unless-stopped

volumes:
  alpine_data:
