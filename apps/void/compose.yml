x-yantr:
  name: "void"
  tags: [filehosting, storage, self-hosted, podman]
  short_description: "Self-hosted file hosting and sharing service with clean UI."
  description: >
    Void is an ultra-minimalist file hosting and asset sharing service. Drag
    and drop documents, images, and archives to generate instant, clean
    shareable links with customizable storage settings and zero tracking.
  usecases: ["Host files for personal access.", "Share files via direct links."]
  website: "https://github.com/AlphaNecron/Void"

  ports:
    - {port: 8080, protocol: HTTP, show: true, label: "Web UI", service: void}

services:
  void:
    image: docker.io/alphanecron/void:v1
    ports:
      - "8080"
    volumes:
      - void_data:/data
    restart: unless-stopped

volumes:
  void_data:
