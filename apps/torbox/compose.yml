x-yantr:
  name: "TorBox"
  tags: [torrent, streaming, media, self-hosted, podman]
  short_description: "All-in-one torrent box: download, serve, and auto-clean old files."
  description: >
    TorBox bundles a torrent client, a web UI for adding magnets, and an HTTP file
    server into a single container. Paste a magnet, wait for it to finish, then stream
    the file to your TV, phone, or laptop with proper seeking. Downloads untouched for
    30 days are cleaned up automatically.
  usecases:
    [
      "Add torrents from a simple web UI and stream the finished file to any device.",
      "Stream downloads to a TV, VLC, or phone browser with seeking, not buffering.",
      "Keep disk usage in check by deleting files you have not touched in a set number of days.",
    ]
  website: "https://github.com/besoeasy/torbox"
  notes:
    [
      "The torrent UI on 45001 has no login — keep it on a trusted network or put it behind a reverse proxy with auth.",
      "The file server on 45000 is readable by anyone who can reach it until you set DUFS_PASS to `user:pass` in the deploy form.",
      "Setting DUFS_PASS also enables uploads and deletes through the file server.",
      "AUTO_CLEAN_DAYS sets how many days an untouched file is kept; the default is 30 and `0` disables cleaning.",
      "Port 51413 (TCP + UDP) is the torrent peer port. Forward it on your router for better connectivity.",
    ]

  ports:
    - {port: 45001, protocol: HTTP, show: true, label: "Torrent UI", service: torbox}
    - {port: 45000, protocol: HTTP, show: true, label: "File Server", service: torbox}
    - {port: 51413, protocol: TCP, label: "Peer Port", service: torbox}
    - {port: 51413, protocol: UDP, label: "Peer Port", service: torbox}

services:
  torbox:
    image: ghcr.io/besoeasy/torbox:latest
    environment:
      AUTO_CLEAN_DAYS: ${AUTO_CLEAN_DAYS:-30}
    ports:
      - "45001"
      - "45000"
      - 51413/tcp
      - 51413/udp
    volumes:
      - torbox_data:/data
      - torbox_config:/config
    restart: unless-stopped

volumes:
  torbox_data:
  torbox_config:
