x-yantr:
  name: qBittorrent
  tags: [ download, network, torrent, p2p, search ]
  short_description: Feature-rich torrent client with a web UI, search plugins, and no ads.
  description: >
    qBittorrent is a cross-platform BitTorrent client with an ad-free web
    interface. This image runs the headless qBittorrent-nox daemon with search
    plugins, RSS downloads, categories, bandwidth scheduling, and remote controls.
    Manage large torrent libraries and automated media workflows from a browser.
  usecases:
    [
      Download torrents with feature-rich UI.,
      Use RSS feeds for automated downloads.,
      Integrated search with plugins.
    ]
  website: https://github.com/linuxserver/docker-qbittorrent
  notes: [ Web UI runs on port 8080, Peer port is 6881, Search plugins available ]

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
    ports:
      - "8080"
      - "6881"
      - 6881/udp
    restart: unless-stopped
    labels:
      yantr.app: qbittorrent
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
      yantr.service.6881: Torrent
      yantr.port.6881: UDP

volumes:
  qbittorrent-config: null
  qbittorrent-downloads: null
