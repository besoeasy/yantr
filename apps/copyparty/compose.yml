x-yantr:
  name: Copyparty
  tags: [ files, storage, sharing, self-hosted, upload ]
  short_description: Self-hosted file server with resumable uploads and media streaming.
  description: Copyparty is a feature-rich self-hosted file server with resumable
    uploads, audio and video streaming, file search, thumbnails, and torrent
    support. Designed for sharing files across devices with minimal
    configuration and no external dependencies.
  usecases:
    [
      Upload and share files with friends and family on your own server.,
      Stream music and video from your personal collection.,
      Search through stored files with built-in indexing and metadata support.
    ]
  website: https://github.com/9001/copyparty

services:
  web:
    image: ghcr.io/9001/copyparty-ac:latest
    container_name: copyparty
    labels:
      yantr.app: copyparty
      yantr.service.3923: Web UI
      yantr.port.3923: HTTP
    restart: unless-stopped
    environment:
    ports:
      - "3923"
    volumes:
      - copyparty_config:/cfg/hists
      - copyparty_shared:/shr
      - copyparty_media:/media
      - copyparty_uploads:/uploads

volumes:
  copyparty_config: null
  copyparty_shared: null
  copyparty_media: null
  copyparty_uploads: null
