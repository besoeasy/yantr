x-yantr:
  name: Dashmachine
  tags: [ dashboard, organization, monitoring, utility, homepage ]
  short_description: Application dashboard with bookmarks, media discovery, and sleek UI.
  description: Dashmachine is an application dashboard for organizing bookmarks
    and homelab services with media discovery. It offers drag-and-drop layout,
    favicon fetching, dark/light themes, embedded media information, and easy
    web UI configuration for a polished home screen.
  usecases:
    [
      Organize bookmarks with auto-fetched icons.,
      Track media with embedded information.,
      Dashboard for homelab services.
    ]
  website: https://github.com/rmountjoy92/dashmachine
  notes: [ Media discovery features, Bookmark organization, Theme customization ]

services:
  dashmachine:
    image: rmountjoy/dashmachine:latest
    labels:
      yantr.app: dashmachine
      yantr.service.5000: Web UI
      yantr.port.5000: HTTP
    ports:
      - "5000"
    volumes:
      - dashmachine_data:/dashmachine/dashmachine/user_data
    restart: unless-stopped

volumes:
  dashmachine_data: null
