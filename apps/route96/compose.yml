x-yantr:
  name: Route96
  tags:
    - nostr
    - social
    - media
    - storage
    - blossom
  short_description: Self-hosted Blossom/NIP-96 media server for the Nostr ecosystem.
  description: Route96 is a self-hosted Nostr media server implementing the
    Blossom protocol and NIP-96. Built in Rust, it handles file uploads,
    image/video compression, WebP conversion, thumbnails, EXIF privacy
    protection, per-user quotas, and an admin moderation dashboard.
  usecases:
    - Host your own Nostr media server for personal or community file storage.
    - Serve images and videos to Nostr clients with Blossom and NIP-96 support.
    - Run a moderated media host with per-user quotas and an admin review queue.
    - Pair with a Nostr relay (e.g. strfry) for a fully self-hosted Nostr node.
  website: https://github.com/v0l/route96
  logo: QmNR4kyKJs3sZwdRJZ47z5feUWn6S8aJw31wzZrXK2fVcD
  notes:
    - Set the public_url in the config to match how you access this server (e.g.
      via a Cloudflare tunnel or Caddy proxy) so Nostr clients get correct media
      URLs.
    - The default logo is a placeholder — upload the Route96 SVG icon to
      originless.besoeasy.com and update this field with the resulting IPFS CID.
services:
  server:
    image: voidic/route96:latest
    restart: unless-stopped
    ports:
      - "8000"
    volumes:
      - route96-data:/app/data
    environment:
      RUST_LOG: info
    configs:
      - source: route96-config
        target: /app/config.yaml
    depends_on:
      - db
    labels:
      yantr.app: route96
      yantr.service.8000: Media Server
      yantr.port.8000: HTTP
  db:
    image: mariadb:latest
    restart: unless-stopped
    volumes:
      - route96-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: route96rootpass
      MYSQL_USER: route96
      MYSQL_PASSWORD: route96pass
      MYSQL_DATABASE: route96
    labels:
      yantr.app: route96
      yantr.service.8000: Media Server
      yantr.port.8000: HTTP

volumes:
  route96-data: null
  route96-db: null

configs:
  route96-config:
    content: |
      listen: "0.0.0.0:8000"
      database: "mysql://route96:route96pass@db:3306/route96"
      storage_dir: "./data"
      max_upload_bytes: 104857600
      public_url: "http://localhost:8000"
