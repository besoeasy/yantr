x-yantr:
  name: "docker-surgeon"
  tags: [podman, health, monitoring, self-hosted]
  short_description: "Automatic restart for unhealthy Docker containers."
  description: >
    Docker Surgeon continuously monitors the health of your running
    containers and automatically restarts failing or unhealthy services,
    keeping your critical homelab applications resilient and self-healing.
  usecases: ["Auto-restart unhealthy containers.", "Monitor container health status."]
  website: "https://github.com/kRYstall9/docker-surgeon"

services:
  docker-surgeon:
    image: ghcr.io/krystall9/docker-surgeon:latest
    labels:
      yantr.app: "docker-surgeon"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - docker_surgeon_data:/data
    restart: unless-stopped

volumes:
  docker_surgeon_data:
