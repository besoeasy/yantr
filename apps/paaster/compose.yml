x-yantr:
  name: "paaster"
  tags: [pastebin, encryption, security, self-hosted, podman]
  short_description: "Secure encrypted pastebin with client-side encryption."
  description: >
    Paaster is a zero-knowledge, self-hosted pastebin that encrypts all text
    client-side before submission. Share code snippets and confidential
    notes securely, knowing that not even the server host can read your
    data.
  usecases: ["Share sensitive code snippets securely.", "Store private notes with E2E encryption."]
  website: "https://github.com/WardPearce/Paaster"

services:
  paaster:
    image: ghcr.io/wardpearce/paaster:latest
    labels:
      yantr.app: "paaster"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - paaster_data:/data
    restart: unless-stopped

volumes:
  paaster_data:
