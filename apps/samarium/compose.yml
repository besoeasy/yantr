x-yantr:
  name: "samarium"
  tags: [erp, pos, business, management, self-hosted, docker]
  short_description: "Business management platform with ERP and POS features."
  description: >
    Samarium is a comprehensive business management system that includes ERP,
    POS, and inventory management for small to medium businesses.
  usecases: ["Manage business operations with ERP.", "Process sales with POS system."]
  website: "https://github.com/shyamsitaula/samarium"

services:
  samarium:
    image: ghcr.io/shyamsitaula/samarium:latest
    container_name: samarium
    labels:
      yantr.app: "samarium"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - samarium_data:/data
    restart: unless-stopped

volumes:
  samarium_data:
