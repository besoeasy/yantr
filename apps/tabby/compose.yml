x-yantr:
  name: Tabby
  tags: [ productivity, browsing, dashboard, utility, homepage ]
  short_description: Customizable start page with tabs, bookmarks, weather, and quick links.
  description: Tabby is a beautiful, customizable start page for your browser that
    combines a new tab experience with useful utilities. Features include a tabs
    interface for organizing your links into categories, weather widget, quick
    search bar, clock with date, background customization, bookmark manage...
  usecases:
    [
      Set as your browser's new tab page for quick access to bookmarks.,
      "Organize bookmarks into tabs by category (Work, News, Social, etc.).",
      Quick search from the start page with custom search engines.,
      Display weather and time at a glance.
    ]
  website: https://github.com/parksauce/tabby
  notes:
    [
      Uses MariaDB for database storage,
      Customizable backgrounds and themes,
      Keyboard shortcuts for quick navigation
    ]

services:
  tabby:
    image: parksauce/tabby:latest
    container_name: tabby
    labels:
      yantr.app: tabby
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    depends_on:
      - tabby-db
    restart: unless-stopped
  tabby-db:
    image: linuxserver/mariadb:latest
    container_name: tabby_database
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tabby
      MYSQL_USER: tabby
      MYSQL_PASSWORD: tabby
    volumes:
      - tabby_db:/config
    restart: unless-stopped
    labels:
      yantr.app: tabby
      yantr.service.80: Web UI
      yantr.port.80: HTTP

volumes:
  tabby_db: null
