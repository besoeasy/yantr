x-yantr:
  name: "cloudmacs"
  tags: [editor, emacs, productivity, self-hosted, podman]
  short_description: "Access your full Emacs editor environment through a web browser."
  description: >
    CloudMacs brings your complete Emacs editing environment directly to the
    browser. Write code, manage Org-mode files, and run terminal commands
    remotely from any device without installing local software.
  usecases: ["Edit files with Emacs in browser.", "Remote Emacs workspace access."]
  website: "https://github.com/karlicoss/cloudmacs"

services:
  cloudmacs:
    image: ghcr.io/karlicoss/cloudmacs:latest
    labels:
      yantr.app: "cloudmacs"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - cloudmacs_data:/data
    restart: unless-stopped

volumes:
  cloudmacs_data:
