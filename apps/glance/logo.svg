<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Dashboard grid background -->
  <rect x="44" y="44" width="76" height="52" rx="6" fill="url(#grid)" opacity="0.3"/>
  <rect x="132" y="44" width="80" height="52" rx="6" fill="url(#grid)" opacity="0.25"/>
  <rect x="44" y="108" width="56" height="44" rx="6" fill="url(#grid)" opacity="0.2"/>
  <rect x="112" y="108" width="100" height="44" rx="6" fill="url(#grid)" opacity="0.2"/>
  <rect x="44" y="164" width="100" height="48" rx="6" fill="url(#grid)" opacity="0.15"/>
  <rect x="156" y="164" width="56" height="48" rx="6" fill="url(#grid)" opacity="0.18"/>
  <!-- Large eye (central overlay) -->
  <ellipse cx="128" cy="120" rx="52" ry="34" fill="none" stroke="url(#eye)" stroke-width="4"/>
  <!-- Iris -->
  <circle cx="128" cy="120" r="20" fill="url(#eye)"/>
  <!-- Pupil -->
  <circle cx="128" cy="120" r="10" fill="#1a1a2e"/>
  <!-- Eye glint -->
  <circle cx="134" cy="114" r="5" fill="#fff" opacity="0.8"/>
  <circle cx="122" cy="126" r="2" fill="#fff" opacity="0.4"/>
  <!-- Scan line effect -->
  <line x1="40" y1="120" x2="80" y2="120" stroke="#ff9800" stroke-width="1.5" opacity="0.3"/>
  <line x1="176" y1="120" x2="216" y2="120" stroke="#ff9800" stroke-width="1.5" opacity="0.3"/>
</svg>