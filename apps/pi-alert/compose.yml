x-yantr:
  name: Pi.Alert
  tags: [ network, monitoring, security, dashboard, utility ]
  short_description: Network scanner that detects devices, alerts on new
    connections, and tracks device history.
  description: >
    Pi.Alert scans your local network and records devices by MAC address, hostname,
    and vendor. Alert on new or unknown devices, review first-seen and last-seen
    history, and investigate changes over time. Webhook notifications make it useful
    for home labs, offices, and small businesses.
  usecases:
    [
      Monitor your home network for new device connections.,
      Get alerts when unknown devices connect to your WiFi.,
      Track device history - when devices joined and last seen.,
      Identify all devices on your network with vendor recognition.
    ]
  website: https://github.com/jokobsk/pi.alert
  notes:
    [
      Scans via ARP to discover all devices on network,
      Sends notifications via webhooks,
      Database of device history over time
    ]

services:
  pi-alert:
    image: docker.io/jokobsk/pi.alert:latest
    labels:
      yantr.app: pi-alert
      yantr.service.20211: Monitoring
      yantr.port.20211: UDP
    ports:
      - 20211/udp
    volumes:
      - pi_alert_config:/config
    restart: unless-stopped

volumes:
  pi_alert_config: null
