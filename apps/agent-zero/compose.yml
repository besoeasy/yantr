x-yantr:
  name: Agent Zero
  tags: [ ai, agent, llm, automation, self-hosted ]
  short_description: Self-hosted autonomous AI agent framework with a web interface.
  description: >
    Agent Zero is an open-source AI agent framework with a browser-based
    interface to define, run, and chain agents for tasks like research, coding,
    and file management — entirely on your own hardware, with no data sent to
    third-party cloud services.
  usecases:
    [
      "Run autonomous AI agents locally to perform multi-step tasks such as
        web research, code generation, or file operations without relying on
        cloud providers.",
      "Build and chain custom agent workflows that combine multiple tools and
        LLM calls to automate repetitive or complex tasks.",
      "Experiment with different LLM backends (OpenAI, Ollama, etc.) by
        pointing Agent Zero at your preferred model endpoint."
    ]
  website: https://github.com/agent0ai/agent-zero
  notes:
    [
      "Set ALLOWED_ORIGINS to a comma-separated list of allowed origins to
        restrict access. Defaults to * (all origins).",
      "Agent Zero can execute code and shell commands inside its container —
        only expose it on a trusted network."
    ]

services:
  agent-zero:
    image: agent0ai/agent-zero:latest
    labels:
      yantr.app: agent-zero
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    restart: unless-stopped
    ports:
      - "80"
    volumes:
      - a0_usr:/a0/usr
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

volumes:
  a0_usr: null
