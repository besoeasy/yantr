x-yantr:
  name: Seerr
  tags:
    - media
    - requests
    - jellyfin
    - sonarr
    - radarr
  short_description: Media request manager for Jellyfin, Emby, and Plex.
  description: Seerr is the official successor to Overseerr and Jellyseerr. It
    lets users browse and request movies and TV shows, which are automatically
    routed to Radarr and Sonarr for download. Supports Jellyfin, Emby, and Plex
    as media backends.
  usecases:
    - Let users request movies and TV shows without exposing Radarr or Sonarr
      directly.
    - Automatically route approved requests to Radarr or Sonarr for download.
    - Discover trending content via built-in TMDB browsing.
  website: https://docs.seerr.dev
  logo: QmfUMSBFU2WKRyvG9kQa4fzRU8Apr7rC3N8HkYSL7gY5XX
  notes:
    - Seerr is the unified successor to both Overseerr and Jellyseerr — existing
      installs auto-migrate on first run.
    - Requires at least one media backend (Jellyfin, Emby, or Plex) and Radarr
      or Sonarr to handle requests.
    - Seerr does not download media itself.

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    labels:
      yantr.app: seerr
      yantr.service.5055: Web UI
      yantr.port.5055: HTTP
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5055"
    volumes:
      - seerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

volumes:
  seerr_config: null
