x-yantr:
  name: Kimai
  tags: [ time-tracking, productivity, workflow, self-hosted, homelab ]
  short_description: Open-source multi-user time tracking, billing, and reporting
    platform for freelancers and teams.
  description: Kimai is a multi-user time-tracking system with invoicing features,
    expense tracking, role-based permissions, and reporting for freelancers and
    small teams. It supports project-based entries, export to CSV/PDF, and
    optional LDAP/OAuth authentication in self-hosted deployments.
  usecases: [ Track time and projects., Generate invoices and reports for clients. ]
  website: https://www.kimai.org/documentation/installation/docker/
  notes: [ Set strong secrets and use external database volume backups. ]

services:
  kimai-db:
    image: mysql:8.0
    restart: unless-stopped
    labels:
      yantr.app: kimai
      yantr.service.8001: Web UI
      yantr.port.8001: HTTP
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: changeme
    volumes:
      - kimai_db:/var/lib/mysql
  kimai:
    image: kimai/kimai2:latest
    restart: unless-stopped
    labels:
      yantr.app: kimai
      yantr.service.8001: Web UI
      yantr.port.8001: HTTP
    ports:
      - "8001"
    environment:
      DATABASE_URL: mysql://kimai:changeme@kimai-db:3306/kimai
      TRUSTED_PROXIES: 127.0.0.1
      ADMINMAIL: admin@example.com
      ADMINPASS: changeMe
    volumes:
      - kimai_data:/opt/kimai/var
    depends_on:
      - kimai-db

volumes:
  kimai_db: null
  kimai_data: null
