x-yantr:
  name: Gotify
  tags:
    - notification
    - tools
    - notifications
    - utility
    - self-hosted
  short_description: Self-hosted push notification server for sending alerts from
    your scripts and apps.
  description: Gotify is a self-hosted push notification server for sending
    real-time alerts via REST and WebSocket. It supports multiple users/apps,
    message priorities, file attachments, and a web UI—useful for monitoring
    alerts, automation scripts, and system notifications.
  usecases:
    - Receive alerts from Uptime Kuma when services go down.
    - Send notifications from your automation scripts (n8n, Home Assistant).
    - Get notified when Docker containers stop or crash.
    - Use as a simple messaging system for family or team.
  website: https://github.com/gotify/server
  logo: QmfUMSBFU2WKRyvG9kQa4fzRU8Apr7rC3N8HkYSL7gY5XX
  notes:
    - Simple REST API for sending messages
    - WebSocket for real-time delivery
    - Supports multiple apps with different tokens
services:
  gotify:
    image: ghcr.io/gotify/server
    container_name: gotify
    labels:
      yantr.app: gotify
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME:-admin}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS:-admin}
    volumes:
      - gotify_data:/app/data
    restart: unless-stopped

volumes:
  gotify_data: null
