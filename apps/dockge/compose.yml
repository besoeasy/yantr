services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    labels:
      yantr.app: dockge
      yantr.service.5001: Web UI
      yantr.port.5001: HTTP
    ports:
      - "5001"
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      - dockge_stacks:/opt/stacks
    restart: unless-stopped
volumes:
  dockge_data: null
  dockge_stacks: null
x-yantr:
  name: Dockge
  tags:
    - docker
    - management
    - containers
    - devops
    - self-hosted
  short_description: Elegant Docker Compose management UI for creating and
    managing stacks interactively.
  description: Dockge is a Docker Compose-focused management UI offering a visual
    editor with syntax highlighting, one-click stack deployment, and service
    controls (start/stop/restart, logs, shell). It simplifies managing
    compose-based projects with a clean, user-friendly interface.
  usecases:
    - Create and edit docker-compose.yml files with a visual editor.
    - Manage your compose stacks - start, stop, restart services.
    - View logs and access containers directly from the UI.
    - Organize multiple compose projects in one place.
  website: https://github.com/louislam/dockge
  logo: QmXUGnzPpcRuGks5CJB6we1cFcBW2qPau9FZUs98wPGFJL
  notes:
    - Requires Docker socket access
    - Stores compose files in configurable directory
    - Stack traces from failed deployments shown clearly
