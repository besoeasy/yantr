x-yantr:
  name: Jellyfin
  tags: [ media, entertainment, streaming, video, music ]
  short_description: Free and open-source media server for streaming movies, TV
    shows, music, and photos to any device.
  description: Jellyfin is a free, open-source media server for streaming and
    organizing movies, TV, music, and photos. It supports automatic metadata,
    subtitles, live TV/DVR, hardware transcoding, user management, and broad
    client support—fully local with no premium tiers or telemetry.
  usecases:
    [
      Create a personal Netflix-like streaming service for your movie and TV
        show collection accessible from any device in your home.,
      "Stream your music library with album artwork and artist information to
        phones, computers, or smart speakers.",
      Set up live TV recording with DVR functionality using HDHomeRun tuners
        to record broadcast TV.,
      Share media with family members through user accounts with parental
        controls and access restrictions.
    ]
  website: https://jellyfin.org/
  logo: QmcsxWwZb9CZYsG5EvAEVwqjEw2FeX3KroZD5rvo87XWMZ
  notes:
    [
      "Hardware transcoding requires appropriate GPU drivers (Intel Quick
        Sync, NVIDIA, or VA-API)",
      Media folders must be mounted with read access for the container,
      No account required - runs completely locally with no telemetry
    ]

services:
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    volumes:
      - jellyfin-config:/config
      - jellyfin-media:/data
    ports:
      - "8096"
    restart: unless-stopped
    labels:
      yantr.app: jellyfin
      yantr.service.8096: Web UI
      yantr.port.8096: HTTP

volumes:
  jellyfin-config:
    name: jellyfin-config
  jellyfin-media:
    name: jellyfin-media
