x-yantr:
  name: Whoami
  tags: [tools, utility, self-hosted, homelab, podman]
  short_description: Simple HTTP service that displays request details - ideal for
    testing proxies and ingress.
  description: >
    Whoami is a tiny Traefik HTTP service that returns request and host
    information as text or JSON. Use it to verify reverse proxies, load balancers,
    ingress controllers, headers, client IPs, and network paths. Deploy it behind
    the service you are testing, then confirm what each layer forwards.
  usecases:
    [
      Test reverse proxy configurations.,
      Verify what headers are being forwarded.,
      Check your public IP as seen by the server.,
      Debug Docker networking and port forwarding.
    ]
  website: https://github.com/traefik/whoami
  notes:
    [
      Tiny image - only displays request info,
      Useful for testing but not much else,
      No configuration needed - just works
    ]

services:
  whoami:
    image: docker.io/traefik/whoami
    ports:
      - "80"
    restart: unless-stopped
    labels:
      yantr.port.80: HTTP
      yantr.app: whoami
      yantr.service.80: Web UI
