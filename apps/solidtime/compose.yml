x-yantr:
  name: Solidtime
  tags: [ productivity, time-tracking, self-hosted, homelab, docker ]
  short_description: Time tracking with projects, clients, invoicing, and PDF invoice generation.
  description: Solidtime is a time tracking application built with Laravel and
    React. It includes project and client management, time entries, detailed
    reports, team support, and invoice generation with PDF export. Perfect for
    freelancers tracking billable hours or teams managing time across projects.
  usecases:
    [
      Track time on projects.,
      Generate invoices for clients.,
      Team time management.
    ]
  website: https://www.solidtime.io/
  notes:
    [
      Uses PostgreSQL database,
      Invoice generation included,
      Gotenberg for PDF generation
    ]

services:
  solidtime:
    image: solidtime/solidtime:0.11.5
    labels:
      yantr.app: solidtime
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
    ports:
      - "8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:your-app-key-will-be-generated
      CONTAINER_MODE: http
      DB_CONNECTION: pgsql
      DB_HOST: solidtime-db
      DB_PORT: 5432
      DB_DATABASE: solidtime
      DB_USERNAME: solidtime
      DB_PASSWORD: solidtime
      QUEUE_CONNECTION: database
      APP_URL: http://localhost:8000
      GOTENBERG_URL: http://solidtime-gotenberg:3000
    volumes:
      - solidtime_data:/var/www/html/storage
    depends_on:
      - solidtime-db
      - solidtime-gotenberg
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/up
      interval: 30s
      timeout: 10s
      retries: 3
  solidtime-scheduler:
    image: solidtime/solidtime:0.11.5
    environment:
      APP_ENV: production
      CONTAINER_MODE: scheduler
      DB_CONNECTION: pgsql
      DB_HOST: solidtime-db
      DB_PORT: 5432
      DB_DATABASE: solidtime
      DB_USERNAME: solidtime
      DB_PASSWORD: solidtime
    volumes:
      - solidtime_data:/var/www/html/storage
    depends_on:
      - solidtime-db
    restart: unless-stopped
    labels:
      yantr.app: solidtime
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  solidtime-queue:
    image: solidtime/solidtime:0.11.5
    environment:
      APP_ENV: production
      CONTAINER_MODE: worker
      DB_CONNECTION: pgsql
      DB_HOST: solidtime-db
      DB_PORT: 5432
      DB_DATABASE: solidtime
      DB_USERNAME: solidtime
      DB_PASSWORD: solidtime
      QUEUE_CONNECTION: database
    volumes:
      - solidtime_data:/var/www/html/storage
    depends_on:
      - solidtime-db
    restart: unless-stopped
    labels:
      yantr.app: solidtime
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  solidtime-db:
    image: postgres:17.3
    environment:
      POSTGRES_USER: solidtime
      POSTGRES_PASSWORD: solidtime
      POSTGRES_DB: solidtime
    volumes:
      - solidtime_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U solidtime
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      yantr.app: solidtime
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  solidtime-gotenberg:
    image: gotenberg/gotenberg:8.14.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      yantr.app: solidtime
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP

volumes:
  solidtime_data: null
  solidtime_db: null
