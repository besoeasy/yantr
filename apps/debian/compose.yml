x-yantr:
  name: "debian"
  tags: [linux, debian, stable, podman, self-hosted]
  short_description: "Stable Debian Linux container for general-purpose workloads."
  description: >
    A stable and reliable Debian Linux container suitable for general-purpose
    workloads, development environments, and server applications. Debian's
    extensive package repository provides access to thousands of software packages.
  usecases: ["Host general-purpose server applications.", "Set up a stable development environment."]
  website: "https://www.debian.org/"

  ports:
    - {port: 80, protocol: HTTP, show: true, label: "HTTP server", service: debian}
    - {port: 443, protocol: HTTPS, show: true, label: "HTTPS server", service: debian}
    - {port: 3000, protocol: HTTP, show: true, label: "Dev server", service: debian}
    - {port: 8080, protocol: HTTP, show: true, label: "Web server", service: debian}
    - {port: 9000, protocol: HTTP, show: true, label: "Alt server", service: debian}

services:
  debian:
    image: docker.io/debian:latest
    environment: {}
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    ports:
      - "8080"
      - "80"
      - "443"
      - "3000"
      - "9000"
    volumes:
      - debian_data:/data
    restart: unless-stopped

volumes:
  debian_data:
