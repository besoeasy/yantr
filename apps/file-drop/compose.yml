x-yantr:
  name: "File Drop"
  tags: [files, sharing, uploads, self-hosted, tools]
  short_description: "Ephemeral file sharing with drag-drop uploads and QR codes."
  description: >
    File Drop shares files fast with drag-and-drop uploads, QR codes, and
    auto-expiry for quick transfers without accounts. Great for homelabs and
    teams. Single container with a data volume for uploads and metadata.
  usecases: ["Share files quickly with drag-and-drop uploads.", "Generate QR codes for easy mobile downloads.", "Host ephemeral transfers with auto-expiry."]
  website: "https://github.com/besoeasy/file-drop"
  notes: ["Uploads persist in a named volume.", "Expose via a tunnel to share links publicly."]
  ports:
    - {port: 3232, protocol: HTTP, show: true, label: "Web UI", service: file-drop}

services:
  file-drop:
    image: ghcr.io/besoeasy/file-drop:latest
    environment:
      NODE_ENV: production
    ports:
      - "3232"
    volumes:
      - file_drop_data:/data
    restart: unless-stopped

volumes:
  file_drop_data:
