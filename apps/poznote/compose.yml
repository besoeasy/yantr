x-yantr:
  name: "poznote"
  tags: [notes, productivity, writing, self-hosted, docker]
  short_description: "Self-hosted note-taking platform for capturing and organizing ideas."
  description: >
    A self-hosted note-taking platform with a focus on simplicity and complete
    privacy. Write, organize, and search through your notes without worrying
    about third-party services ever gaining access to your personal thoughts.
  usecases: ["Capture and organize notes daily.", "Search through personal knowledge base."]
  website: "https://github.com/timothepoznanski/poznote"

services:
  poznote:
    image: ghcr.io/timothepoznanski/poznote:latest
    container_name: poznote
    labels:
      yantr.app: "poznote"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - poznote_data:/data
    restart: unless-stopped

volumes:
  poznote_data:
