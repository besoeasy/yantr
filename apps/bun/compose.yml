x-yantr:
  name: "bun"
  tags: [javascript, bun, runtime, podman, self-hosted]
  short_description: "Bun JavaScript runtime for fast modern web development."
  description: >
    A Bun container providing a fast JavaScript runtime, bundler, transpiler,
    and package manager in a single tool. Bun's speed and built-in tooling
    make it ideal for modern web development and high-performance applications.
  usecases: ["Build high-performance JavaScript applications.", "Bundle and transpile modern web projects."]
  website: "https://bun.sh/"

  ports:
    - {port: 3000, protocol: HTTP, show: true, label: "Frontend dev server", service: bun}
    - {port: 4000, protocol: HTTP, show: true, label: "Alt web server", service: bun}
    - {port: 5173, protocol: HTTP, show: true, label: "Vite dev server", service: bun}
    - {port: 8080, protocol: HTTP, show: true, label: "Alt dev server", service: bun}
    - {port: 9229, protocol: TCP, label: "Bun debugger", service: bun}

services:
  bun:
    image: docker.io/oven/bun:latest
    environment: {}
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    ports:
      - "3000"
      - "5173"
      - "8080"
      - "9229"
      - "4000"
    volumes:
      - bun_data:/data
    restart: unless-stopped

volumes:
  bun_data:
