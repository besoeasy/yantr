services:
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart
    ports:
      - "8080"
      - "25"
      - "587"
      - "465"
      - "143"
      - "993"
      - "110"
      - "995"
      - "4190"
    environment:
      STALWART_RECOVERY_ADMIN: admin:${ADMIN_PASSWORD}
    volumes:
      - stalwart_data:/opt/stalwart-mail
    restart: unless-stopped
    labels:
      yantr.app: stalwart
      yantr.service.8080: Web Admin
      yantr.port.8080: HTTP
      yantr.service.25: SMTP
      yantr.port.25: TCP
      yantr.service.587: SMTP Submission
      yantr.port.587: TCP
      yantr.service.465: SMTPS
      yantr.port.465: TCP
      yantr.service.143: IMAP
      yantr.port.143: TCP
      yantr.service.993: IMAPS
      yantr.port.993: TCP
      yantr.service.110: POP3
      yantr.port.110: TCP
      yantr.service.995: POP3S
      yantr.port.995: TCP
      yantr.service.4190: ManageSieve
      yantr.port.4190: TCP
volumes:
  stalwart_data: null
x-yantr:
  name: Stalwart
  tags:
    - email
    - mail
    - smtp
    - imap
    - self-hosted
  short_description: All-in-one mail and collaboration server with SMTP, IMAP, and CalDAV.
  description: Stalwart is a fast, secure, and scalable open-source mail server
    built in Rust. It supports the full email protocol stack — JMAP, IMAP4,
    POP3, and SMTP — plus CalDAV calendars, CardDAV contacts, and WebDAV file
    sharing. Features include AI-powered spam filtering, DNS blocklists,
    greylisting, buil...
  usecases:
    - Host your own email server with full SMTP, IMAP, and POP3 support.
    - Share calendars and contacts via CalDAV and CardDAV protocols.
    - Block spam and phishing with AI-powered filtering and DNS blocklists.
    - Manage multiple email domains and users from the web admin dashboard.
  website: https://stalw.art
  notes:
    - Port 25 (SMTP) may be blocked by your ISP or cloud provider — check before
      deploying.
    - Log in to the admin UI at port 8080 with username 'admin' and your
      generated ADMIN_PASSWORD.
    - Point MX, SPF, DKIM, and DMARC DNS records at your server IP for reliable
      email delivery.
    - CalDAV, CardDAV, and WebDAV are available alongside standard email
      protocols.
  env_generators:
    ADMIN_PASSWORD:
      length: 24
      charset: alnum
