x-yantr:
  name: Pastefy
  tags: [ tools, productivity, git, development, devops ]
  short_description: Beautiful, feature-rich pastebin with folders, encryption, and API support.
  description: Pastefy is a modern pastebin app for storing and sharing code
    snippets, notes, and text. It includes folder organization, syntax
    highlighting, public/private pastes, burn-after-reading, password
    protection, API access, import/export and a dark-mode interface. Good for
    team and personal sharing.
  usecases:
    [
      Share code snippets with syntax highlighting.,
      Create encrypted pastes with optional password protection.,
      Organize pastes into folders for personal knowledge management.,
      Use the API to create pastes from scripts or CI/CD pipelines.
    ]
  website: https://docs.pastefy.app
  notes:
    [
      Supports both guest and authenticated users,
      API available for automation,
      Syntax highlighting for 190+ languages
    ]

services:
  pastefy:
    image: interaapps/pastefy:latest
    labels:
      yantr.app: pastefy
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - pastefy_data:/app/data
    restart: unless-stopped

volumes:
  pastefy_data: null
