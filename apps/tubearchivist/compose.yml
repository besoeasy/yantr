services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    container_name: tubearchivist
    ports:
      - "8000"
    volumes:
      - tubearchivist_media:/youtube
      - tubearchivist_cache:/cache
    environment:
      ES_URL: http://tubearchivist-es:9200
      REDIS_HOST: tubearchivist-redis
      HOST_UID: 1000
      HOST_GID: 1000
      TA_HOST: ${TA_HOST:-http://localhost:8000}
      TA_USERNAME: ${TA_USERNAME:-tubearchivist}
      TA_PASSWORD: ${TA_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: ${TZ:-UTC}
    depends_on:
      - tubearchivist-es
      - tubearchivist-redis
    restart: unless-stopped
    labels:
      yantr.app: "tubearchivist"
      yantr.service: "Web UI"

  tubearchivist-redis:
    image: redis/redis-stack-server:latest
    container_name: tubearchivist-redis
    volumes:
      - tubearchivist_redis:/data
    restart: unless-stopped
    labels:
      yantr.app: "tubearchivist"
      yantr.service: "Cache"

  tubearchivist-es:
    image: bbilly1/tubearchivist-es:latest
    container_name: tubearchivist-es
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - tubearchivist_es:/usr/share/elasticsearch/data
    restart: unless-stopped
    labels:
      yantr.app: "tubearchivist"
      yantr.service: "Search Index"

volumes:
  tubearchivist_media:
  tubearchivist_cache:
  tubearchivist_redis:
  tubearchivist_es:
