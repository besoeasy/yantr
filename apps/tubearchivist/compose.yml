x-yantr:
  name: TubeArchivist
  tags:
    - media
    - youtube
    - archive
    - self-hosted
    - video
  short_description: Self-hosted YouTube archive — subscribe, download, search,
    and stream your channels.
  description: TubeArchivist is a self-hosted YouTube media server with a
    full-featured web UI. Subscribe to channels, queue downloads, and browse
    your archive by channel, playlist, or full-text transcript search — powered
    by Elasticsearch. Stream videos directly from your server, track watch
    progress, and neve...
  usecases:
    - Archive entire YouTube channels locally before they disappear or get
      deleted.
    - Search video transcripts full-text across your entire downloaded library.
    - Stream archived videos from your home server to any device.
    - Track subscriptions and queue downloads automatically on a schedule.
  website: https://tubearchivist.com
  notes:
    - Requires at least 2 GB RAM (4 GB recommended) due to the Elasticsearch
      service.
    - Set TA_HOST to your server's URL so the app generates correct links.
    - First indexing of large channels may take several minutes to complete.
    - TA_PASSWORD is the login password for the TubeArchivist web UI admin
      account.
  env_generators:
    TA_PASSWORD:
      length: 24
      charset: alnum
    ELASTIC_PASSWORD:
      length: 24
      charset: alnum
services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    container_name: tubearchivist
    ports:
      - "8000"
    volumes:
      - tubearchivist_media:/youtube
      - tubearchivist_cache:/cache
    environment:
      ES_URL: http://tubearchivist-es:9200
      REDIS_HOST: tubearchivist-redis
      HOST_UID: 1000
      HOST_GID: 1000
      TA_HOST: ${TA_HOST:-http://localhost:8000}
      TA_USERNAME: ${TA_USERNAME:-tubearchivist}
      TA_PASSWORD: ${TA_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      TZ: ${TZ:-UTC}
    depends_on:
      - tubearchivist-es
      - tubearchivist-redis
    restart: unless-stopped
    labels:
      yantr.app: tubearchivist
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  tubearchivist-redis:
    image: redis/redis-stack-server:latest
    container_name: tubearchivist-redis
    volumes:
      - tubearchivist_redis:/data
    restart: unless-stopped
    labels:
      yantr.app: tubearchivist
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
  tubearchivist-es:
    image: bbilly1/tubearchivist-es:latest
    container_name: tubearchivist-es
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - tubearchivist_es:/usr/share/elasticsearch/data
    restart: unless-stopped
    labels:
      yantr.app: tubearchivist
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP

volumes:
  tubearchivist_media: null
  tubearchivist_cache: null
  tubearchivist_redis: null
  tubearchivist_es: null
