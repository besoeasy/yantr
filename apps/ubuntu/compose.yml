x-yantr:
  name: "ubuntu"
  tags: [linux, ubuntu, podman, self-hosted, dev]
  short_description: "Ubuntu LTS Linux container for versatile workloads."
  description: >
    An Ubuntu LTS Linux container providing a versatile and widely-supported
    platform for development, deployment, and experimentation. Ubuntu's large
    community and up-to-date packages make it a popular choice for many use cases.
  usecases: ["Deploy applications on a popular Linux platform.", "Build and test software in a familiar environment."]
  website: "https://ubuntu.com/"

services:
  ubuntu:
    image: docker.io/ubuntu:latest
    labels:
      yantr.app: "ubuntu"
      yantr.service.8080: "Web server"
      yantr.port.8080: "HTTP"
      yantr.service.80: "HTTP server"
      yantr.port.80: "HTTP"
      yantr.service.443: "HTTPS server"
      yantr.port.443: "HTTPS"
      yantr.service.3000: "Dev server"
      yantr.port.3000: "HTTP"
      yantr.service.9000: "Alt server"
      yantr.port.9000: "HTTP"
    environment: {}
    command: ["/bin/sh", "-c", "while :; do sleep 3600; done"]
    ports:
      - "8080"
      - "80"
      - "443"
      - "3000"
      - "9000"
    volumes:
      - ubuntu_data:/data
    restart: unless-stopped

volumes:
  ubuntu_data:
