x-yantr:
  name: Samba
  tags: [ network, file-sharing, storage, smb, self-hosted ]
  short_description: SMB/CIFS file sharing for Windows, Mac, and Linux to access
    storage on your network.
  description: >
    Samba provides SMB/CIFS file sharing for Windows, macOS, and Linux clients.
    This image publishes a central folder with user credentials and persistent
    storage, accessible from File Explorer, Finder, or Linux file managers. Use it
    for documents, media, and shared storage consumed by Plex or Jellyfin.
  usecases:
    [
      Share folders with all computers on your network.,
      "Access server storage from Windows, Mac, or Linux.",
      Create a central file repository for home or office.,
      Share media files for Plex/Jellyfin to scan.
    ]
  website: https://github.com/dockur/samba
  notes:
    [
      SMB port 445 - no need for older NetBIOS,
      Configure username and password via environment variables,
      Mount folders as volumes for persistent storage
    ]

services:
  samba:
    image: docker.io/dockurr/samba:latest
    environment:
      NAME: ${SAMBA_NAME:-Data}
      USER: ${SAMBA_USER:-admin}
      PASS: ${SAMBA_PASS:-admin}
    ports:
      - "445"
    volumes:
      - samba-storage:/storage
    restart: unless-stopped
    labels:
      yantr.app: samba
      yantr.service.445: File Sharing
      yantr.port.445: TCP

volumes:
  samba-storage:
    name: samba-storage
