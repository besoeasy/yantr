x-yantr:
  name: Ghostfolio
  tags: [ productivity, utility, finance, crypto, portfolio ]
  short_description: Modern wealth management platform for tracking stocks, ETFs,
    cryptocurrencies, and assets.
  description: Ghostfolio is an open-source wealth management app for tracking
    stocks, ETFs, crypto, and custom assets. It provides real-time prices,
    allocation charts, performance vs benchmarks, net worth history, exportable
    data, and a responsive UI for private portfolio analysis.
  usecases:
    [
      "Track your complete investment portfolio across stocks, ETFs, and
        crypto.",
      Monitor net worth over time with historical charts.,
      Analyze asset allocation and diversification.,
      Make data-driven investment decisions with portfolio analysis tools.
    ]
  website: https://ghostfol.io
  notes:
    [
      Supports real-time price updates from public APIs,
      Redis used for caching price data,
      Data stored in SQLite database
    ]

services:
  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    labels:
      yantr.app: ghostfolio
      yantr.service.3333: Web UI
      yantr.port.3333: HTTP
    ports:
      - "3333"
    volumes:
      - ghostfolio_data:/data
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/ghostfolio.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:alpine
    container_name: ghostfolio-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    labels:
      yantr.app: ghostfolio
      yantr.service.3333: Web UI
      yantr.port.3333: HTTP

volumes:
  ghostfolio_data: null
  redis_data: null
