services:
  db:
    image: postgres:16-alpine
    container_name: outline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: outline
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - outline_pgdata:/var/lib/postgresql/data
    labels:
      yantr.app: outline
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  redis:
    image: redis:7-alpine
    container_name: outline-redis
    restart: unless-stopped
    volumes:
      - outline_redis:/data
    labels:
      yantr.app: outline
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  web:
    image: outlinewiki/outline:latest
    container_name: outline-web
    restart: unless-stopped
    depends_on:
      - db
      - redis
    labels:
      yantr.app: outline
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    ports:
      - "3000"
    environment:
      TZ: ${TZ:-UTC}
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      DATABASE_URL: postgres://outline:${POSTGRES_PASSWORD}@outline-db:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      PORT: 3000
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: 262144000
    volumes:
      - outline_data:/var/lib/outline/data
volumes:
  outline_pgdata: null
  outline_redis: null
  outline_data: null
x-yantr:
  name: Outline
  tags:
    - wiki
    - knowledge-base
    - documentation
    - collaboration
    - self-hosted
  short_description: Fast, collaborative wiki and knowledge base for teams.
  description: Outline is a fast, collaborative, beautiful knowledge base for
    teams. Write documentation in a rich Markdown editor, organize with nested
    documents and collections, control access with teams and permissions, and
    search across everything instantly.
  usecases:
    - Build a team wiki with nested documents and rich formatting.
    - Document internal processes and share knowledge across teams.
    - Search and discover knowledge across your entire organization.
  website: https://www.getoutline.com
  notes:
    - Outline requires an authentication provider (OIDC, Slack, Google) to be
      configured via environment variables after deployment.
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum
    SECRET_KEY:
      length: 64
      charset: hex
    UTILS_SECRET:
      length: 64
      charset: hex
