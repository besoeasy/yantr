x-yantr:
  name: OpenObserve
  tags: [monitoring, observability, logs, self-hosted, analytics]
  short_description: >
    Cloud-native observability platform for logs, metrics, and traces —
    lightweight alternative to Elasticsearch and Datadog.
  description: >
    OpenObserve is a cloud-native observability platform that ingests and
    indexes logs, metrics, and traces with a petabyte-scale storage engine.
    It offers a built-in dashboard builder, SQL-like query language, and
    support for OpenTelemetry, Prometheus, and FluentBit inputs. Uses a
    fraction of the resources compared to Elasticsearch while providing a
    rich query experience and visualization layer.
  usecases:
    [
      "Centralize logs from Docker containers, applications, and system
        services with a lightweight alternative to Elasticsearch.",
      "Build dashboards and alerts for metrics and traces using a SQL-like
        query language with built-in visualization.",
    ]
  website: https://openobserve.ai

services:
  openobserve:
    image: greenblut/openobserve:latest
    labels:
      yantr.app: openobserve
      yantr.service.5080: Web UI
      yantr.port.5080: HTTP
    ports:
      - "5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve_data:/data
    restart: unless-stopped

volumes:
  openobserve_data:
