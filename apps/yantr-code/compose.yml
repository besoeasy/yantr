x-yantr:
  name: "Yantr Code"
  tags: [development, ai, terminal, productivity]
  short_description: "Agentic coding in the browser: OpenCode plus the OpenChamber web UI."
  description: >
    An agentic coding environment in the browser. OpenCode CLI and the
    OpenChamber web UI are installed from npm into a persistent volume on first
    boot, so agents, terminals and dev servers work from any device. Projects
    keep their own volume, and the host Podman socket lets the agent run
    containers.
  usecases: ["Run AI coding agents from a browser on any device.", "Keep projects in a persistent workspace volume across restarts.", "Let the agent start containers through the host Podman socket.", "Open whatever port a dev server picks, with no mapping to declare."]
  website: "https://github.com/besoeasy/yantr"
  notes: ["Set the UI password in the deploy form; it is required and not generated.", "First start installs both packages from npm into the home volume, so it needs outbound network and takes a minute.", "OpenChamber is supervised: when it exits it is started again eight minutes later, and a fresh deploy starts it immediately.", "Projects live in /home/yantr/workspaces, and a starter ~/.config/opencode/AGENTS.md is written once on first start — edit it freely, it is never overwritten.", "Host networking is on and the UI port is fixed at 18420, so every port the agent binds is reachable at http://<server-ip>:<port>. Free 18420 first if something already listens there.", "The Podman socket mount gives the agent container control as this server's user; drop that volume line to revoke it."]
  ports:
    - {port: 18420, protocol: HTTP, show: true, label: "Web UI", service: yantr-code}

services:
  yantr-code:
    image: docker.io/library/node:lts
    # Host networking: a coding agent starts servers on ports of its own
    # choosing, and there is no mapping to declare for them. The UI port is
    # therefore a host port, chosen high to stay clear of 3000/8080 and of the
    # range Podman hands out for the other apps' published ports.
    network_mode: host
    environment:
      HOME: /home/yantr
      NPM_CONFIG_PREFIX: /home/yantr/.npm-global
      OPENCHAMBER_HOST: 0.0.0.0
      OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD}
      # git log in the web terminal has no pager installed, and a pager that
      # exists would block the terminal it was opened from.
      GIT_PAGER: cat
    command:
      - sh
      - -c
      - |
        set -u
        export HOME=/home/yantr
        export NPM_CONFIG_PREFIX="$$HOME/.npm-global"
        export PATH="$$NPM_CONFIG_PREFIX/bin:$$PATH"
        export OPENCHAMBER_HOST=0.0.0.0
        # Fixed, not a deploy-form field: the catalog entry and the notes both
        # name 18420, so a value the form could change would make them lie.
        PORT=18420
        mkdir -p "$$NPM_CONFIG_PREFIX" "$$HOME/workspaces" "$$HOME/.config" \
          "$$HOME/.local/share/opencode" "$$HOME/.ssh"
        # The agent's global rules, written once: an edit made inside the
        # container is the user's, so a restart never overwrites it.
        if [ ! -f "$$HOME/.config/opencode/AGENTS.md" ]; then
          mkdir -p "$$HOME/.config/opencode"
          cat > "$$HOME/.config/opencode/AGENTS.md" <<'AGENTS_MD'
        # Global instructions

        ## Development
        1. You are running inside a Podman container, not on the user's host machine.
           The workspace is `/home/yantr/workspaces`, a volume that survives restarts;
           nothing outside this container is reachable unless it is mounted here.
        2. Install the tools and software you need: `apt-get install`, `npm -g`,
           `pip`, a runtime. This container is disposable and nothing you install
           touches the host, so install without asking.
        3. Run every dev server on `0.0.0.0`, never `127.0.0.1` or `localhost`, and
           name the port it listens on. The user opens it from another machine on the
           LAN, where a server bound to loopback looks broken.
        AGENTS_MD
        fi
        PACKAGES="@opencode/cli@2.4.2 @openchamber/web@2.8.1"
        # Seconds between a failure and the next attempt, for both the npm
        # install and OpenChamber itself. Long enough that a port clash or a
        # provider outage is not hammered, short enough that a restart is not
        # something the user has to work around.
        RETRY=480
        CHILD=""
        STOP=0
        # `sh` is PID 1 here, so it must forward the stop signal itself or
        # `podman stop` waits out its grace period and SIGKILLs the agent
        # mid-write. The sleeps are run in the background for the same reason:
        # a foreground sleep cannot be interrupted by the trap.
        shutdown() {
          STOP=1
          if [ -n "$$CHILD" ]; then kill -TERM "$$CHILD" 2>/dev/null; fi
        }
        trap shutdown TERM INT
        cd "$$HOME/workspaces" || exit 1
        while [ "$$STOP" = 0 ]; do
          if [ "$$(cat "$$HOME/.yantr-code-packages" 2>/dev/null)" != "$$PACKAGES" ] \
             || ! command -v openchamber >/dev/null 2>&1; then
            # npm blocks lifecycle scripts unless they are allowed by name, and
            # node-pty needs its prebuild download or the terminal cannot open.
            if npm install -g --no-audit --no-fund \
                 --allow-scripts=@opencode/cli,@parcel/watcher,node-pty $$PACKAGES; then
              printf '%s\n' "$$PACKAGES" > "$$HOME/.yantr-code-packages"
            else
              echo "[yantr-code] npm install failed; retrying in $$((RETRY / 60)) min" >&2
              sleep "$$RETRY" & wait $$! 2>/dev/null
              continue
            fi
          fi
          openchamber serve --foreground --port "$$PORT" &
          CHILD=$$!
          wait "$$CHILD" 2>/dev/null
          CHILD=""
          [ "$$STOP" = 1 ] && break
          echo "[yantr-code] openchamber exited; restarting in $$((RETRY / 60)) min" >&2
          sleep "$$RETRY" & wait $$! 2>/dev/null
        done
        # A stop during a wait would otherwise leave the script's status at the
        # wait's 143, and the stack would read as a crash rather than a stop.
        exit 0
    volumes:
      - yantr_code_home:/home/yantr
      - yantr_code_workspaces:/home/yantr/workspaces
      - ${HOST_PODMAN_SOCKET}:/var/run/docker.sock
    restart: unless-stopped

volumes:
  yantr_code_home:
  yantr_code_workspaces:
