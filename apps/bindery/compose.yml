x-yantr:
  name: "bindery"
  tags: [usenet, books, downloading, self-hosted, podman]
  short_description: "Automated Usenet-based book and ebook download manager."
  description: >
    A self-hosted book acquisition manager that searches and downloads
    ebooks and audiobooks from Usenet indexers. Features automated search,
    queue management, and library organization for book collectors.
  usecases: ["Download books from Usenet automatically.", "Build an automated book acquisition pipeline."]
  website: "https://github.com/vavallee/bindery"

services:
  bindery:
    image: ghcr.io/vavallee/bindery:latest
    labels:
      yantr.app: "bindery"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - bindery_data:/data
    restart: unless-stopped

volumes:
  bindery_data:
