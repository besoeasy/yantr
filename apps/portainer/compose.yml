x-yantr:
  name: Portainer
  tags: [tools, utility, podman, containers, devops]
  short_description: Manage Podman containers, images, volumes, networks, and stacks through a web UI.
  description: >
    Portainer is a web UI for containers, images, volumes, networks, and Compose
    stacks. Start, stop, inspect, and deploy workloads with logs, stats, and
    stack templates. It connects to rootless Podman through a Docker-compatible
    API; rootless support is limited, so protect access carefully.
  usecases:
    [
      Manage Podman containers through a visual interface instead of the
        command line.,
      View real-time logs and statistics for running containers to
        troubleshoot issues.,
      Deploy multi-container applications using Compose stacks.,
      "Manage container images - pull, tag, and push to registries."
    ]
  website: https://docs.portainer.io
  notes:
    [
      "Requires container socket access (auto-mounted via ${HOST_PODMAN_SOCKET} — Portainer talks to Podman through its Docker-compatible API)",
      "Portainer officially supports rootful Podman; rootless works but is not officially supported by Portainer",
      First access requires setting up an admin user,
      Can manage multiple Docker environments from a single Portainer instance
    ]

services:
  portainer:
    image: docker.io/portainer/portainer-ce:latest
    labels:
      yantr.app: portainer
      yantr.service.9443: Web UI
      yantr.port.9443: HTTPS
    ports:
      - "9443"
    volumes:
      - "${HOST_PODMAN_SOCKET}:/var/run/docker.sock"
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data: null
