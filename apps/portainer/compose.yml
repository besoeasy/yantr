x-yantr:
  name: Portainer
  tags:
    - tools
    - utility
    - docker
    - containers
    - devops
  short_description: Powerful Docker management UI for containers, images,
    volumes, networks, and stacks.
  description: Portainer is a powerful, lightweight Docker management UI that
    simplifies container management through an intuitive web interface. It
    allows you to manage Docker containers, images, volumes, networks, and
    stacks without needing to use the command line. Features include container
    lifecycle...
  usecases:
    - Manage Docker containers through a visual interface instead of the command
      line.
    - View real-time logs and statistics for running containers to troubleshoot
      issues.
    - Deploy multi-container applications using Docker Compose stacks.
    - Manage Docker images - pull, build, tag, and push to registries.
  website: https://docs.portainer.io
  logo: QmXyDE7nzzoUS8dez7bWBgeP2X2xkJ6XesJ7QSWUsvdV5F
  notes:
    - Requires access to Docker socket (/var/run/docker.sock)
    - First access requires setting up an admin user
    - Can manage multiple Docker environments from a single Portainer instance

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    labels:
      yantr.app: portainer
      yantr.service.9443: Web UI
      yantr.port.9443: HTTPS
    ports:
      - "9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data: null
