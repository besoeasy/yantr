x-yantr:
  name: ZeroClaw
  tags: [ ai, tools, utility, self-hosted, homelab ]
  short_description: AI assistant gateway with pluggable LLM providers and secure local execution.
  description: ZeroClaw is an autonomous AI assistant runtime written in Rust. It
    provides a gateway for connecting to various LLM providers with support for
    multiple AI backends. Features pluggable providers (OpenAI, local LLMs,
    etc.), secure local execution, tool calling, memory management, and API
    for...
  usecases:
    [
      Build AI agents with tool access.,
      Connect to various LLM providers.,
      Private AI assistant gateway.
    ]
  website: https://github.com/zeroclaw-labs/zeroclaw
  logo: Qmex7mP7CtY1uo7a2erXmuNrvQdY6aw5FTQtxpJjAbiu8v
  notes:
    [
      Multiple LLM provider support,
      Tool calling capability,
      Rust-based runtime,
      Requires API_KEY environment variable
    ]

services:
  zeroclaw:
    image: ghcr.io/zeroclaw-labs/zeroclaw:latest
    container_name: zeroclaw
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      API_KEY: ${API_KEY:-}
      PROVIDER: ${PROVIDER:-openrouter}
      ZEROCLAW_ALLOW_PUBLIC_BIND: "true"
      ZEROCLAW_GATEWAY_PORT: ${ZEROCLAW_GATEWAY_PORT:-42617}
    ports:
      - 42617/tcp
    volumes:
      - zeroclaw_data:/data
    labels:
      yantr.app: zeroclaw
      yantr.service.42617: Gateway API
      yantr.port.42617: HTTP
    healthcheck:
      test:
        - CMD
        - zeroclaw
        - status
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  zeroclaw_data: null
