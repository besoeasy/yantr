x-yantr:
  name: MinIO
  tags: [ utility, tools, storage, files, self-hosted ]
  short_description: High-performance S3-compatible object storage for building
    scalable storage solutions.
  description: MinIO is a high-performance, S3-compatible object storage server
    for private cloud, backups, and datasets. It supports distributed erasure
    coding, IAM, replication, versioning, encryption, and an administrative
    console—compatible with S3 clients and Kubernetes deployments.
  usecases:
    [
      Build a private cloud storage solution compatible with S3 applications.,
      "Store backups, archives, or media files with scalable object storage.",
      Use as the backend for Nextcloud's external storage.,
      Run AI/ML workloads that need S3-compatible storage for datasets.
    ]
  website: https://min.io
  notes:
    [
      "Console runs on port 9001, API on port 9000",
      Default credentials are minioadmin/minioadmin - change in production,
      Distributed mode available for multi-node deployments
    ]

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${WEBPASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    labels:
      yantr.app: minio
      yantr.service.9001: Console
      yantr.port.9001: HTTP
      yantr.service.9000: API
      yantr.port.9000: HTTP

volumes:
  minio_data: null
