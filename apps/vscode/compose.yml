x-yantr:
  name: VS Code
  tags: [ development, terminal, ide, self-hosted, homelab ]
  short_description: Web-based VS Code IDE accessible via browser for remote
    development and server management.
  description: A self-hosted VS Code IDE powered by code-server. Full VS Code
    experience in the browser with syntax highlighting, debugging, Git, and
    extensions. Ideal for remote development and server management from any
    device.
  usecases:
    [
      Develop and debug applications remotely using a full-featured IDE
        accessible through any modern web browser.,
      Manage servers and configure systems via a secure web-based terminal
        (use sudo with the install password to become root inside the
        container).,
      Collaborate with team members by sharing access to your development
        environment without requiring local IDE installations.,
      "Work consistently across devices with synchronized settings,
        extensions, and workspace configurations."
    ]
  website: https://github.com/coder/code-server
  notes:
    [
      The password for the web UI is auto-generated on install (strong random
        value).,
      "The same password is used for `sudo` inside the integrated terminal (so
        you can run apt, install packages, etc.).",
      Data persistence is handled through a named Docker volume to preserve
        settings and installed extensions.,
      Access the interface at https://your-domain:8443 or
        http://your-server-ip:8443 in your browser.
    ]
  env_generators:
    PASSWORD:
      length: 16
      charset: alnum_symbols
      regex: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{12,}$

services:
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: vscode
    environment:
      PASSWORD: ${PASSWORD}
      SUDO_PASSWORD: ${PASSWORD}
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    ports:
      - "8443"
    volumes:
      - vscode-data:/config
    restart: unless-stopped
    labels:
      yantr.app: vscode
      yantr.service.8443: Web UI
      yantr.port.8443: HTTP

volumes:
  vscode-data:
    name: vscode-data
