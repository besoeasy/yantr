x-yantr:
  name: Vaultwarden
  tags: [ productivity, security, password-manager, privacy, self-hosted ]
  short_description: Lightweight, open-source Bitwarden-compatible password
    manager server written in Rust.
  description: >
    Vaultwarden is a lightweight Rust server implementing the Bitwarden API for
    browser, desktop, and mobile clients. Store passwords, notes, cards, and TOTP
    codes on infrastructure you control, with client-side encryption keeping the
    server from learning your master password. Deploy behind HTTPS.
  usecases:
    [
      "Store and manage all your passwords in a self-hosted vault that only
        you control, with full Bitwarden client compatibility.",
      Generate TOTP two-factor authentication codes directly within
        Vaultwarden for added security.,
      Securely share passwords or notes with family members using the Send
        feature with expiration and deletion options.,
      Access your passwords from any device using official Bitwarden apps
        while keeping your data on your own server.
    ]
  website: https://github.com/dani-garcia/vaultwarden/wiki
  notes:
    [
      Requires HTTPS for browser extensions to work properly,
      All data is encrypted client-side - server never sees your master
        password,
      WebSocket support enabled for real-time notifications
    ]

services:
  vaultwarden:
    image: docker.io/vaultwarden/server:latest
    labels:
      yantr.app: vaultwarden
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - vaultwarden_data:/data
    environment:
      WEBSOCKET_ENABLED: "true"
    restart: unless-stopped

volumes:
  vaultwarden_data: null
