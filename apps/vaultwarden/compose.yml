x-yantr:
  name: Vaultwarden
  tags:
    - productivity
    - security
    - password-manager
    - privacy
    - self-hosted
  short_description: Lightweight, open-source Bitwarden-compatible password
    manager server written in Rust.
  description: Vaultwarden (formerly Bitwarden_RS) is a lightweight, open-source
    server implementation of the Bitwarden password management API, written in
    Rust. It's fully compatible with official Bitwarden clients including
    browser extensions, desktop apps, and mobile apps. All passwords are
    encrypted...
  usecases:
    - Store and manage all your passwords in a self-hosted vault that only you
      control, with full Bitwarden client compatibility.
    - Generate TOTP two-factor authentication codes directly within Vaultwarden
      for added security.
    - Securely share passwords or notes with family members using the Send
      feature with expiration and deletion options.
    - Access your passwords from any device using official Bitwarden apps while
      keeping your data on your own server.
  website: https://github.com/dani-garcia/vaultwarden/wiki
  logo: QmUPKRipoMCZT3VCYVCoxe3z5WpDhfpb7v4HH1dDKedQaQ
  notes:
    - Requires HTTPS for browser extensions to work properly
    - All data is encrypted client-side - server never sees your master password
    - WebSocket support enabled for real-time notifications

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      yantr.app: vaultwarden
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - vaultwarden_data:/data
    environment:
      WEBSOCKET_ENABLED: "true"
    restart: unless-stopped

volumes:
  vaultwarden_data: null
