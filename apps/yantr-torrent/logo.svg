<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="128" y1="60" x2="128" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="56" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" stroke="url(#accent-grad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Glowing Background Circle -->
  <circle cx="128" cy="128" r="70" fill="url(#accent-grad)" opacity="0.15"/>

  <!-- Storage Tray -->
  <rect x="64" y="152" width="128" height="36" rx="10" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="4"/>
  <line x1="96" y1="170" x2="160" y2="170" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <!-- Torrent Download Arrow -->
  <path d="M128 60 V132" stroke="url(#arrow-grad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M96 104 L128 136 L160 104" stroke="url(#arrow-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="68" cy="88" r="6" fill="#06B6D4"/>
  <line x1="74" y1="92" x2="94" y2="102" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <circle cx="188" cy="88" r="6" fill="#3B82F6"/>
  <line x1="182" y1="92" x2="162" y2="102" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>
</svg>
