x-yantr:
  name: yantr-torrent
  tags: [torrent, download, p2p, webdav, storage]
  short_description: "All-in-one torrent downloader with Flood UI, WebDAV access, and auto-cleanup."
  description: >
    A lightweight self-hosted torrent download server featuring Transmission with the modern
    Flood web interface and Dufs WebDAV file manager. Easily stream, download, and manage your torrents
    via a sleek UI and access files over WebDAV with automatic 30-day cleanup and 1-hour seeding limits.
  usecases: ["Download torrents via Flood's modern React web interface.", "Access and stream downloaded files via WebDAV.", "Automatically delete downloads older than 30 days."]
  website: "https://github.com/besoeasy/yantr"
  customapp: true
  notes: ["Flood UI is accessible on port 3000.", "WebDAV file browser is accessible on port 5000.", "Seeding is limited to 60 minutes of idle time by default (configurable via SEED_IDLE_MINUTES)."]

services:
  downloader:
    build:
      context: .
      dockerfile_inline: |
        FROM docker.io/alpine:latest
        RUN apk add --no-cache transmission-daemon nodejs npm coreutils dufs dcron findutils curl && npm install -g flood && npm cache clean --force
        RUN cat > /entrypoint.sh <<'ENTRYPOINT_EOF'
        #!/bin/sh

        set -e

        SEED_IDLE_MINUTES="$${SEED_IDLE_MINUTES:-60}"
        SEED_CLEANUP_DAYS="$${SEED_CLEANUP_DAYS:-30}"

        mkdir -p /config /downloads /config/flood

        # Configure crontab for daily auto-cleanup of downloads older than SEED_CLEANUP_DAYS
        cat >/etc/crontabs/root <<EOF
        0 3 * * * find /downloads -type f -mtime +$${SEED_CLEANUP_DAYS} -delete 2>/dev/null
        5 3 * * * find /downloads -type d -empty -delete 2>/dev/null
        EOF

        # Start cron daemon
        crond -b -l 2

        # Pre-seed Transmission settings if missing
        if [ ! -f /config/settings.json ]; then
          cat >/config/settings.json <<EOF
        {
          "download-dir": "/downloads",
          "incomplete-dir": "/downloads/incomplete",
          "incomplete-dir-enabled": false,
          "rpc-authentication-required": false,
          "rpc-bind-address": "0.0.0.0",
          "rpc-enabled": true,
          "rpc-port": 9091,
          "rpc-whitelist-enabled": false,
          "peer-port": 51413,
          "idle-seeding-limit": $${SEED_IDLE_MINUTES},
          "idle-seeding-limit-enabled": true
        }
        EOF
        fi

        # Start Transmission daemon in background
        transmission-daemon -g /config -f &
        TR_PID=$$!

        # Give daemon time to initialize
        sleep 2

        # Start Flood Web UI in background pointing to Transmission RPC
        flood \
          --host 0.0.0.0 \
          --port 3000 \
          --rundir /config/flood \
          --auth none \
          --trurl http://127.0.0.1:9091/transmission/rpc \
          --truser "" \
          --trpass "" &
        FLOOD_PID=$$!

        # Start Dufs WebDAV file browser in background
        dufs \
          /downloads \
          --bind 0.0.0.0 \
          --port 5000 \
          --allow-upload \
          --allow-delete \
          --allow-search \
          --allow-archive &
        DUFS_PID=$$!

        # Trap signals for graceful shutdown
        trap 'kill -TERM $$TR_PID $$FLOOD_PID $$DUFS_PID 2>/dev/null' INT TERM

        # Wait for background services
        wait
        ENTRYPOINT_EOF
        RUN chmod +x /entrypoint.sh
        EXPOSE 3000 5000 51413 51413/udp
        VOLUME ["/config", "/downloads"]
        ENTRYPOINT ["/entrypoint.sh"]
    environment:
      SEED_IDLE_MINUTES: ${SEED_IDLE_MINUTES:-60}
      SEED_CLEANUP_DAYS: ${SEED_CLEANUP_DAYS:-30}
    labels:
      yantr.app: "yantr-torrent"
      yantr.service.3000: "Flood Web UI"
      yantr.port.3000: "HTTP"
      yantr.service.5000: "WebDAV File Browser"
      yantr.port.5000: "HTTP"
      yantr.service.51413: "Transmission Peer Port"
      yantr.port.51413: "TCP"
    ports:
      - "3000"
      - "5000"
      - "51413"
      - "51413/udp"
    volumes:
      - yantr_torrent_config:/config
      - yantr_torrent_downloads:/downloads
    restart: unless-stopped

volumes:
  yantr_torrent_config:
  yantr_torrent_downloads:
