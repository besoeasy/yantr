x-yantr:
  name: yantr-downloader
  tags: [torrent, download, p2p, webdav, files]
  short_description: "Torrent downloader with WebDAV and auto-cleanup."

services:
  downloader:
    build: .
    container_name: yantr-downloader
    volumes:
      - config:/config
      - downloads:/downloads
    ports:
      - "8112:8112"      # Deluge Web UI
      - "58846:58846"    # Deluge daemon
      - "58946:58946"    # Deluge incoming
      - "58946:58946/udp"
      - "5000:5000"      # Dufs/WebDAV
    restart: unless-stopped

volumes:
  config:
  downloads:
