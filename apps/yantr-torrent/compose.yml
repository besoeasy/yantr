x-yantr:
  name: "Yantr Torrent"
  tags: [download, torrent, p2p, self-hosted, files]
  short_description: "Transmission torrent box with a Dufs web file browser for downloads."
  description: >
    Yantr Torrent is a lightweight Transmission BitTorrent box with a web
    interface and a Dufs file server for browsing downloads. The shared downloads
    volume is exposed through Dufs behind the same login as Transmission, making
    it easy to grab or stream completed torrents from browsers and TVs.
  usecases:
    [
      "Run a self-managed torrent client with web access on your Yantr server.",
      "Browse, download, and stream completed torrents from a TV or browser over Dufs.",
      "Use one login for both Transmission and the downloads file browser."
    ]
  website: "https://github.com/besoeasy/yantr"
  notes:
    [
      "Transmission Web UI is on port 9091; set the user and password in the deploy form.",
      "Dufs serves the downloads volume on port 5000 using the same TRANSMISSION_USER and TRANSMISSION_PASS credentials.",
      "The generated password uses alphanumeric characters to keep Dufs auth compatible."
    ]
  env_generators:
    TRANSMISSION_USER:
      length: 8
      charset: alpha
    TRANSMISSION_PASS:
      length: 20
      charset: alnum

  ports:
    - {port: 9091, protocol: HTTP, show: true, label: "Transmission UI", service: transmission}
    - {port: 5000, protocol: HTTP, show: true, label: "Downloads", service: dufs}
    - {port: 51413, protocol: TCP, label: "Peer Port", service: transmission}
    - {port: 51413, protocol: UDP, label: "Peer Port", service: transmission}

services:
  transmission:
    image: docker.io/linuxserver/transmission:latest
    environment:
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    volumes:
      - yantr_torrent_config:/config
      - yantr_torrent_downloads:/downloads
    ports:
      - "9091"
      - "51413"
      - 51413/udp
    restart: unless-stopped
  dufs:
    image: docker.io/sigoden/dufs:latest
    command: ["/downloads"]
    environment:
      DUFS_ALLOW_ALL: "true"
      DUFS_AUTH: ${TRANSMISSION_USER}:${TRANSMISSION_PASS}@/:rw
    volumes:
      - yantr_torrent_downloads:/downloads
    ports:
      - "5000"
    restart: unless-stopped

volumes:
  yantr_torrent_config:
  yantr_torrent_downloads:
