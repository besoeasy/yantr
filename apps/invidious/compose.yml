services:
  invidious:
    image: ceramicwhite/invidious:latest
    container_name: invidious
    ports:
      - "3000"
    user: 1000:1000
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: ${DB_PASSWORD}
          host: invidious-postgres
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: ${COMPANION_SECRET}
        hmac_key: ${HMAC_KEY}
        default_user_preferences:
          feed_menu: ["Trending", "Subscriptions", "Playlists"]
          default_home: Trending
    depends_on:
      - invidious-postgres
    restart: unless-stopped
    labels:
      yantr.app: invidious
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  invidious-postgres:
    image: postgres:13-alpine
    container_name: invidious-postgres
    user: 1000:1000
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - invidious_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: invidious
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    user: 1000:1000
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - invidious_companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET}
    restart: unless-stopped
    labels:
      yantr.app: invidious
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
volumes:
  invidious_db: null
  invidious_companioncache: null
x-yantr:
  name: Invidious
  tags:
    - media
    - video
    - youtube
    - privacy
    - streaming
  short_description: Ad-free, privacy-respecting alternative frontend for YouTube.
  description: Invidious is an open-source, lightweight alternative front-end to
    YouTube. It allows you to search, watch, and subscribe to YouTube videos and
    channels completely ad-free and without Google tracking you. You can create
    playlists, manage subscriptions, and listen to audio in the background
    without...
  usecases:
    - Watch YouTube videos without advertisements or algorithmic tracking.
    - Subscribe to YouTube channels via RSS without needing a Google account.
    - Listen to video audio in the background on mobile devices.
    - Bypass region locks and age restrictions natively through the proxy.
  website: https://invidious.io
  notes:
    - Includes the Invidious Companion service to improve stream stability and
      reduce blocking.
  env_generators:
    DB_PASSWORD:
      length: 32
      charset: alnum
    COMPANION_SECRET:
      length: 64
      charset: hex
    HMAC_KEY:
      length: 64
      charset: hex
