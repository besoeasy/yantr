x-yantr:
  name: Frigate
  tags: [ nvr, cameras, security, ai, object-detection ]
  short_description: AI-powered NVR with real-time object detection for IP cameras.
  description: Frigate is a self-hosted NVR built around real-time AI object
    detection. It uses your CPU or GPU to detect people, vehicles, and animals
    in camera streams, storing recordings and sending alerts only when relevant
    events occur — keeping storage lean and notifications meaningful.
  usecases:
    [
      Monitor IP cameras with AI-based person and vehicle detection.,
      Record only relevant events to save disk space.,
      Integrate camera events with Home Assistant for smart automations.
    ]
  website: https://frigate.video
  notes:
    [
      A config.yml file is required in the frigate_config volume before first
        startup.,
      "For hardware acceleration, pass your GPU device (e.g.,
        /dev/dri/renderD128) via compose."
    ]

services:
  web:
    image: ghcr.io/blakeblackshear/frigate:latest
    container_name: frigate
    labels:
      yantr.app: frigate
      yantr.service.8971: Web UI
      yantr.port.8971: HTTP
      yantr.service.5000: API
      yantr.port.5000: HTTP
      yantr.service.8554: RTSP Restream
      yantr.port.8554: TCP
    privileged: true
    shm_size: 128mb
    environment:
    ports:
      - "8971"
      - "5000"
      - "8554"
    volumes:
      - frigate_config:/config
      - frigate_media:/media/frigate
    restart: unless-stopped

volumes:
  frigate_config: null
  frigate_media: null
