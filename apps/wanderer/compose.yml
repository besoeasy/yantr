x-yantr:
  name: "wanderer"
  tags: [hiking, trails, outdoor, self-hosted, podman]
  short_description: "Track and manage hiking trails and outdoor activities."
  description: >
    A self-hosted trail logging platform for outdoor enthusiasts. Record GPS
    tracks, visualize hiking routes on interactive topographical maps,
    upload photos, and keep a personal database of your wilderness
    adventures.
  usecases: ["Record hiking GPS tracks.", "Discover new trails nearby.", "Plan and share routes."]
  website: "https://github.com/koenvh/wanderer"

services:
  wanderer:
    image: ghcr.io/koenvh/wanderer:latest
    labels:
      yantr.app: "wanderer"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - wanderer_data:/data
    restart: unless-stopped

volumes:
  wanderer_data:
