x-yantr:
  name: Maybe
  tags: [ finance, productivity, accounting, self-hosted, homelab ]
  short_description: Open-source personal finance OS for managing accounts,
    investments, and transactions.
  description: Open-source personal finance OS for managing accounts, investments,
    and transactions. Maybe is a self-hosted application focused on finance,
    productivity, accounting, self-hosted. It can be deployed on any device via
    Docker Compose.
  usecases:
    [
      "Self-host Maybe on your home server to open-source personal finance os
        for managing accounts, investments, and transactions without depending
        on third-party cloud services.",
      "Use Maybe to manage your finance workflows privately, keeping all data
        under your control on local infrastructure."
    ]
  website: https://github.com/maybe-finance/maybe
  logo: QmcZLRLn3cHum9YMRhHv3355rVDgVVgQkioRm29x8YRX9q

services:
  maybe:
    image: ghcr.io/maybe-finance/maybe:0.6.0
    container_name: maybe
    labels:
      yantr.app: maybe
      yantr.service.3063: Web UI
      yantr.port.3063: HTTP
    ports:
      - "3063"
    volumes:
      - maybe_storage:/rails/storage
    environment:
      SELF_HOSTING_ENABLED: "true"
      PORT: 3063
      DATABASE_URL: postgresql://maybe:maybe@maybe-db:5432/maybe
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      POSTGRES_DB: maybe
      POSTGRES_USER: maybe
      POSTGRES_PASSWORD: maybe
      GOOD_JOB_EXECUTION_MODE: async
      REDIS_URL: redis://maybe-redis:6379/1
    depends_on:
      maybe-db:
        condition: service_healthy
      maybe-redis:
        condition: service_healthy
    restart: unless-stopped
  maybe-worker:
    image: ghcr.io/maybe-finance/maybe:0.6.0
    container_name: maybe-worker
    command: bundle exec sidekiq
    environment:
      SELF_HOSTING_ENABLED: "true"
      PORT: 3063
      DATABASE_URL: postgresql://maybe:maybe@maybe-db:5432/maybe
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      POSTGRES_DB: maybe
      POSTGRES_USER: maybe
      POSTGRES_PASSWORD: maybe
      GOOD_JOB_EXECUTION_MODE: async
      REDIS_URL: redis://maybe-redis:6379/1
    depends_on:
      maybe-redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      yantr.app: maybe
      yantr.service.3063: Web UI
      yantr.port.3063: HTTP
  maybe-db:
    image: postgres:16
    container_name: maybe-db
    volumes:
      - maybe_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: maybe
      POSTGRES_USER: maybe
      POSTGRES_PASSWORD: maybe
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U maybe
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      yantr.app: maybe
      yantr.service.3063: Web UI
      yantr.port.3063: HTTP
  maybe-redis:
    image: redis:7.4.2
    container_name: maybe-redis
    user: 1000:1000
    volumes:
      - maybe_redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      yantr.app: maybe
      yantr.service.3063: Web UI
      yantr.port.3063: HTTP

volumes:
  maybe_storage: null
  maybe_db: null
  maybe_redis: null
