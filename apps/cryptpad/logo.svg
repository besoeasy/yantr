<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e43f5a"/>
      <stop offset="100%" stop-color="#9b2335"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4068"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Notepad / pad -->
  <rect x="72" y="68" width="112" height="120" rx="10" fill="url(#pad)" stroke="#e43f5a" stroke-width="2.5" opacity="0.9"/>
  <!-- Pad lines -->
  <rect x="88" y="88" width="64" height="5" rx="2" fill="#e43f5a" opacity="0.3"/>
  <rect x="88" y="100" width="52" height="5" rx="2" fill="#e43f5a" opacity="0.25"/>
  <rect x="88" y="112" width="58" height="5" rx="2" fill="#e43f5a" opacity="0.2"/>
  <rect x="88" y="124" width="44" height="5" rx="2" fill="#e43f5a" opacity="0.2"/>
  <!-- Lock overlay (center) -->
  <rect x="104" y="136" width="48" height="36" rx="6" fill="url(#lock)"/>
  <!-- Lock shackle -->
  <path d="M116 136 v-12 c0-8 6-14 12-14 s12 6 12 12 v12" fill="none" stroke="#e43f5a" stroke-width="5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="128" cy="152" r="5" fill="#1a1a2e"/>
  <rect x="126" y="152" width="4" height="8" rx="1" fill="#1a1a2e"/>
  <!-- Encrypted sparkle dots -->
  <circle cx="60" cy="60" r="3" fill="#e43f5a" opacity="0.4"/>
  <circle cx="196" cy="60" r="2" fill="#e43f5a" opacity="0.3"/>
  <circle cx="60" cy="196" r="2" fill="#e43f5a" opacity="0.3"/>
  <circle cx="196" cy="196" r="3" fill="#e43f5a" opacity="0.4"/>
  <circle cx="128" cy="48" r="2" fill="#e43f5a" opacity="0.5"/>
</svg>