x-yantr:
  name: GUPT
  tags: [ messaging, nostr, privacy, e2e-encrypted, self-hosted ]
  short_description: Browser-based Nostr messenger with encrypted chat and WebRTC calls.
  description: >
    GUPT is a browser-based, serverless messenger and privacy suite that uses
    Nostr relays for encrypted chat, groups, passwords, notes, bookmarks, and
    file sharing. Self-hosting this container hosts the web client; durable
    messages still depend on the public or private Nostr relays you configure.
  usecases:
    [
      Chat anonymously with end-to-end encrypted direct messages without
        creating an account or providing personal information such as a phone
        number or email address.,
      "Host private group rooms for your team or community over your own Nostr
        relays, keeping all messages encrypted and off centralised servers.",
      Make encrypted WebRTC voice and video calls directly from the browser
        without installing any native app.
    ]
  website: https://gupt.app
  notes:
    [
      No backend required — the app connects directly to public or private
        Nostr relays.
    ]

services:
  gupt:
    image: ghcr.io/besoeasy/gupt:latest
    labels:
      yantr.app: gupt
      yantr.service.8000: Web UI
      yantr.port.8000: HTTP
    ports:
      - "8000"
    restart: unless-stopped
