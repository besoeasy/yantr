x-yantr:
  name: KitchenOwl
  tags: [ kitchen, recipes, shopping, meal-planning, self-hosted ]
  short_description: Smart self-hosted kitchen and grocery list manager.
  description: KitchenOwl is a smart self-hosted grocery list and recipe manager.
    Plan meals, track pantry items, generate shopping lists automatically, and
    share with household members for collaborative kitchen management.
  usecases:
    [
      Plan weekly meals and generate smart shopping lists.,
      Store and organize recipes with ingredient tracking.,
      Share grocery lists with family members in real time.
    ]
  website: https://kitchenowl.org
  env_generators:
    JWT_SECRET_KEY:
      length: 64
      charset: hex
    DB_PASSWORD:
      length: 24
      charset: alnum

services:
  web:
    image: tombursch/kitchenowl:latest
    container_name: kitchenowl-web
    labels:
      yantr.app: kitchenowl
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    environment:
      TZ: ${TZ:-UTC}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_DRIVER: postgresql
      DB_HOST: kitchenowl-db
      DB_NAME: kitchenowl
      DB_USER: kitchenowl
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080"
    volumes:
      - kitchenowl_files:/data
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:latest
    container_name: kitchenowl-db
    environment:
      POSTGRES_DB: kitchenowl
      POSTGRES_USER: kitchenowl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kitchenowl_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: kitchenowl
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP

volumes:
  kitchenowl_files: null
  kitchenowl_db: null
