x-yantr:
  name: "dnsweaver"
  tags: [dns, records, podman, networking, self-hosted]
  short_description: "Automatic DNS record management for Docker containers."
  description: >
    DNSWeaver automatically generates, synchronizes, and updates DNS records
    for your running containers and homelab services, ensuring seamless
    local name resolution and domain routing across your home network.
  usecases: ["Auto-manage DNS records for Docker.", "Simplify DNS configuration."]
  website: "https://github.com/maxfield-allison/dnsweaver"

services:
  dnsweaver:
    image: ghcr.io/maxfield-allison/dnsweaver:latest
    labels:
      yantr.app: "dnsweaver"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - dnsweaver_data:/data
    restart: unless-stopped

volumes:
  dnsweaver_data:
