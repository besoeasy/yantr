x-yantr:
  name: "foldergram"
  tags: [gallery, photos, media, self-hosted, docker]
  short_description: "Instagram-style photo and video gallery from folders."
  description: >
    A self-hosted photo and video gallery that works like Instagram. Point it
    at folders on your filesystem and browse your media in a beautiful grid.
  usecases: ["Browse family photos in a gallery view.", "Organize and view photo collections."]
  website: "https://github.com/foldergram/foldergram"

services:
  foldergram:
    image: ghcr.io/foldergram/foldergram:latest
    container_name: foldergram
    labels:
      yantr.app: "foldergram"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - foldergram_data:/data
    restart: unless-stopped

volumes:
  foldergram_data:
