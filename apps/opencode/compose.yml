x-yantr:
  name: OpenCode
  tags: [ development, productivity, ai, terminal, utility ]
  short_description: AI coding agent in browser - edit files, run commands, and get AI help.
  description: >
    OpenCode is a browser-based coding agent with an editor, terminal, Git, and
    AI assistance. Inspect projects, edit files, run commands, debug code, and
    get explanations from any device. The web server keeps the workspace in your
    browser, while providers receive prompts and tool data for each session.
  usecases:
    [
      Run coding-agent sessions from a browser.,
      Inspect project files and run terminal commands through the agent.,
      Attach a terminal session to an existing OpenCode web server.
    ]
  website: https://github.com/anomalyco/opencode
  env_generators:
    OPENCODE_PASSWORD: {length: 20, charset: alnum_symbols}
  notes: [ Sign in with username opencode and the generated OPENCODE_PASSWORD., Agent runs with full permissions; tighten via opencode.json when needed., Workspace persists in a named volume. ]

  ports:
    - {port: 4096, protocol: HTTP, show: true, label: "Web UI", service: opencode}

services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.4.1
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    environment:
      HOME: /home/opencode
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD}
      OPENCODE_CONFIG_CONTENT: '{"permissions":[{"action":"*","resource":"*","effect":"allow"}]}'
    ports:
      - "4096"
    stdin_open: true
    tty: true
    working_dir: /home/opencode
    volumes:
      - opencodehome:/home/opencode
    restart: unless-stopped

volumes:
  opencodehome: null
