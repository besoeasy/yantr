x-yantr:
  name: OpenCode
  tags: [ development, productivity, ai, terminal, utility ]
  short_description: AI coding assistant in browser - edit files, run commands, and get AI help.
  description: >
    OpenCode is a browser-based coding agent with an editor, terminal, Git, and
    AI assistance. Inspect projects, edit files, run commands, debug code, and
    get explanations from any device. The web server keeps the workspace in your
    browser, while providers receive prompts and tool data for each session.
  usecases:
    [
      Run coding-agent sessions from a browser.,
      Inspect project files and run terminal commands through the agent.,
      Attach a terminal session to an existing OpenCode web server.
    ]
  website: https://github.com/anomalyco/opencode
  notes: [ Browser-based IDE, AI assistant integration, Terminal access ]

services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command:
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    labels:
      yantr.app: opencode
      yantr.service.4096: Web UI
      yantr.port.4096: HTTP
    environment:
      HOME: /home/opencode
      OPENCODE_CONFIG_CONTENT: '{"permission":"allow"}'
    ports:
      - "4096"
    stdin_open: true
    tty: true
    volumes:
      - opencodehome:/home/opencode
    restart: unless-stopped

volumes:
  opencodehome: null
