x-yantr:
  name: WUD
  tags: [ tools, docker, containers, updates, monitoring ]
  short_description: Docker container update watcher that monitors and notifies
    about available image updates.
  description: WUD (What's Up Docker) watches your running Docker containers and
    notifies you when updated images are available. It supports multiple
    notification methods including webhooks, email, Slack, Discord, and
    Telegram. It can also auto-update containers using watchtower-style triggers
    or custom scripts.
  usecases:
    [
      Monitor all running containers and get notified when updated images are
        available.,
      "Receive notifications via Discord, Slack, Telegram, email, or webhooks
        when updates are detected.",
      Track update history and see which containers need attention at a glance.,
      Integrate with watchtower or custom scripts to trigger automatic
        container updates.
    ]
  website: https://github.com/getwud/wud
  notes:
    [
      Requires access to Docker socket (/var/run/docker.sock) to inspect
        running containers,
      "Supports multiple notification channels: Discord, Slack, Telegram,
        email, Gotify, and more",
      Web UI provides a dashboard showing all containers and their update
        status
    ]

services:
  wud:
    image: getwud/wud
    labels:
      yantr.app: wud
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    ports:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
