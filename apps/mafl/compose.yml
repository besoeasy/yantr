x-yantr:
  name: "mafl"
  tags: [homepage, dashboard, self-hosted, podman, startpage]
  short_description: "Minimalistic and customizable homepage for your services."
  description: >
    A lightweight, minimalistic dashboard and startpage for your homelab.
    Aggregate bookmarked links, status widgets, and container services into
    a clean, responsive layout configured easily via simple YAML files.
  usecases: ["Organize service links.", "Build a custom startpage.", "Display live widgets."]
  website: "https://github.com/hywax/mafl"

services:
  mafl:
    image: ghcr.io/hywax/mafl:latest
    labels:
      yantr.app: "mafl"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - mafl_data:/data
    restart: unless-stopped

volumes:
  mafl_data:
