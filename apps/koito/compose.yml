x-yantr:
  name: "koito"
  tags: [music, scrobbler, tracking, self-hosted, podman]
  short_description: "Modern scrobbler for tracking your music listening habits."
  description: >
    Koito is a self-hosted music scrobbler and listening history tracker.
    Keep a private, permanent record of what you listen to across streaming
    platforms, generate listening charts, and maintain full data privacy.
  usecases: ["Track music listening history.", "Scrobble from multiple music services."]
  website: "https://github.com/gabehf/koito"

services:
  koito:
    image: ghcr.io/gabehf/koito:latest
    labels:
      yantr.app: "koito"
      yantr.service.8080: "Web UI"
      yantr.port.8080: "HTTP"
    ports:
      - "8080"
    volumes:
      - koito_data:/data
    restart: unless-stopped

volumes:
  koito_data:
