x-yantr:
  name: NocoDB
  tags:
    - database
    - spreadsheet
    - no-code
    - productivity
    - self-hosted
  short_description: Open-source Airtable alternative — databases as spreadsheets.
  description: NocoDB is an open-source no-code platform that turns any database
    into a smart spreadsheet interface. Connect to PostgreSQL, MySQL, or SQLite
    and get instant REST APIs, gallery and kanban views, form builders, and team
    collaboration features.
  usecases:
    - Build no-code apps and forms on top of your existing databases.
    - Collaborate on structured data with a familiar spreadsheet interface.
    - Auto-generate REST APIs from any database table instantly.
  website: https://nocodb.com
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum

services:
  postgres:
    image: postgres:16-alpine
    container_name: nocodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nocodb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nocodb
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      yantr.app: nocodb
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
  app:
    image: nocodb/nocodb:latest
    container_name: nocodb-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      yantr.app: nocodb
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
    ports:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
      NC_DB: pg://nocodb-postgres:5432?u=nocodb&p=${POSTGRES_PASSWORD}&d=nocodb
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  nocodb_pgdata: null
  nocodb_data: null
