services:
  postgres:
    image: postgres:16-alpine
    container_name: nocodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nocodb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nocodb
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      yantr.app: nocodb
      yantr.service: postgres
  app:
    image: nocodb/nocodb:latest
    container_name: nocodb-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      yantr.app: nocodb
      yantr.service: Web UI
    ports:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
      NC_DB: pg://nocodb-postgres:5432?u=nocodb&p=${POSTGRES_PASSWORD}&d=nocodb
    volumes:
      - nocodb_data:/usr/app/data
volumes:
  nocodb_pgdata: null
  nocodb_data: null
