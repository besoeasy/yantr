x-yantr:
  name: Calibre-Web
  tags: [ ebooks, library, reading, books, self-hosted ]
  short_description: Browse, read, and download your eBook library online.
  description: Calibre-Web is a web app providing a clean interface for browsing,
    reading, and downloading eBooks using an existing Calibre database. It
    supports OPDS catalog feeds, Kobo sync, user management, and online reading
    via an integrated ebook viewer.
  usecases:
    [
      Host a personal eBook library accessible from any browser.,
      Sync your reading library to Kobo e-readers.,
      Share your book collection with friends and family.
    ]
  website: https://github.com/janeczku/calibre-web

services:
  server:
    image: linuxserver/calibre-web:latest
    container_name: calibre-web-server
    restart: unless-stopped
    labels:
      yantr.app: calibre-web
      yantr.service.8083: Web UI
      yantr.port.8083: HTTP
    ports:
      - "8083"
    environment:
    volumes:
      - calibre_web_config:/config
      - calibre_web_books:/books

volumes:
  calibre_web_config: null
  calibre_web_books: null
