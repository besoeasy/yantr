x-yantr:
  name: "calibreweb"
  tags: [ebooks, books, reading, self-hosted, library]
  short_description: "Self-hosted ebook library and reader powered by Calibre-Web."
  description: >
    Calibre-Web provides a browser interface for browsing, searching, reading, and
    downloading ebooks from a Calibre library. It supports metadata editing, format
    conversion, OPDS feeds, and user controls while keeping books in a persistent
    volume for personal library management.
  usecases: ["Browse and read ebooks in a browser.", "Search and edit Calibre library metadata.", "Convert or download books in multiple formats."]
  website: "https://github.com/janeczku/calibre-web"
  notes: ["Add books to the books volume through the volume browser.", "Complete the web setup wizard on first visit."]

services:
  calibre-web:
    image: docker.io/linuxserver/calibre-web:latest
    labels:
      yantr.app: "calibre-web"
      yantr.service.8083: "Web UI"
      yantr.port.8083: "HTTP"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "8083"
    volumes:
      - calibre_web_config:/config
      - calibre_web_books:/books
    restart: unless-stopped

volumes:
  calibre_web_config:
  calibre_web_books:
