x-yantr:
  name: Immich
  tags: [ photos, backup, gallery, ai, self-hosted ]
  short_description: Self-hosted photo and video backup with mobile apps, search, and shared albums.
  description: >
    Immich is a self-hosted photo and video backup with mobile apps, uploads,
    search, albums, and sharing. Facial recognition and object detection can run
    on your own infrastructure, providing a private alternative to cloud photo
    services. Back up the database and media volume before making changes.
  usecases:
    [
      Back up photos and videos automatically from mobile devices.,
      Search large libraries and organize shared albums.,
      Run face and object detection on your own infrastructure.
    ]
  website: https://immich.app/
  env_generators:
    DB_PASSWORD:
      length: 32
      charset: alnum

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - "2283"
    volumes:
      - immich_upload:/usr/src/app/upload
    depends_on:
      - redis
      - database
    restart: unless-stopped
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    volumes:
      - immich_model_cache:/cache
    restart: unless-stopped
  redis:
    image: docker.io/redis:6.2-alpine@sha256:e3b17ba9479deec4b7d1eeec1548a253acc5374d68d3b27937fcfe4df8d18c7e
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    restart: unless-stopped
  database:
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich_db:/var/lib/postgresql/data
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=vectors.so
      - -c
      - search_path="$$user", public, vectors
      - -c
      - logging_collector=on
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - wal_compression=on

volumes:
  immich_upload: null
  immich_model_cache: null
  immich_db: null
