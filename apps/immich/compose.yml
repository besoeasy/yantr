x-yantr:
  name: Immich
  tags:
    - photos
    - backup
    - gallery
    - ai
    - self-hosted
  short_description: High performance self-hosted photo and video backup solution
    with mobile app support.
  description: Immich is a very high performance, self-hosted photo and video
    backup solution directly from your mobile phone. It is meant to be a
    privacy-friendly alternative to Google Photos or Apple Photos with support
    for facial recognition, object detection, and shared albums.
  usecases:
    - Backup photos automatically from mobile devices.
    - Browse large photo libraries quickly.
    - Detect faces and objects in photos offline.
  website: https://immich.app/
  logo: QmAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  env_generators:
    DB_PASSWORD:
      length: 32
      charset: alnum

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - "2283"
    volumes:
      - immich_upload:/usr/src/app/upload
    depends_on:
      - redis
      - database
    restart: unless-stopped
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    volumes:
      - immich_model_cache:/cache
    restart: unless-stopped
  redis:
    image: docker.io/redis:6.2-alpine@sha256:e3b17ba9479deec4b7d1eeec1548a253acc5374d68d3b27937fcfe4df8d18c7e
    container_name: immich_redis
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    restart: unless-stopped
  database:
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    container_name: immich_postgres
    labels:
      yantr.app: immich
      yantr.service.2283: Web UI
      yantr.port.2283: HTTP
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - immich_db:/var/lib/postgresql/data
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=vectors.so
      - -c
      - search_path="$$user", public, vectors
      - -c
      - logging_collector=on
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - wal_compression=on

volumes:
  immich_upload: null
  immich_model_cache: null
  immich_db: null
