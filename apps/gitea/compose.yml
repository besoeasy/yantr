x-yantr:
  name: Gitea
  tags: [ git, devops, version-control, code-hosting, self-hosted ]
  short_description: Lightweight self-hosted Git service and code platform.
  description: Gitea is a painless self-hosted all-in-one software development
    service. It includes Git hosting, code review, team collaboration, package
    registry, CI/CD with Gitea Actions, and a built-in wiki — all in a
    lightweight, fast Go binary.
  usecases:
    [
      Host private Git repositories for personal or team projects.,
      Run CI/CD pipelines with built-in Gitea Actions.,
      "Manage code reviews, issues, and project wikis in one place."
    ]
  website: https://gitea.io
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum

services:
  db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gitea_pgdata:/var/lib/postgresql/data
    labels:
      yantr.app: gitea
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
      yantr.service.2222: SSH
      yantr.port.2222: TCP
  server:
    image: gitea/gitea:latest
    container_name: gitea-server
    restart: unless-stopped
    depends_on:
      - db
    labels:
      yantr.app: gitea
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
      yantr.service.2222: SSH
      yantr.port.2222: TCP
    ports:
      - "3000"
      - "2222"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "2222"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea

volumes:
  gitea_pgdata: null
  gitea_data: null
  gitea_config: null
