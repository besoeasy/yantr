x-yantr:
  name: KasmVNC
  tags: [ remote-desktop, browser, vnc, security, self-hosted ]
  short_description: Browser-accessible VNC server that streams your desktop
    session through an HTML5 web client.
  description: >
    KasmVNC is a modern web-native remote desktop solution that streams
    desktop sessions via HTML5 directly to your browser. Enjoy smooth video
    streaming, multi-user sharing, clipboard synchronization, and remote
    administration without installing any client software.
  usecases:
    [
      Provide browser-based remote access to a Linux desktop environment.,
      Run a disposable browsing environment accessible from any device.,
      Stream a graphical workspace to users without requiring VNC clients.
    ]
  website: https://kasmweb.com
  notes: [
      "Default credentials are kasm_user / password — change immediately.",
      "For persistent sessions, mount a volume to /home/kasm-user.",
      "Good companion with browser isolation and secure access use cases."
    ]
  env_generators:
    KASM_PASSWORD: { length: 20, charset: alnum_symbols }

services:
  kasmvnc:
    image: docker.io/kasmweb/core-ubuntu-jammy:1.11.0
    labels:
      yantr.app: kasmvnc
      yantr.service.6901: Web UI
      yantr.port.6901: HTTP
    ports:
      - "6901"
    environment:
      KASM_USER: ${KASM_USER:-kasm_user}
      KASM_PASSWORD: ${KASM_PASSWORD}
    shm_size: "2g"
    volumes:
      - kasmvnc_data:/home/kasm-user
    restart: unless-stopped

volumes:
  kasmvnc_data: null
