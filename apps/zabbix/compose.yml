x-yantr:
  name: Zabbix
  tags: [ monitoring, infrastructure, network, metrics, alerts ]
  short_description: Enterprise-class open source distributed monitoring solution.
  description: Zabbix is a mature, enterprise-level platform for monitoring the
    health and performance of your entire IT infrastructure. It collects metrics
    from servers, virtual machines, network devices, and applications in real
    time. It features advanced alerting, customizable dashboards, and
    auto-discovery...
  usecases:
    [
      "Monitor CPU, memory, disk, and network metrics for all your homelab
        servers.",
      Set up alerting to notify you via email or webhook when a service goes
        down.,
      Build custom dashboards to visualize the health of your entire network.,
      "Monitor IoT devices, routers, and switches using SNMP."
    ]
  website: https://www.zabbix.com
  notes:
    [
      The default login for the Web UI is Admin / zabbix (case-sensitive).
        Please change it after first login.,
      Port 10051 is exposed so external Zabbix Agents can report metrics to
        the server.
    ]
  env_generators:
    DB_PASSWORD:
      length: 32
      charset: alnum

services:
  zabbix-frontend:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    container_name: zabbix-frontend
    ports:
      - "8080"
    environment:
      DB_SERVER_HOST: zabbix-database
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:-UTC}
    depends_on:
      - zabbix-server
      - zabbix-database
    restart: unless-stopped
    labels:
      yantr.app: zabbix
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
      yantr.service.10051: Server Trapper
      yantr.port.10051: TCP
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    container_name: zabbix-server
    ports:
      - "10051"
    environment:
      DB_SERVER_HOST: zabbix-database
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - zabbix-database
    restart: unless-stopped
    labels:
      yantr.app: zabbix
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
      yantr.service.10051: Server Trapper
      yantr.port.10051: TCP
  zabbix-agent:
    image: zabbix/zabbix-agent2:latest
    container_name: zabbix-agent
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
    restart: unless-stopped
    labels:
      yantr.app: zabbix
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
      yantr.service.10051: Server Trapper
      yantr.port.10051: TCP
  zabbix-database:
    image: postgres:15-alpine
    container_name: zabbix-database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: zabbix
      yantr.service.8080: Web UI
      yantr.port.8080: HTTP
      yantr.service.10051: Server Trapper
      yantr.port.10051: TCP

volumes:
  zabbix_db: null
