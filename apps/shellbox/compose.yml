services:
  shellbox:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: shellbox
    labels:
      yantr.app: "shellbox"
      yantr.service: "SSH Server"
    environment:
      USER_NAME: ${USER_NAME}
      USER_PASSWORD: ${USER_PASSWORD}
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "true"
    ports:
      - "2222"
    volumes:
      - shellbox-data:/config
    restart: unless-stopped

  wetty:
    image: wettyoss/wetty:latest
    container_name: shellbox-web
    labels:
      yantr.app: "shellbox"
      yantr.service: "Web Terminal"
    environment:
      SSHHOST: shellbox
      SSHPORT: 2222
    ports:
      - "3000"
    depends_on:
      - shellbox
    restart: unless-stopped

volumes:
  shellbox-data:
    name: shellbox-data
