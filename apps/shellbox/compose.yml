x-yantr:
  name: Shellbox
  tags:
    - linux
    - ssh
    - terminal
    - server
    - self-hosted
  short_description: Linux container with SSH and web terminal access using username and password.
  description: A clean Linux container running an OpenSSH server (from
    linuxserver.io) with Wetty providing a web-based terminal. Username and
    password are set using environment variables. Connect from SSH clients or
    via the web terminal. Ideal as remote shell, development sandbox or isolated
    Linux environment.
  usecases:
    - Remote shell access over SSH or web terminal from any device on the
      network.
    - Lightweight Linux development sandbox for running scripts and tools.
    - Isolated Linux environment for testing and experimentation.
  website: https://docs.linuxserver.io/images/docker-openssh-server/
  logo: QmRBnPQrx3BfAUDeCB7Y5Qcy5zp2a1XAFVuZ6Ek2RHro89
  notes:
    - Web terminal available via the HTTP port; use SSH on the TCP port for
      native clients.
    - "Connect via SSH: ssh <USER_NAME>@<host> -p <mapped-port>"
    - Password authentication and sudo access are enabled by default.
  env_generators:
    USER_NAME:
      length: 8
      charset: alpha
    USER_PASSWORD:
      length: 12
      charset: alnum_symbols
services:
  shellbox:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: shellbox
    labels:
      yantr.app: shellbox
      yantr.service.2222: SSH
      yantr.port.2222: TCP
      yantr.service.3000: Web Terminal
      yantr.port.3000: HTTP
    environment:
      USER_NAME: ${USER_NAME}
      USER_PASSWORD: ${USER_PASSWORD}
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "true"
    ports:
      - "2222"
    volumes:
      - shellbox-data:/config
    restart: unless-stopped
  wetty:
    image: wettyoss/wetty:latest
    container_name: shellbox-web
    labels:
      yantr.app: shellbox
      yantr.service.2222: SSH
      yantr.port.2222: TCP
      yantr.service.3000: Web Terminal
      yantr.port.3000: HTTP
    environment:
      SSHHOST: shellbox
      SSHPORT: 2222
    ports:
      - "3000"
    depends_on:
      - shellbox
    restart: unless-stopped

volumes:
  shellbox-data:
    name: shellbox-data
