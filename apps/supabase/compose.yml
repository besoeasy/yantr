x-yantr:
  name: Supabase
  tags: [ database, backend, developer, api, self-hosted ]
  short_description: Open-source Firebase alternative with Postgres, auth,
    storage, and realtime APIs.
  description: Supabase is an open-source backend platform offering database,
    auth, storage, and realtime subscriptions. Self-hosted via Docker, it
    provides instant APIs, access control, and event triggers for modern web and
    mobile apps.
  usecases:
    [
      Build self-hosted web app backends with Postgres + REST/GrapqhQL APIs.,
      Manage users with built-in authentication and role-based access policies.,
      Host secure file storage with signed upload/download URLs.
    ]
  website: https://supabase.com/docs/guides/self-hosting
  logo: QmSupabaseLogoCID1234567890abcdef1234567890abc
  notes:
    [
      Adjust SUPABASE_JWT_SECRET and database password for production.,
      Supabase official Docker stack may also include additional services for
        edge functions and storage.
    ]

services:
  supabase-db:
    image: postgres:15-alpine
    container_name: supabase-db
    restart: unless-stopped
    labels:
      yantr.app: supabase
      yantr.service.54321: Web UI
      yantr.port.54321: HTTP
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: postgres
    volumes:
      - supabase_db:/var/lib/postgresql/data
  supabase:
    image: supabase/supabase:latest
    container_name: supabase
    restart: unless-stopped
    labels:
      yantr.app: supabase
      yantr.service.54321: Web UI
      yantr.port.54321: HTTP
    depends_on:
      - supabase-db
    ports:
      - "3000"
    environment:
      SUPABASE_DB_HOST: supabase-db
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: changeme
      SUPABASE_DB_NAME: postgres
      SUPABASE_JWT_SECRET: supersecretjwt
      SUPABASE_URL: http://localhost:54321
    volumes:
      - supabase_config:/var/lib/supabase

volumes:
  supabase_db: null
  supabase_config: null
