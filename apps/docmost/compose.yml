x-yantr:
  name: Docmost
  tags: [ wiki, documentation, collaboration, knowledge-base, self-hosted ]
  short_description: Open-source collaborative wiki and documentation platform.
  description: Docmost is an open-source collaborative wiki and documentation
    platform. Write with a powerful rich-text editor, organize content in spaces
    and pages, collaborate in real-time, manage permissions per workspace, and
    attach files and images to documents.
  usecases:
    [
      Build a team wiki with collaborative real-time editing.,
      Organize project documentation in structured spaces and pages.,
      Manage permissions and access control per workspace or page.
    ]
  website: https://docmost.com
  env_generators:
    POSTGRES_PASSWORD:
      length: 32
      charset: alnum
    APP_SECRET:
      length: 64
      charset: hex

services:
  db:
    image: postgres:16-alpine
    container_name: docmost-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmostuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - docmost_pgdata:/var/lib/postgresql/data
    labels:
      yantr.app: docmost
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  redis:
    image: redis:7-alpine
    container_name: docmost-redis
    restart: unless-stopped
    volumes:
      - docmost_redis:/data
    labels:
      yantr.app: docmost
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
  web:
    image: docmost/docmost:latest
    container_name: docmost-web
    restart: unless-stopped
    depends_on:
      - db
      - redis
    labels:
      yantr.app: docmost
      yantr.service.3000: Web UI
      yantr.port.3000: HTTP
    ports:
      - "3000"
    environment:
      TZ: ${TZ:-UTC}
      APP_URL: ""
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://docmostuser:${POSTGRES_PASSWORD}@docmost-db:5432/docmost?sslmode=disable
      REDIS_URL: redis://docmost-redis:6379
      DISABLE_TELEMETRY: "true"
    volumes:
      - docmost_storage:/app/data/storage

volumes:
  docmost_pgdata: null
  docmost_redis: null
  docmost_storage: null
