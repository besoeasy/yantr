x-yantr:
  name: Tailscale
  tags:
    - network
    - security
    - vpn
    - privacy
    - self-hosted
  short_description: Zero-config VPN using WireGuard protocol with easy mesh networking.
  description: Tailscale is a zero-config VPN that uses the WireGuard protocol to
    create a secure, encrypted tunnel between your devices. It makes it easy to
    connect your computers, phones, and servers together securely without the
    complexity of traditional VPNs. Unlike WireGuard, Tailscale handles the k...
  usecases:
    - Access your home network from anywhere by connecting to your Tailscale
      network.
    - Securely reach self-hosted services (Home Assistant, Jellyfin, etc.)
      without port forwarding.
    - Connect multiple devices across different networks into one secure mesh.
    - Use your home server as an exit node to encrypt your traffic on public
      WiFi.
  website: https://tailscale.com
  logo: QmTXkGMa8gn9aHA9tuywRnn15DvxhSz4hVZQjMSUWbR2Mz
  notes:
    - Port 41641 UDP must be open in your firewall for peer connections
    - Requires TAILSCALE_AUTH_KEY for unattended operation — generate one at
      https://login.tailscale.com/admin/settings/keys
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale
    network_mode: host
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY}
    labels:
      yantr.app: tailscale
      yantr.service.41641: VPN Tunnel
      yantr.port.41641: UDP

volumes:
  tailscale_state: null
