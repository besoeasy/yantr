x-yantr:
  name: transmission-autoclean
  tags: [torrent, download, p2p, self-hosted, docker, webdav]
  short_description: "BitTorrent client with auto-cleanup and WebDAV file access."
  description: >
    A self-hosted Transmission BitTorrent client with automatic cleanup
    of downloads older than 30 days. Includes a lightweight Dufs file
    browser with WebDAV support for accessing and streaming downloaded
    files from browsers, media players, and mobile devices.
  usecases:
    - "Download torrents."
    - "Auto-clean old files after 30 days."
    - "Browse files through a web interface."
    - "Access downloads via WebDAV."
    - "Self-host media downloads."
  website: "https://transmissionbt.com/"
  notes:
    - "Transmission Web UI on port 9091."
    - "Dufs file browser and WebDAV on port 5000."
    - "Dufs is read-only by default."
    - "Change default Transmission credentials after first login."
  env_generators:
    TRANSMISSION_USER: { length: 12, charset: alpha }
    TRANSMISSION_PASS: { length: 20, charset: alnum_symbols }

services:
  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission-autoclean
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      USER: ${TRANSMISSION_USER}
      PASS: ${TRANSMISSION_PASS}
    volumes:
      - transmission_ac_config:/config
      - transmission_ac_downloads:/downloads
      - transmission_ac_incomplete:/incomplete
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      yantr.app: "transmission-autoclean"
      yantr.service.9091: "Transmission Web UI"
      yantr.port.9091: "HTTP"
      yantr.service.51413: "BitTorrent Peers"
      yantr.port.51413: "TCP"
    restart: unless-stopped

  dufs:
    image: sigoden/dufs:latest
    container_name: transmission-autoclean-dufs
    command:
      - /downloads
      - --allow-search
      - --allow-archive
    volumes:
      - transmission_ac_downloads:/downloads:ro
    ports:
      - "5000:5000"
    security_opt:
      - no-new-privileges:true
    labels:
      yantr.app: "transmission-autoclean"
      yantr.service.5000: "Files & WebDAV"
      yantr.port.5000: "HTTP"
    restart: unless-stopped

  cleanup:
    image: alpine:latest
    container_name: transmission-autoclean-cleanup
    security_opt:
      - no-new-privileges:true
    labels:
      yantr.app: "transmission-autoclean"
    volumes:
      - transmission_ac_downloads:/downloads
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache dcron >/dev/null

        cat >/etc/crontabs/root <<'EOF'
        0 3 * * * find /downloads/completed -type f -mtime +30 -delete 2>/dev/null
        5 3 * * * find /downloads/completed -type d -empty -delete 2>/dev/null
        EOF

        crond -f -l 2
    restart: unless-stopped

volumes:
  transmission_ac_config:
  transmission_ac_downloads:
  transmission_ac_incomplete:
