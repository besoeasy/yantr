x-yantr:
  name: Rotki
  tags: [ productivity, security, utility, bitcoin, crypto ]
  short_description: Self-hosted crypto portfolio tracker with DeFi support, tax
    reports, and privacy focus.
  description: >
    Rotki is a privacy-focused cryptocurrency portfolio tracker and DeFi analyzer.
    Connect exchanges and wallets, review holdings and transactions, inspect
    staking, lending, and liquidity positions, and generate performance or tax
    reports. Run it locally to keep financial data under your control.
  usecases:
    [
      Track all your crypto holdings across exchanges in one dashboard.,
      "Monitor DeFi positions - staked tokens, liquidity pools, lending
        positions.",
      Generate tax reports for cryptocurrency transactions.,
      Analyze your trading history and profit/loss over time.
    ]
  website: https://rotki.com/
  notes:
    [
      API integration with major exchanges for automatic updates,
      "Supports hardware wallets (Ledger, Trezor)",
      Data stored locally - no third party can see your holdings
    ]

services:
  rotki:
    image: docker.io/rotki/rotki:latest
    labels:
      yantr.app: rotki
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - rotki_data:/data
    restart: unless-stopped

volumes:
  rotki_data: null
