x-yantr:
  name: Rotki
  tags:
    - productivity
    - security
    - utility
    - bitcoin
    - crypto
  short_description: Self-hosted crypto portfolio tracker with DeFi support, tax
    reports, and privacy focus.
  description: Rotki is a free, open-source portfolio tracker and DeFi wallet
    analyzer with a focus on privacy. It helps you track your cryptocurrency
    holdings across wallets and exchanges, analyzes DeFi positions, calculates
    profits/losses, and generates tax reports. Features include support for 50+
    exc...
  usecases:
    - Track all your crypto holdings across exchanges in one dashboard.
    - Monitor DeFi positions - staked tokens, liquidity pools, lending positions.
    - Generate tax reports for cryptocurrency transactions.
    - Analyze your trading history and profit/loss over time.
  website: https://rotki.com/
  logo: QmXg6Zmw6rFktbgFCFkuEA15BfK3fJGLUTuZqm53GwWa1z
  notes:
    - API integration with major exchanges for automatic updates
    - Supports hardware wallets (Ledger, Trezor)
    - Data stored locally - no third party can see your holdings
services:
  rotki:
    image: rotki/rotki:latest
    container_name: rotki
    labels:
      yantr.app: rotki
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    ports:
      - "80"
    volumes:
      - rotki_data:/data
    restart: unless-stopped

volumes:
  rotki_data: null
