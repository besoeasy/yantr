x-yantr:
  name: Tandoor Recipes
  tags:
    - recipes
    - cooking
    - meal-planning
    - food
    - self-hosted
  short_description: Self-hosted recipe manager with meal planning and shopping lists.
  description: Tandoor Recipes is a self-hosted recipe management app. Import
    recipes from URLs, organize with tags and books, plan meals for the week,
    and auto-generate shopping lists based on your meal plan. This covers meal
    planning and shopping.
  usecases:
    - Import and manage recipes from any website automatically.
    - Plan weekly meals and generate smart grocery lists.
    - Share recipes with family or cooking community.
  website: https://tandoor.dev
  env_generators:
    SECRET_KEY:
      length: 50
      charset: alnum
    DB_PASSWORD:
      length: 24
      charset: alnum
services:
  web:
    image: vabene1111/recipes:latest
    container_name: tandoor-web
    labels:
      yantr.app: tandoor
      yantr.service.80: Web UI
      yantr.port.80: HTTP
    environment:
      TZ: ${TZ:-UTC}
      SECRET_KEY: ${SECRET_KEY}
      TANDOOR_PORT: 80
      ALLOWED_HOSTS: "*"
      ENABLE_SIGNUP: "0"
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: tandoor-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: tandoor
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "80"
    volumes:
      - tandoor_staticfiles:/opt/recipes/staticfiles
      - tandoor_mediafiles:/opt/recipes/mediafiles
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:latest
    container_name: tandoor-db
    environment:
      POSTGRES_DB: tandoor
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tandoor_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: tandoor
      yantr.service.80: Web UI
      yantr.port.80: HTTP

volumes:
  tandoor_staticfiles: null
  tandoor_mediafiles: null
  tandoor_db: null
