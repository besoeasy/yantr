<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C1626"/>
      <stop offset="55%" stop-color="#12233D"/>
      <stop offset="100%" stop-color="#1B3A5C"/>
    </linearGradient>
    <linearGradient id="ring" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="planeTop" x1="66" y1="80" x2="190" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="planeBottom" x1="104" y1="138" x2="190" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.55"/>
  <circle cx="128" cy="124" r="86" fill="url(#halo)"/>

  <!-- motion trail -->
  <path d="M38 182 Q68 176 88 160" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M32 202 Q70 196 96 176" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.18"/>
  <circle cx="32" cy="202" r="5" fill="#38BDF8" opacity="0.5"/>

  <!-- code brackets -->
  <path d="M52 108 L38 124 L52 140" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path d="M204 108 L218 124 L204 140" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>

  <!-- paper plane: nose (198,70), tail (58,118), keel (124,138), fin (98,182) -->
  <path d="M198 70 L58 118 L124 138 Z" fill="url(#planeTop)"/>
  <path d="M198 70 L124 138 L98 182 Z" fill="url(#planeBottom)"/>
  <path d="M124 138 L138 141 L198 70 Z" fill="#FFFFFF" opacity="0.35"/>
  <path d="M58 118 L124 138 L118 145 L58 127 Z" fill="#0B1B30" opacity="0.3"/>
  <path d="M124 138 L98 182 L112 142 Z" fill="#0B1B30" opacity="0.25"/>

  <!-- AI spark -->
  <path d="M188 160 l4.5 10.5 10.5 4.5 -10.5 4.5 -4.5 10.5 -4.5 -10.5 -10.5 -4.5 10.5 -4.5 Z" fill="#7DD3FC" opacity="0.9"/>
  <circle cx="72" cy="70" r="5" fill="#22D3EE" opacity="0.7"/>
</svg>
