name: CI

# Gate on the two things that are otherwise invisible until a user hits them:
# the Go build/vet/test suite, and the frontend correctness lint.
#
# The image release is deliberately NOT triggered from here — ghcr.yml is
# workflow_dispatch so a maintainer controls publishing, and this workflow must
# not be able to push an image.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: core/go.sum

      - name: Build
        working-directory: core
        run: go build ./...

      - name: Vet
        working-directory: core
        run: go vet ./...

      # -race is included here deliberately. It cannot be run in the gVisor-based
      # sandbox this work was developed in (ThreadSanitizer rejects its VMA
      # layout), which is exactly why it belongs in CI: the supervisor, the job
      # store, the browser registry and the project locks are all concurrent.
      - name: Test
        working-directory: core
        run: go test -race -count=1 ./...

  ui:
    name: UI lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci --no-audit --no-fund

      # Fails the build on the a11y and correctness rules, notably
      # no-static-element-interactions and click-events-have-key-events — the
      # pair that would have caught the service headers shipping as click-only
      # divs (issue #98).
      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build
