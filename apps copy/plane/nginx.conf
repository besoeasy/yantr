# Plane NGINX router
map $http_x_forwarded_port $final_port {
    default $http_x_forwarded_port;
    ""      80;
}

map $http_x_forwarded_proto $final_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
  listen 80;

  # Plane env defaults to 50 MB
  client_max_body_size 50m;

  port_in_redirect off;
  absolute_redirect off;

  proxy_set_header Host                $http_host;
  proxy_set_header X-Real-IP           $remote_addr;
  proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto   $final_proto;
  proxy_set_header X-Forwarded-Host    $http_host;
  proxy_set_header X-Forwarded-Port    $final_port;

  location /spaces/ {
    proxy_pass http://plane-space:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /god-mode/ {
    proxy_pass http://plane-admin:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /live/ {
    proxy_pass http://plane-live:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /api/ {
    proxy_pass http://plane-api:8000;
  }

  location /auth/ {
    proxy_pass http://plane-api:8000;
  }

  location /uploads {
    proxy_pass http://plane-minio:9000;
  }

  location / {
    proxy_pass http://plane-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
