services:
  vscode:
    image: lscr.io/linuxserver/code-server:latest
    container_name: vscode
    environment:
      PASSWORD: ${PASSWORD}
      SUDO_PASSWORD: ${PASSWORD}
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
    ports:
      - "8443"
    volumes:
      - vscode-data:/config
    restart: unless-stopped
    labels:
      yantr.app: "vscode"
      yantr.service: "VS Code"

volumes:
  vscode-data:
    name: vscode-data