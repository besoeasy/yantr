services:
  invidious:
    image: ceramicwhite/invidious:latest
    container_name: invidious
    ports:
      - "3000"
    user: "1000:1000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: ${DB_PASSWORD}
          host: invidious-postgres
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: ${COMPANION_SECRET}
        hmac_key: ${HMAC_KEY}
        default_user_preferences:
          feed_menu: ["Trending", "Subscriptions", "Playlists"]
          default_home: Trending
    depends_on:
      - invidious-postgres
    restart: unless-stopped
    labels:
      yantr.app: "invidious"
      yantr.service: "Web UI"

  invidious-postgres:
    image: postgres:13-alpine
    container_name: invidious-postgres
    user: "1000:1000"
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - invidious_db:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      yantr.app: "invidious"
      yantr.service: "Database"

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    user: "1000:1000"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - invidious_companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true
    environment:
      SERVER_SECRET_KEY: ${COMPANION_SECRET}
    restart: unless-stopped
    labels:
      yantr.app: "invidious"
      yantr.service: "Companion API"

volumes:
  invidious_db:
  invidious_companioncache:
