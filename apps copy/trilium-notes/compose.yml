services:
  server:
    image: triliumnext/trilium:latest
    container_name: trilium-notes-server
    restart: unless-stopped
    labels:
      yantr.app: "trilium-notes"
      yantr.service: "Web UI"
    ports:
      - "8080"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - trilium_data:/home/node/trilium-data

volumes:
  trilium_data:
