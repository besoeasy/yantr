services:
  server:
    image: filebrowser/filebrowser:latest
    container_name: file-browser
    labels:
      yantr.app: "file-browser"
      yantr.service: "Web UI"
    restart: unless-stopped
    environment:
      FB_PORT: 80
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /data
      FB_NOAUTH: "true"
    ports:
      - "80"
    volumes:
      - file_browser_db:/database
      - file_browser_data:/data

volumes:
  file_browser_db:
  file_browser_data:
